<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAA-C03 Adaptive Portal</title>
  <meta name="description" content="AWS SAA-C03 Smart Adaptive Portal — forced diagnostic baseline, blind-spot analytics and an adaptive coaching core with concept masterclasses.">
  <meta name="theme-color" content="#0f172a">
  <script>
    // Resolve theme before first paint (dark by default).
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('saaPortal.v1') || '{}');
        if (s.theme === 'light') document.documentElement.classList.remove('dark');
      } catch (e) {}
    })();
  </script>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'Segoe UI', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Consolas', 'monospace'],
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    html { scroll-behavior: smooth; }
    [hidden] { display: none !important; }
    .fade-in { animation: fadeIn .22s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .pulse-ring { animation: pulseRing 1.6s ease-out 3; }
    @keyframes pulseRing { 0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, .6); } 100% { box-shadow: 0 0 0 14px rgba(245, 158, 11, 0); } }
    #drawer-panel { transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
    #drawer-overlay { transition: opacity .28s ease; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }
    .thin-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .thin-scroll::-webkit-scrollbar-thumb { background: rgb(100 116 139 / .45); border-radius: 3px; }
    kbd { display: inline-block; min-width: 1.2rem; padding: 0 .3rem; border: 1px solid rgb(148 163 184 / .6); border-bottom-width: 2px; border-radius: .3rem; font: 500 .68rem 'JetBrains Mono', monospace; text-align: center; }
    dialog::backdrop { background: rgb(2 6 23 / .65); backdrop-filter: blur(2px); }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .fade-in, .pulse-ring { animation: none !important; }
      #drawer-panel, #drawer-overlay { transition: none !important; }
    }
  </style>
</head>
<body class="min-h-screen bg-slate-100 font-sans text-slate-800 antialiased dark:bg-slate-900 dark:text-slate-200">
  <!-- ===== Onboarding gate: the only thing a visitor sees until Step 1 is submitted ===== -->
  <div id="gate" hidden></div>

  <!-- ===== App shell: hidden and inert until a training session exists ===== -->
  <div id="shell" hidden inert>
  <a href="#view" class="sr-only focus:not-sr-only focus:fixed focus:left-3 focus:top-3 focus:z-50 focus:rounded-lg focus:bg-amber-500 focus:px-3 focus:py-2 focus:text-slate-900">Skip to content</a>

  <!-- ===== Header (personal logo, upper-left) ===== -->
  <header class="sticky top-0 z-40 h-16 border-b border-slate-200 bg-white/90 backdrop-blur dark:border-slate-700/70 dark:bg-slate-900/90">
    <div class="flex h-full items-center gap-3 px-4 sm:px-6">
      <button type="button" data-action="nav" data-view="welcome" class="flex min-w-0 items-center gap-3 rounded-lg focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-500" aria-label="Portal home">
        <img id="brand-logo" alt="Venkataguruswami logo" class="h-12 w-auto max-w-[72px] shrink-0 object-contain drop-shadow-[0_0_6px_rgba(59,130,246,.35)]">
        <span class="min-w-0 text-left leading-tight">
          <span id="brand-owner" class="block truncate text-sm font-extrabold tracking-tight">Venkataguruswami</span>
          <span class="block truncate text-xs font-medium text-amber-600 dark:text-amber-400">AWS SAA-C03 Smart Adaptive Portal</span>
        </span>
      </button>
      <div class="ml-auto flex items-center gap-2">
        <div id="header-status" class="hidden items-center gap-2 text-xs md:flex"></div>
        <button type="button" data-action="theme" class="rounded-lg p-2 text-slate-500 hover:bg-slate-100 hover:text-slate-800 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-100" aria-label="Toggle light / dark theme" title="Toggle theme">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button type="button" data-action="settings" class="rounded-lg p-2 text-slate-500 hover:bg-slate-100 hover:text-slate-800 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-100" aria-label="Portal settings" title="Settings">
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="lg:flex">
    <!-- ===== Sidebar (desktop) ===== -->
    <aside class="sticky top-16 hidden h-[calc(100vh-4rem)] w-64 shrink-0 flex-col overflow-y-auto border-r border-slate-200 bg-white thin-scroll dark:border-slate-700/70 dark:bg-slate-800 lg:flex" aria-label="Learning path">
      <div class="px-4 pb-2 pt-5 text-[11px] font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Learning path</div>
      <nav id="side-nav" class="flex flex-col gap-1 px-3"></nav>
      <div id="side-meta" class="mt-auto border-t border-slate-200 p-4 dark:border-slate-700"></div>
    </aside>

    <div class="min-w-0 flex-1">
      <!-- ===== Mobile path nav ===== -->
      <nav id="mobile-nav" class="no-scrollbar sticky top-16 z-30 flex gap-1 overflow-x-auto border-b border-slate-200 bg-white/95 px-3 py-2 backdrop-blur dark:border-slate-700/70 dark:bg-slate-800/95 lg:hidden" aria-label="Learning path"></nav>
      <main id="view" tabindex="-1" class="mx-auto max-w-7xl px-4 py-6 focus:outline-none sm:px-6 lg:py-8"></main>
    </div>
  </div>
  </div><!-- /#shell -->

  <!-- ===== Master It drawer ===== -->
  <div id="drawer" class="fixed inset-0 z-50" hidden>
    <div id="drawer-overlay" data-action="close-drawer" class="absolute inset-0 bg-slate-950/60 opacity-0"></div>
    <section id="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title"
      class="absolute inset-y-0 right-0 flex w-full max-w-2xl translate-x-full flex-col border-l border-slate-200 bg-white shadow-2xl dark:border-slate-700 dark:bg-slate-900">
    </section>
  </div>

  <!-- ===== Settings ===== -->
  <dialog id="settings" class="w-[min(92vw,440px)] rounded-2xl border border-slate-200 bg-white p-0 text-slate-800 shadow-2xl dark:border-slate-700 dark:bg-slate-800 dark:text-slate-100">
    <div class="flex items-center justify-between border-b border-slate-200 px-5 py-4 dark:border-slate-700">
      <h2 class="text-base font-bold">Portal settings</h2>
      <button type="button" data-action="close-settings" class="rounded-lg p-1.5 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700" aria-label="Close settings">✕</button>
    </div>
    <div class="space-y-5 px-5 py-5 text-sm">
      <div>
        <div class="mb-2 text-[11px] font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Header logo</div>
        <div class="flex items-center gap-3">
          <img id="settings-logo" alt="" class="h-12 w-auto max-w-[96px] object-contain">
          <label class="inline-flex cursor-pointer items-center rounded-lg border border-slate-300 px-3 py-1.5 font-semibold hover:bg-slate-50 dark:border-slate-600 dark:hover:bg-slate-700">
            Replace…<input id="logo-input" type="file" accept="image/png,image/jpeg,image/svg+xml,image/webp" class="sr-only">
          </label>
          <button type="button" data-action="reset-logo" class="rounded-lg px-3 py-1.5 font-semibold text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700">Default</button>
        </div>
        <p class="mt-2 text-xs text-slate-500 dark:text-slate-400">Your personal logo is embedded as the default. A replacement is stored only in this browser.</p>
      </div>
      <div>
        <div class="mb-2 text-[11px] font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Progress data</div>
        <div class="flex flex-wrap gap-2">
          <button type="button" data-action="export-progress" class="rounded-lg border border-slate-300 px-3 py-1.5 font-semibold hover:bg-slate-50 dark:border-slate-600 dark:hover:bg-slate-700">Export progress (.json)</button>
          <button type="button" data-action="reset-all" class="rounded-lg border border-rose-300 px-3 py-1.5 font-semibold text-rose-600 hover:bg-rose-50 dark:border-rose-500/40 dark:text-rose-300 dark:hover:bg-rose-500/10">Reset portal</button>
        </div>
      </div>
    </div>
  </dialog>

  <div id="toast" class="pointer-events-none fixed bottom-5 left-1/2 z-[60] -translate-x-1/2" role="status" aria-live="polite"></div>

const qType = (q) => q.type || 'mcq';

function isAnswered(q, r) {

    case 'fill': return typeof r === 'string' && normFill(r).length > 0;

    case 'fill': return q.accept.some((a) => normFill(a) === normFill(r));

}

/** Fisher-Yates shuffle driven by the Web Crypto RNG. */
function shuffle(arr) {
  const a = arr.slice();
  const rnd = new Uint32Array(1);
  for (let i = a.length - 1; i > 0; i--) {
    crypto.getRandomValues(rnd);
    const j = rnd[0] % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }

}

function loadState() {
  try {
    const raw = JSON.parse(localStorage.getItem(CONFIG.storageKey) || 'null');
    if (!raw || raw.version !== 1) return defaultState();
    const base = defaultState();
    const s = { ...base, ...raw, diagnostic: { ...base.diagnostic, ...raw.diagnostic }, drill: { ...base.drill, ...raw.drill },
      tracked: { ...base.tracked, ...raw.tracked }, remediation: { ...base.remediation, ...raw.remediation },
      practice: { ...base.practice, ...raw.practice } };
    if (s.profile && LEGACY_LEVELS[s.profile.level]) s.profile = { ...s.profile, level: LEGACY_LEVELS[s.profile.level] };
    // Baselines saved before the remediation categories existed: derive them from the answer items.
    if (s.baseline && !s.baseline.byCategory) {
      const byCategory = {};
      for (const it of s.baseline.items || []) {
        const cat = CONCEPT_CATEGORY[QUESTIONS.get(it.qid)?.concept];
        if (!cat) continue;
        const t = (byCategory[cat] ??= { n: 0, c: 0 }); t.n++; if (it.correct) t.c++;
      }
      s.baseline.byCategory = byCategory;
      s.baseline.weakCategories = Object.keys(byCategory).filter((k) => byCategory[k].c / byCategory[k].n < CONFIG.stuckThreshold)
        .sort((a, b) => byCategory[a].c / byCategory[a].n - byCategory[b].c / byCategory[b].n);
    }
    if (s.practice.active && !POOL_ORDER[`set${s.practice.active.set}`]) s.practice.active = null;
    return s;
  } catch { return defaultState(); }
}

let S = loadState();
let saveTimer = null;
function persistNow() {
  clearTimeout(saveTimer); saveTimer = null;
  try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(S)); }
  catch { toast('Progress could not be saved (storage full or blocked).', 'error'); }
}
function persist() { clearTimeout(saveTimer); saveTimer = setTimeout(persistNow, 200); }
window.addEventListener('pagehide', () => { if (saveTimer) persistNow(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && saveTimer) persistNow(); });
// Keep multiple tabs consistent without polling.
window.addEventListener('storage', (e) => { if (e.key === CONFIG.storageKey) { S = loadState(); applyTheme(); applyLogo(); render(); } });

/** Accept only YouTube video/playlist URLs; return a privacy-enhanced embed URL. */
function youtubeEmbed(url) {
  try {
    const u = new URL(url);
    const host = u.hostname.replace(/^www\.|^m\./, '');
    if (!['youtube.com', 'youtu.be', 'youtube-nocookie.com'].includes(host)) return null;
    const list = u.searchParams.get('list');
    let id = null;
    if (host === 'youtu.be') id = u.pathname.slice(1);
    else if (u.pathname === '/watch') id = u.searchParams.get('v');
    else if (/^\/(embed|shorts|live)\//.test(u.pathname)) id = u.pathname.split('/')[2];
    const okId = id && /^[\w-]{11}$/.test(id);
    const okList = list && /^[\w-]{10,64}$/.test(list);
    if (okId) return `https://www.youtube-nocookie.com/embed/${id}${okList ? `?list=${list}` : ''}`;
    if (okList) return `https://www.youtube-nocookie.com/embed/videoseries?list=${list}`;
  } catch { /* invalid URL */ }
  return null;
}

/* =====================================================================
   6. ANALYTICS ENGINE
   Mastery counts only first answers of each serving (retries excluded).
   ===================================================================== */
function tally(keyFn) {
  const out = {};
  for (const a of S.attempts) {
    if (a.retry) continue;
    const k = keyFn(a);
    const t = (out[k] ??= { n: 0, c: 0 });
    t.n++; if (a.correct) t.c++;
  }
  for (const t of Object.values(out)) t.pct = pct(t.c, t.n);
  return out;
}

function conceptTable() {
  const live = tally((a) => a.concept);
  const base = S.baseline?.byConcept || {};
  return Object.entries(CONCEPTS).map(([id, c]) => {
    const l = live[id] || { n: 0, c: 0, pct: null };
    const b = base[id];
    const bPct = b ? pct(b.c, b.n) : null;
    let status = 'untested';
    if (l.n) {
      if (l.pct < T) status = bPct != null && bPct < T && l.pct > bPct ? 'recovering' : 'stuck';
      else status = bPct != null && bPct < T ? 'resolved' : 'solid';
    }
    const drillHist = S.attempts.filter((a) => a.concept === id && a.source === 'drill');
    return { id, ...c, n: l.n, c: l.c, pct: l.pct, base: b, basePct: bPct, status, drillN: drillHist.filter((a) => !a.retry).length, wrong: drillHist.filter((a) => !a.correct).length };
  });
}

function domainTable() {
  const live = tally((a) => a.domain);
  const base = S.baseline?.byDomain || {};
  return DOMAIN_KEYS.map((k) => {
    const l = live[k] || { n: 0, c: 0, pct: null };
    const b = base[k];
    const drill = S.attempts.filter((a) => a.domain === k && a.source === 'drill' && !a.retry);
    return {
      key: k, ...DOMAINS[k], n: l.n, c: l.c, pct: l.pct, base: b, basePct: b ? pct(b.c, b.n) : null,
      drillN: drill.length, drillC: drill.filter((a) => a.correct).length,
      status: !l.n ? 'untested' : l.pct < T ? 'stuck' : 'solid',
    };
  });
}

function heatMatrix() {
  const t = tally((a) => `${a.domain}|${a.area}`);
  return DOMAIN_KEYS.map((d) => ({ domain: d, cells: AREA_KEYS.map((ar) => ({ area: ar, ...(t[`${d}|${ar}`] || { n: 0, c: 0, pct: null }) })) }));
}

function overall() {
  const live = S.attempts.filter((a) => !a.retry);
  const c = live.filter((a) => a.correct).length;
  let w = 0, acc = 0;
  for (const d of domainTable()) if (d.n) { w += d.weight; acc += d.weight * d.pct; }
  return { n: live.length, c, pct: pct(c, live.length), weighted: w ? acc / w : null };
}

const stuckConceptIds = () => new Set(conceptTable().filter((c) => c.status === 'stuck' || c.status === 'recovering').map((c) => c.id));

/** Adaptive ranking of drill scenarios, with human-readable reasons. */
function rankDrills() {
  const stuck = stuckConceptIds();
  const stuckDomains = new Set(domainTable().filter((d) => d.status === 'stuck').map((d) => d.key));
  return DRILLS.map((q) => {
    const hist = S.attempts.filter((a) => a.qid === q.id && !a.retry);
    const last = hist[hist.length - 1];
    let score = 0;
    const reasons = [];
    if (stuck.has(q.concept)) { score += 5; reasons.push('Blind spot'); }
    else if (CONCEPTS[q.concept].related.some((r) => stuck.has(r))) { score += 2; reasons.push('Linked to blind spot'); }
    if (!hist.length) { score += 2; reasons.push('New'); }
    else if (!last.correct) { score += 3; reasons.push('Missed last time'); }
    else { score -= 2; reasons.push('Mastered'); }
    if (stuckDomains.has(q.domain)) score += 1;
    if (S.confused[q.id] && !(last && last.correct)) { score += 2; reasons.push('Flagged confused'); }
    const r = S.drill.recent.indexOf(q.id);
    if (r >= 0) score -= 6 - r;
    return { q, score, reasons };
  }).sort((a, b) => b.score - a.score || a.q.id.localeCompare(b.q.id));
}

function recordAttempt(q, choice, source, retry) {
  const c = CONCEPTS[q.concept];
  S.attempts.push({ ts: Date.now(), qid: q.id, source, concept: q.concept, area: c.area, domain: q.domain, choice, correct: isCorrect(q, choice), retry: !!retry });
}

// Every section is open from the start; the diagnostic is recommended, not required.
const diagnosticDone = () => !!S.diagnostic.completedAt;

function go(view) {
  if (!VIEWS[view] || !hasSession()) return;
  S.view = view;
  if (view === 'diagnostic' && !S.diagnostic.startedAt) S.diagnostic.startedAt = Date.now();
  if (view === 'coach' && !S.drill.currentId) pickNextDrill(false);
  persist(); render();
  window.scrollTo({ top: 0 });
  $('#view').focus({ preventScroll: true });
}

function submitDiagnostic() {
  const ans = S.diagnostic.answers;
  const missing = DIAGNOSTIC.filter((q) => !isAnswered(q, ans[q.id])).length;
  if (missing) { toast(`Answer all ${DIAGNOSTIC.length} questions — ${missing} left.`, 'error'); return; }
  const byDomain = {}, byConcept = {}, byCategory = {}, items = [];
  for (const q of DIAGNOSTIC) {
    const ok = isCorrect(q, ans[q.id]);
    recordAttempt(q, ans[q.id], 'diagnostic', false);
    for (const [bucket, key] of [[byDomain, q.domain], [byConcept, q.concept], [byCategory, CONCEPT_CATEGORY[q.concept]]]) {
      const t = (bucket[key] ??= { n: 0, c: 0 }); t.n++; if (ok) t.c++;
    }
    items.push({ qid: q.id, choice: ans[q.id], correct: ok });
  }
  const correct = items.filter((i) => i.correct).length;
  const rate = (t) => t.c / t.n;
  // Weak categories: below the benchmark, lowest first.
  const weakCategories = Object.keys(byCategory).filter((k) => rate(byCategory[k]) < T).sort((a, b) => rate(byCategory[a]) - rate(byCategory[b]));
  S.baseline = {
    ts: Date.now(), correct, total: DIAGNOSTIC.length, pct: correct / DIAGNOSTIC.length,
    byDomain, byConcept, byCategory, items, weakCategories,
    stuckDomains: Object.keys(byDomain).filter((k) => rate(byDomain[k]) < T),
    stuckConcepts: Object.keys(byConcept).filter((k) => rate(byConcept[k]) < T),
  };
  // A topic that is weak again on this baseline must be re-mastered.
  for (const k of weakCategories) delete S.remediation.mastered[k];
  S.diagnostic.completedAt = Date.now();
  S.diagnostic.runs = (S.diagnostic.runs || 0) + 1;
  S.drill = { currentId: null, selected: null, evaluated: false, retry: false, recent: [] };
  track('diagnostic_complete', { scorePct: Math.round(S.baseline.pct * 100), correct, total: DIAGNOSTIC.length, run: S.diagnostic.runs,
    weakAreas: weakCategories.map((k) => `${CATEGORIES[k].name} ${Math.round(rate(byCategory[k]) * 100)}%`) });
  checkMilestones();
  toast(weakCategories.length ? 'Baseline captured. Your Personalised Remediation Zone is ready.' : 'Baseline captured. No weak topics — practice exams are unlocked.', 'ok');
  go(weakCategories.length ? 'remediation' : 'analytics');
}

function retakeDiagnostic() {
  if (!confirm('Retake the diagnostic baseline? Your drill history is kept; the baseline snapshot will be replaced when you submit.')) return;
  S.diagnostic.answers = {}; S.diagnostic.index = 0; S.diagnostic.startedAt = Date.now();
  persist();
  S.view = 'diagnostic'; render(); window.scrollTo({ top: 0 });
}

function pickNextDrill(announce = true) {
  const ranked = rankDrills().filter((r) => r.q.id !== S.drill.currentId);
  setDrill(ranked[0].q.id);
  if (announce) toast(`Next: ${CONCEPTS[ranked[0].q.concept].name}${ranked[0].reasons[0] ? ` · ${ranked[0].reasons[0]}` : ''}`);
}
function setDrill(qid) {
  S.drill.currentId = qid; S.drill.selected = null; S.drill.evaluated = false; S.drill.retry = false;
  S.drill.recent = [qid, ...S.drill.recent.filter((x) => x !== qid)].slice(0, 3);
}

function answerDrill(idx) {
  const d = S.drill, q = QUESTIONS.get(d.currentId);
  if (!q || d.evaluated) return;
  d.selected = idx; d.evaluated = true;
  recordAttempt(q, idx, 'drill', d.retry);
  const ok = idx === q.answer;
  if (!ok) S.wrong[q.id] = (S.wrong[q.id] || 0) + 1;
  const newlyUnlocked = !ok && !S.unlocked[q.id] && S.wrong[q.id] >= CONFIG.masterItAfterWrong;
  if (newlyUnlocked) S.unlocked[q.id] = true;
  if (!d.retry) checkMilestones();
  persist(); render();
  if (newlyUnlocked) toast('Missed twice. The "Master It" masterclass is recommended.', 'amber');
  else toast(ok ? 'Correct — see the architectural proof.' : 'Not quite — read the elimination logic.', ok ? 'ok' : 'error');
}

function toggleConfused() {
  const id = S.drill.currentId;
  S.confused[id] = !S.confused[id];
  let unlockedNow = false;
  if (S.confused[id] && !S.unlocked[id]) { S.unlocked[id] = true; unlockedNow = true; }
  persist(); render();
  if (unlockedNow) toast('Flagged as confused. The "Master It" masterclass is recommended.', 'amber');
}

/* =====================================================================
   7b. SESSION GATE + PROGRESS STREAM
   Nothing but Step 1 renders until a training session exists. Events go to
   /api/track-session; anything that can't be delivered waits in a localStorage
   outbox and is retried, so a network dropout never blocks or breaks the UI.
   ===================================================================== */
function storeGet(kind, key) { try { return JSON.parse(window[kind].getItem(key) || 'null'); } catch { return null; } }
function storeSet(kind, key, value) {
  try { if (value == null) window[kind].removeItem(key); else window[kind].setItem(key, JSON.stringify(value)); return true; }
  catch { return false; }
}

let SESSION = storeGet('sessionStorage', CONFIG.sessionKey);   // { id, startedAt, synced }
const hasSession = () => !!(SESSION?.id && S.profile?.name);
const newId = () => (crypto.randomUUID ? crypto.randomUUID()
  : `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 12)}`);
const todayISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const retryable = (status) => status === 0 || status === 408 || status === 429 || status >= 500;

function setSession(value) { SESSION = value; storeSet('sessionStorage', CONFIG.sessionKey, value); }

/** POST one event. Never throws: returns { ok, status, data }; status 0 means the network failed. */
async function postEvent(body, timeoutMs = 8000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(CONFIG.trackEndpoint, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
      signal: ctrl.signal, keepalive: true, credentials: 'same-origin',
    });
    let data = null;
    try { data = await res.json(); } catch { /* non-JSON error page */ }
    return { ok: res.ok && data?.ok === true, status: res.status, data };
  } catch {
    return { ok: false, status: 0, data: null };
  } finally {
    clearTimeout(timer);
  }
}

const outbox = {
  load: () => (storeGet('localStorage', CONFIG.outboxKey) || []).filter((i) => Date.now() - i.ts < 7 * 864e5),
  save: (q) => storeSet('localStorage', CONFIG.outboxKey, q.length ? q.slice(-CONFIG.outboxMax) : null),
};
let flushing = false, retryTimer = null, retryDelay = 15000;

function enqueue(event, sessionId, data) {
  const item = { id: newId(), event, sessionId, data, ts: Date.now() };
  if (!outbox.save([...outbox.load(), item])) {   // storage blocked: one direct attempt, no retry
    postEvent({ event, sessionId, data });
    return;
  }
  flushOutbox();
}

/** Stream a progress event for the current learner (background, fire-and-forget). */
function track(event, data) {
  if (!hasSession()) return;
  enqueue(event, SESSION.id, { name: S.profile.name, ...data });
}

function flushOutbox() {
  if (flushing) return;
  // One tab at a time, so two open tabs don't send the same event twice.
  const run = () => drainOutbox();
  if (navigator.locks?.request) navigator.locks.request('saaPortal.outbox', { ifAvailable: true }, (lock) => (lock ? run() : null));
  else run();
}

async function drainOutbox() {
  if (flushing) return;
  flushing = true; clearTimeout(retryTimer);
  try {
    for (let q = outbox.load(); q.length; q = outbox.load()) {
      const item = q[0];
      const res = await postEvent({ event: item.event, sessionId: item.sessionId, data: item.data });
      if (!res.ok && retryable(res.status)) {          // offline or server trouble: back off and keep the item
        retryTimer = setTimeout(flushOutbox, retryDelay);
        retryDelay = Math.min(retryDelay * 2, 5 * 60e3);
        return;
      }
      // Delivered, or permanently rejected (a 4xx won't succeed on retry): drop it either way.
      outbox.save(outbox.load().filter((i) => i.id !== item.id));
      if (res.ok && item.event === 'session_start' && SESSION?.id === item.sessionId) setSession({ ...SESSION, synced: true });
    }
    retryDelay = 15000;
  } finally {
    flushing = false;
  }
}
window.addEventListener('online', flushOutbox);

/** Step 1 submit: validate, open the session, then unlock the portal. */
let gateBusy = false;
async function startSession(form) {
  if (gateBusy) return;
  const fd = new FormData(form);
  const profile = {
    name: String(fd.get('name') || '').replace(/\s+/g, ' ').trim(),
    level: String(fd.get('level') || ''),
    examDate: String(fd.get('examDate') || ''),
  };
  const problems = [];
  if (!profile.name) problems.push(['name', 'Enter your full name.']);
  if (!LEVELS[profile.level]) problems.push(['level', 'Choose your AWS experience level.']);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(profile.examDate)) problems.push(['examDate', 'Pick your target exam date.']);
  else if (profile.examDate < todayISO()) problems.push(['examDate', 'Your target exam date can’t be in the past.']);
  for (const el of form.querySelectorAll('[name]')) el.setAttribute('aria-invalid', String(problems.some(([n]) => n === el.name)));
  if (problems.length) { gateError(problems.map(([, m]) => m).join(' ')); form.elements[problems[0][0]].focus(); return; }

  gateBusy = true; gateError('');
  const btn = form.querySelector('[type="submit"]');
  btn.disabled = true;
  btn.innerHTML = '<span class="h-4 w-4 animate-spin rounded-full border-2 border-slate-900/30 border-t-slate-900"></span> Starting your session…';
  const res = await postEvent({ event: 'session_start', data: profile }, 10000);
  gateBusy = false;

  if (!res.ok && !retryable(res.status)) {           // the server rejected the details: stay on Step 1
    btn.disabled = false; btn.textContent = 'Save & Start Diagnostic Test';
    gateError(res.data?.error || 'Those details could not be saved. Please check them and try again.');
    return;
  }

  const synced = res.ok && typeof res.data.sessionId === 'string';
  const id = synced ? res.data.sessionId : newId();
  // A different learner on this browser never sees the previous learner's progress.
  const sameLearner = S.profile && S.profile.name.toLowerCase() === profile.name.toLowerCase();
  if (S.profile && !sameLearner) S = { ...defaultState(), theme: S.theme, logo: S.logo, links: S.links };
  S.profile = { ...profile, createdAt: sameLearner ? S.profile.createdAt : Date.now() };
  setSession({ id, startedAt: Date.now(), synced });
  persistNow();
  if (!synced) enqueue('session_start', id, profile);   // delivered automatically once the network is back
  flushOutbox();
  toast(synced ? `Welcome, ${profile.name}. Your diagnostic test is ready.`
    : `Welcome, ${profile.name}. The connection is unavailable, so your session will sync automatically later.`, synced ? 'ok' : 'amber');
  // New learners go straight into Phase 2; returning ones resume at their next phase.
  go(!diagnosticDone() ? 'diagnostic' : !practiceUnlocked() ? 'remediation' : setsDone() < PRACTICE_SETS.length ? 'practice' : 'result');
}

function gateError(msg) {
  const el = $('#gate-error');
  if (el) { el.textContent = msg; el.hidden = !msg; }
}

/** Fire one-time pings for finished topic modules and readiness milestones. */
function checkMilestones() {
  const drilled = new Set(S.attempts.filter((a) => a.source === 'drill' && !a.retry).map((a) => a.qid));
  const byArea = tally((a) => a.area);
  for (const area of AREA_KEYS) {
    const qs = DRILLS.filter((q) => CONCEPTS[q.concept].area === area);
    if (S.tracked.modules[area] || !qs.length || !qs.every((q) => drilled.has(q.id)) || !byArea[area]) continue;
    S.tracked.modules[area] = Date.now();
    track('module_complete', { module: AREAS[area], masteryPct: Math.round(byArea[area].pct * 100), answered: byArea[area].n });
  }
  const o = overall();
  if (o.n < CONFIG.readinessMinAnswers || o.weighted == null) return;
  for (const m of CONFIG.readinessMilestones) {
    const key = String(Math.round(m * 100));
    if (S.tracked.readiness[key] || o.weighted < m) continue;
    S.tracked.readiness[key] = Date.now();
    track('readiness', { milestone: Math.round(m * 100), weightedPct: Math.round(o.weighted * 100), answered: o.n,
      weakAreas: [...stuckConceptIds()].map((k) => CONCEPTS[k].name) });
  }
}

  if (v === 'result') return S.tracked.final ? 'done' : 'open';
  return 'open';
}

/* ---------- Remediation, practice and readiness metrics ---------- */
const weakTopics = () => S.baseline?.weakCategories || [];
const practiceUnlocked = () => diagnosticDone() && weakTopics().every((k) => S.remediation.mastered[k]);
const setsDone = () => PRACTICE_SETS.filter((s) => S.practice.results[s.n]).length;
function practiceLockReason() {
  if (!diagnosticDone()) return 'Complete the diagnostic test first.';
  const left = weakTopics().filter((k) => !S.remediation.mastered[k]);
  return left.length ? `Mark ${left.length === 1 ? 'your weak topic' : `all ${left.length} weak topics`} as mastered in the Remediation Zone: ${left.map((k) => CATEGORIES[k].name).join(', ')}.` : '';
}
/** Accuracy per remediation category over every scored answer (diagnostic, drills, practice). */
function categoryTable() {
  const t = tally((a) => CONCEPT_CATEGORY[a.concept]);
  return CATEGORY_KEYS.map((k) => ({ key: k, ...CATEGORIES[k], ...(t[k] || { n: 0, c: 0, pct: null }) }));
}
/** Weighted Certification Readiness Score: diagnostic 20% · remediation 10% · practice sets 70%. */
const READINESS_WEIGHTS = { diagnostic: 0.2, remediation: 0.1, practice: 0.7 };
function readiness() {
  const diag = S.baseline ? S.baseline.pct : 0;
  const weak = weakTopics();
  const remediation = !diagnosticDone() ? 0 : weak.length ? weak.filter((k) => S.remediation.mastered[k]).length / weak.length : 1;
  const scores = PRACTICE_SETS.map((s) => S.practice.results[s.n]?.pct ?? null);
  const done = scores.filter((p) => p != null);
  const practiceAvg = done.length ? done.reduce((a, b) => a + b, 0) / done.length : null;
  const practice = scores.reduce((a, p) => a + (p ?? 0), 0) / PRACTICE_SETS.length;   // unfinished sets count as 0
  const W = READINESS_WEIGHTS;
  const score = W.diagnostic * diag + W.remediation * remediation + W.practice * practice;
  let verdict;
  if (!diagnosticDone()) verdict = { tone: 'slate', text: 'Not assessed yet', note: 'Take the diagnostic test to start building your readiness score.' };
  else if (done.length < PRACTICE_SETS.length) verdict = { tone: 'amber', text: 'Provisional', note: `Finish all ${PRACTICE_SETS.length} practice sets for a final verdict (${done.length}/${PRACTICE_SETS.length} done). Unfinished sets count as 0%.` };
  else if (score >= 0.8) verdict = { tone: 'emerald', text: 'Highly likely to pass', note: 'Your scores sit comfortably above the 72% (≈720/1000) benchmark across the exam-style sets. Book the exam and keep your weakest category warm with a few drills.' };
  else if (score >= T) verdict = { tone: 'amber', text: 'Likely to pass — borderline', note: 'You are above the benchmark but without much margin. Retake the practice sets where you scored lowest and revisit your weakest category before booking.' };
  else if (score >= 0.6) verdict = { tone: 'orange', text: 'Not ready yet', note: 'You are below the 72% benchmark. Work through the Remediation Zone and Coaching Core for your weakest categories, then retake the practice sets.' };
  else verdict = { tone: 'rose', text: 'Significant gaps', note: 'Several domains need work. Rebuild the foundations with the masterclasses and drills before attempting more practice sets.' };
  return { score, diag, remediation, practice, practiceAvg, setsCompleted: done.length, verdict };
}

const OPTION_SKIN = {
  card: {
    base: 'border-slate-200 hover:border-slate-300 hover:bg-slate-50 dark:border-slate-700 dark:hover:border-slate-500 dark:hover:bg-slate-700/30',

function answerInputs(q, resp, ns, { reveal = false, skin = 'card' } = {}) {

        ? `<p class="mt-2 text-sm font-semibold ${ok ? 'text-emerald-500' : 'text-rose-500'}">${ok ? '✓ Correct' : '✗ Expected'}: ${esc(q.key)}</p>`

      <div class="flex items-center gap-3">
        <span class="flex h-11 w-11 items-center justify-center rounded-xl bg-slate-100 text-2xl dark:bg-slate-700/60" aria-hidden="true">${c.icon}</span>
        <div><h2 class="text-lg font-bold">${c.name}</h2><p class="text-xs ${ui.muted}">${c.blurb}</p></div>

        ${done ? badge('resolved') : required ? badge('stuck') : badge('solid')}

    </div>

    <div class="${ui.label} mt-6">Core architecture rules, step by step</div>

      ${c.steps.map(([title, text], i) => `<li class="flex gap-3">
        <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-amber-500 text-xs font-bold text-slate-900">${i + 1}</span>
        <div class="text-sm leading-relaxed"><b>${esc(title)}.</b> ${esc(text)}</div></li>`).join('')}
    </ol>

    <div class="mt-6 rounded-xl border border-sky-300/60 bg-sky-50 p-4 dark:border-sky-500/30 dark:bg-sky-500/10">
      <div class="${ui.label} !text-sky-700 dark:!text-sky-300">Real-world production example</div>

    <div class="${ui.label} mt-6">Architecture diagram: secure data flow</div>
    <pre class="thin-scroll mt-2 overflow-x-auto rounded-xl border border-slate-800 bg-slate-950 p-4 font-mono text-[11.5px] leading-5 text-emerald-300 sm:text-xs" role="img" aria-label="${esc(c.name)} reference architecture">${esc(c.diagram.replace(/^\n/, ''))}</pre>

    <div class="mt-5 flex flex-wrap items-center gap-2">
      <span class="text-xs ${ui.muted}">Masterclasses:</span>
      ${c.concepts.map((cid) => `<button data-action="open-drawer" data-concept="${cid}" class="${B('secondary', '!px-2.5 !py-1 text-xs')}">${esc(CONCEPTS[cid].name)}</button>`).join('')}
    </div>

    <label class="mt-6 flex cursor-pointer items-start gap-3 rounded-xl border-2 p-4 transition ${done ? 'border-emerald-500 bg-emerald-50 dark:bg-emerald-500/10' : 'border-dashed border-slate-300 hover:border-amber-400 dark:border-slate-600'}">
      <input type="checkbox" data-master="${k}" class="mt-0.5 h-5 w-5 shrink-0 accent-emerald-500" ${done ? 'checked' : ''}>
      <span class="text-sm"><b>Mark Topic as Mastered</b><span class="block text-xs ${ui.muted}">I understand these rules, can explain the diagram, and can apply the production example.</span></span>
    </label>
  </article>`;
}

function viewRemediation() {
  if (!diagnosticDone()) return lockedPanel('Phase 3 · Remediation Zone', 'Your remediation plan is built from your diagnostic', 'Take the diagnostic test first. Your weakest categories will then be broken down here step by step.', 'Start the diagnostic', 'diagnostic');
  const weak = weakTopics(), others = CATEGORY_KEYS.filter((k) => !weak.includes(k));
  const mastered = weak.filter((k) => S.remediation.mastered[k]).length;
  const unlocked = practiceUnlocked();
  const rows = CATEGORY_KEYS.map((k) => ({ k, t: S.baseline.byCategory?.[k] })).filter((r) => r.t).sort((a, b) => a.t.c / a.t.n - b.t.c / b.t.n);
  return `
  <div class="mb-5 flex flex-wrap items-end justify-between gap-3">
    <div>
      <div class="${ui.label} !text-amber-600 dark:!text-amber-400">Phase 3 · Personalised Remediation Zone</div>
      <h1 class="text-2xl font-bold">${weak.length ? 'Fix your weakest topics, step by step' : 'No weak topics on your baseline'}</h1>
      <p class="text-sm ${ui.muted}">${weak.length
        ? `Your diagnostic put ${weak.length === 1 ? 'one category' : `${weak.length} categories`} below the ${Math.round(T * 100)}% benchmark. Work through each one and mark it as mastered to unlock the practice exams.`
        : 'Every category met the benchmark. The practice exams are unlocked; the notes below are optional review.'}</p>
    </div>
    ${weak.length ? `<div class="text-right"><div class="font-mono text-lg font-bold">${mastered}/${weak.length}</div><div class="text-xs ${ui.muted}">topics mastered</div></div>` : ''}
  </div>

  <section class="${ui.card} mb-6">
    <div class="${ui.label}">Diagnostic score by category (lowest first)</div>
    <div class="mt-3 space-y-2.5">
      ${rows.map(({ k, t }) => { const p = t.c / t.n; return `<div class="grid grid-cols-[150px_1fr_70px] items-center gap-3 text-sm" title="${esc(CATEGORIES[k].name)}: ${t.c} of ${t.n} correct">
        <span class="truncate font-medium">${CATEGORIES[k].icon} ${CATEGORIES[k].name}</span>${bar(p, p < T ? 'bg-rose-500' : p < 0.85 ? 'bg-amber-500' : 'bg-emerald-500')}
        <span class="text-right font-mono text-xs ${masteryText(p)}">${fmtPct(p)}</span></div>`; }).join('')}
    </div>
  </section>

  <div class="space-y-6">${weak.map((k) => remediationCard(k, true)).join('')}</div>

  <section class="mt-6 rounded-2xl border p-5 text-center ${unlocked ? 'border-emerald-400/60 bg-emerald-50 dark:bg-emerald-500/10' : 'border-amber-300/60 bg-amber-50 dark:border-amber-500/30 dark:bg-amber-500/10'}">
    ${unlocked
      ? `<div class="font-semibold text-emerald-800 dark:text-emerald-200">Practice exams unlocked</div>
         <p class="mt-1 text-sm text-emerald-900/80 dark:text-emerald-100/80">Six exam-style sets are ready, each 10 questions at real exam pace.</p>
         <button data-action="nav" data-view="practice" class="${B('primary', 'mt-4')}">Go to Practice Exams →</button>`
      : `<div class="flex items-center justify-center gap-2 font-semibold text-amber-900 dark:text-amber-100">${lockIcon} Practice exams are locked</div>
         <p class="mt-1 text-sm text-amber-900/80 dark:text-amber-100/80">${esc(practiceLockReason())}</p>`}
  </section>

  ${others.length ? `<div class="${ui.label} mb-3 mt-8">Optional review: categories at or above the benchmark</div>
  <div class="space-y-3">${others.map((k) => `<details class="group ${ui.card} !p-0">
    <summary class="flex cursor-pointer list-none items-center justify-between gap-3 p-5 font-semibold">${CATEGORIES[k].icon} ${CATEGORIES[k].name}
      <span class="text-xs font-normal ${ui.muted} group-open:hidden">Show notes ▾</span></summary>
    <div class="border-t border-slate-200 p-1 dark:border-slate-700">${remediationCard(k, false).replace(ui.card, '!border-0 !shadow-none p-5')}</div>
  </details>`).join('')}</div>` : ''}`;
}

/* ---------- Phase 4: six YouTube-styled practice test sets ---------- */
const SECONDS_PER_QUESTION = 120;   // real exam pace: 130 minutes for 65 questions
const fmtClock = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  return `${h ? `${h}:${String(m).padStart(2, '0')}` : m}:${String(r).padStart(2, '0')}`; };
const setById = (n) => PRACTICE_SETS.find((s) => s.n === Number(n));
const setOrder = (n) => POOL_ORDER[`set${n}`];
const practiceQ = () => { const a = S.practice.active; return a && QUESTIONS.get(setOrder(a.set)[a.index]); };
const THUMBS = ['from-rose-700 via-slate-900 to-slate-950', 'from-sky-700 via-slate-900 to-slate-950', 'from-violet-700 via-slate-900 to-slate-950',
  'from-emerald-700 via-slate-900 to-slate-950', 'from-amber-600 via-slate-900 to-slate-950', 'from-fuchsia-700 via-slate-900 to-slate-950'];
let explainOpen = false;   // transient: the slide-out explanation pane

function viewPractice() {
  if (!practiceUnlocked()) return lockedPanel('Phase 4 · Practice Exams', 'Practice exams are locked', practiceLockReason(), diagnosticDone() ? 'Open the Remediation Zone' : 'Start the diagnostic', diagnosticDone() ? 'remediation' : 'diagnostic');
  const P = S.practice;
  if (P.mode === 'play' && P.active) return practicePlayer();
  if (P.mode === 'summary' && P.results[P.summarySet]) return practiceSummary(P.summarySet);
  return practiceList();
}

function practiceList() {
  const P = S.practice;
  return `
  <div class="mb-6 flex flex-wrap items-end justify-between gap-3">
    <div>
      <div class="${ui.label} !text-amber-600 dark:!text-amber-400">Phase 4 · Practice Exams</div>
      <h1 class="text-2xl font-bold">Six SAA-C03 practice test sets</h1>
      <p class="text-sm ${ui.muted}">Exam-style scenarios at real exam pace (2 minutes per question). Lock in each answer, then open the explanation pane for the full breakdown.</p>
    </div>
    <div class="text-right"><div class="font-mono text-lg font-bold">${setsDone()}/${PRACTICE_SETS.length}</div><div class="text-xs ${ui.muted}">sets completed</div></div>
  </div>
  <div class="grid gap-x-5 gap-y-8 sm:grid-cols-2 xl:grid-cols-3">
    ${PRACTICE_SETS.map((s, i) => {
      const r = P.results[s.n], live = P.active?.set === s.n;
      const answered = live ? Object.keys(P.active.locked).length : 0;
      const progress = r ? 1 : live ? answered / s.questions.length : 0;
      const status = live ? `In progress · ${answered}/${s.questions.length}` : r ? `Score ${Math.round(r.pct * 100)}% · best ${Math.round(r.best * 100)}%` : 'Not started';
      return `<button type="button" data-action="practice-open" data-set="${s.n}" class="group text-left focus:outline-none">
        <div class="relative aspect-video overflow-hidden rounded-xl bg-gradient-to-br ${THUMBS[i % THUMBS.length]} shadow-md ring-1 ring-black/20 transition group-hover:shadow-xl group-focus-visible:ring-2 group-focus-visible:ring-amber-500">
          <div class="absolute inset-0 flex flex-col justify-center px-6 text-white">
            <div class="text-[11px] font-bold uppercase tracking-[.2em] text-white/70">AWS SAA-C03 · Practice exam</div>
            <div class="mt-1 text-3xl font-extrabold leading-none sm:text-4xl">SET ${s.n}<span class="text-white/50">/6</span></div>
            <div class="mt-2 max-w-[85%] text-sm font-semibold text-white/90">${esc(s.title)}</div>
          </div>
          <img src="${esc(logoSrc())}" alt="" class="absolute right-4 top-4 h-10 w-auto max-w-[64px] object-contain opacity-90">
          <span class="absolute inset-0 m-auto flex h-14 w-20 items-center justify-center rounded-2xl bg-red-600/95 opacity-0 shadow-lg transition group-hover:opacity-100" aria-hidden="true">
            <svg class="h-7 w-7 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>
          <span class="absolute bottom-2.5 right-2.5 rounded bg-black/80 px-1.5 py-0.5 font-mono text-xs font-semibold text-white">${fmtClock(s.questions.length * SECONDS_PER_QUESTION * 1000)}</span>
          ${progress ? `<span class="absolute inset-x-0 bottom-0 h-1 bg-white/25"><span class="block h-full bg-red-600" style="width:${Math.round(progress * 100)}%"></span></span>` : ''}
        </div>
        <div class="mt-3 flex gap-3">
          <img src="${esc(logoSrc())}" alt="" class="h-9 w-9 shrink-0 rounded-full bg-slate-900 object-contain p-1">
          <div class="min-w-0">
            <div class="font-semibold leading-snug group-hover:text-amber-600 dark:group-hover:text-amber-400">Practice Set ${s.n}: ${esc(s.title)}</div>
            <div class="mt-0.5 text-xs ${ui.muted}">${esc(CONFIG.ownerName)} · ${s.questions.length} questions · ${esc(s.blurb)}</div>
            <div class="mt-0.5 text-xs font-semibold ${r ? (r.pct >= T ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400') : live ? 'text-red-600 dark:text-red-400' : ui.muted}">${status}</div>
          </div>
        </div>
      </button>`;
    }).join('')}
  </div>
  ${setsDone() === PRACTICE_SETS.length ? `<div class="mt-8 text-center"><button data-action="nav" data-view="result" class="${B('primary')}">See your Certification Readiness Score →</button></div>` : ''}`;
}

function practicePlayer() {
  const a = S.practice.active, s = setById(a.set), order = setOrder(a.set), q = practiceQ();
  const target = s.questions.length * SECONDS_PER_QUESTION * 1000;
  const lockedResp = a.locked[q.id], isLocked = lockedResp !== undefined;
  const resp = isLocked ? lockedResp : a.picks[q.id];
  const ok = isLocked && isCorrect(q, lockedResp);
  const lockedCount = Object.keys(a.locked).length, correctCount = order.filter((id) => a.locked[id] !== undefined && isCorrect(QUESTIONS.get(id), a.locked[id])).length;
  const allLocked = lockedCount === order.length, last = a.index === order.length - 1;
  const ctl = 'inline-flex h-9 items-center justify-center gap-1.5 rounded-full px-3 text-sm font-semibold text-white/90 transition hover:bg-white/10 disabled:cursor-not-allowed disabled:opacity-35 focus:outline-none focus-visible:ring-2 focus-visible:ring-red-500';
  return `
  <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
    <button data-action="practice-list" class="${B('ghost', '!px-2 text-sm')}">← All practice sets</button>
    <div class="flex flex-wrap gap-2">${chip(`Set ${s.n}/6 · ${s.title}`)}${chip(`${correctCount}/${lockedCount} correct so far`, '!bg-emerald-100 !text-emerald-800 dark:!bg-emerald-500/15 dark:!text-emerald-300')}</div>
  </div>
  <div class="grid gap-6 xl:grid-cols-[1fr_300px]">
    <section class="relative overflow-hidden rounded-2xl bg-[#0f0f0f] text-slate-100 shadow-2xl ring-1 ring-black/40" aria-label="Practice exam player">
      <header class="flex items-center gap-3 border-b border-white/10 px-4 py-3 sm:px-6">
        <img src="${esc(logoSrc())}" alt="" class="h-9 w-9 shrink-0 rounded-full bg-black object-contain p-1 ring-1 ring-white/10">
        <div class="min-w-0 flex-1">
          <div class="truncate text-sm font-semibold">AWS SAA-C03 Practice Set ${s.n}: ${esc(s.title)}</div>
          <div class="text-xs text-slate-400">${esc(CONFIG.ownerName)} · Question ${a.index + 1} of ${order.length}</div>
        </div>
        <div class="flex items-center gap-2 rounded-full bg-white/10 px-3 py-1.5 font-mono text-sm" title="Elapsed / target time at real exam pace">
          <span class="h-2 w-2 animate-pulse rounded-full bg-red-500" aria-hidden="true"></span>
          <span id="yt-time" class="tabular-nums">${fmtClock(a.elapsedMs)}</span><span class="text-slate-500">/ ${fmtClock(target)}</span>
        </div>
      </header>

      <div class="min-h-[420px] px-5 py-7 sm:px-10 sm:py-9 fade-in">
        <div class="flex flex-wrap items-center gap-2 text-[11px] font-bold uppercase tracking-wider">
          <span class="rounded bg-red-600 px-2 py-0.5 text-white">Q${a.index + 1}</span>
          <span class="rounded bg-white/10 px-2 py-0.5 text-slate-300">${typeLabel(q)}</span>
          <span class="rounded bg-white/10 px-2 py-0.5 text-slate-300">${DOMAINS[q.domain].short}</span>
        </div>
        <p class="mt-4 text-lg font-semibold leading-relaxed text-white sm:text-xl">${esc(q.scenario)}</p>
        ${answerInputs(q, resp, 'prac', { reveal: isLocked, skin: 'stage' })}
        ${isLocked ? `<div class="mt-5 flex flex-wrap items-center gap-3 rounded-xl px-4 py-3 ${ok ? 'bg-emerald-500/10 text-emerald-300' : 'bg-rose-500/10 text-rose-300'}">
          <span class="text-lg font-bold">${ok ? '✓ Correct' : '✗ Incorrect'}</span>
          <button data-action="practice-explain" class="ml-auto text-sm font-semibold text-white underline-offset-4 hover:underline">${explainOpen ? 'Hide' : 'Open'} explanation →</button>
        </div>` : ''}
      </div>

      <!-- Scrubber: one segment per question -->
      <div class="flex gap-1 px-4 sm:px-6" role="group" aria-label="Question timeline">
        ${order.map((id, i) => {
          const l = a.locked[id], c = l !== undefined ? (isCorrect(QUESTIONS.get(id), l) ? 'bg-emerald-500' : 'bg-rose-500') : i === a.index ? 'bg-red-600' : 'bg-white/20 hover:bg-white/40';
          return `<button data-action="practice-goto" data-index="${i}" aria-label="Question ${i + 1}${l !== undefined ? ', answered' : ''}" class="h-1.5 flex-1 rounded-full transition ${c} ${i === a.index ? 'scale-y-[2]' : ''}"></button>`;
        }).join('')}
      </div>
      <div class="flex flex-wrap items-center gap-1 px-2 py-2 sm:px-4">
        <button data-action="practice-prev" class="${ctl}" ${a.index === 0 ? 'disabled' : ''} aria-label="Previous question"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg></button>
        ${isLocked
          ? `<button data-action="${last ? (allLocked ? 'practice-finish' : 'practice-next-open') : 'practice-next'}" class="${ctl} !bg-white !text-slate-900 hover:!bg-slate-200">${last ? (allLocked ? 'Finish set' : 'Next unanswered') : 'Next question'} ▶</button>`
          : `<button id="yt-lock" data-action="practice-lock" class="${ctl} !bg-red-600 hover:!bg-red-500" ${isAnswered(q, resp) ? '' : 'disabled'}><svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Lock answer</button>`}
        <button data-action="practice-next" class="${ctl}" ${last ? 'disabled' : ''} aria-label="Next question"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
        <span class="ml-2 font-mono text-xs text-slate-400">${lockedCount}/${order.length} answered</span>
        <span class="flex-1"></span>
        <button data-action="practice-explain" class="${ctl}" ${isLocked ? '' : 'disabled title="Lock in an answer to unlock the explanation"'} aria-pressed="${explainOpen && isLocked}">
          <span class="rounded border border-current px-1 text-[10px] font-bold leading-4">CC</span> Explanation</button>
        <button data-action="practice-finish" class="${ctl}">Finish set</button>
      </div>

      <!-- Slide-out explanation pane -->
      <aside class="absolute inset-y-0 right-0 z-10 flex w-full flex-col border-l border-white/10 bg-[#181818] shadow-2xl transition-transform duration-300 sm:w-[420px] ${explainOpen && isLocked ? 'translate-x-0' : 'translate-x-full'}" aria-hidden="${!(explainOpen && isLocked)}" ${explainOpen && isLocked ? '' : 'inert'}>
        <div class="flex items-center justify-between border-b border-white/10 px-5 py-3">
          <div class="text-sm font-bold">Explanation · Q${a.index + 1}</div>
          <button data-action="practice-explain" class="rounded-full p-1.5 text-slate-400 hover:bg-white/10 hover:text-white" aria-label="Close explanation">✕</button>
        </div>
        <div class="thin-scroll flex-1 space-y-5 overflow-y-auto px-5 py-5 text-sm leading-relaxed text-slate-200">
          <div><div class="text-[11px] font-bold uppercase tracking-wider text-emerald-400">Correct answer</div><p class="mt-1 font-semibold text-white">${esc(keyText(q, 400))}</p></div>
          <div><div class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Why it is right</div><p class="mt-1">${esc(q.proof)}</p></div>
          ${q.eliminate ? `<div><div class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Why the others are wrong</div>${eliminationList(q, 'stage')}</div>` : ''}
          ${q.trigger ? `<div class="rounded-lg bg-red-500/10 px-3 py-2 text-red-200"><b>Exam trigger:</b> ${esc(q.trigger)}</div>` : ''}
          <button data-action="open-drawer" data-concept="${q.concept}" class="${ctl} !bg-white/10">Master ${esc(CONCEPTS[q.concept].name)} →</button>
        </div>
      </aside>
    </section>

    <aside class="${ui.card} h-fit !p-3">
      <div class="px-2 pb-2 pt-1 text-sm font-semibold">Up next in Set ${s.n}</div>
      <ol class="thin-scroll max-h-[560px] space-y-1 overflow-y-auto">
        ${order.map((id, i) => {
          const qq = QUESTIONS.get(id), l = a.locked[id];
          const mark = l === undefined ? `<span class="font-mono text-xs ${ui.muted}">${i + 1}</span>` : isCorrect(qq, l) ? '<span class="font-bold text-emerald-500">✓</span>' : '<span class="font-bold text-rose-500">✗</span>';
          return `<li><button data-action="practice-goto" data-index="${i}" class="flex w-full items-start gap-3 rounded-lg p-2 text-left text-xs transition ${i === a.index ? 'bg-amber-500/15' : 'hover:bg-slate-100 dark:hover:bg-slate-700/50'}">
            <span class="flex h-6 w-6 shrink-0 items-center justify-center">${mark}</span>
            <span class="line-clamp-2 leading-snug">${esc(clip(qq.scenario, 110))}</span></button></li>`;
        }).join('')}
      </ol>
    </aside>
  </div>`;
}

function practiceSummary(n) {
  const s = setById(n), r = S.practice.results[n];
  const target = s.questions.length * SECONDS_PER_QUESTION;
  const next = setById(n + 1);
  return `
  <div class="mb-4"><button data-action="practice-list" class="${B('ghost', '!px-2 text-sm')}">← All practice sets</button></div>
  <section class="${ui.card} sm:p-7">
    <div class="flex flex-wrap items-center gap-6">
      ${ring(r.pct, r.pct >= T ? 'emerald' : 'rose', 'h-28 w-28')}
      <div class="min-w-0 flex-1">
        <div class="${ui.label}">Practice Set ${n}/6 complete</div>
        <h1 class="text-2xl font-bold">${esc(s.title)}</h1>
        <p class="mt-1 text-sm ${ui.muted}">${r.correct}/${r.total} correct · time ${fmtClock(r.durationSec * 1000)} of ${fmtClock(target * 1000)} · best ${Math.round(r.best * 100)}% · attempt ${r.attempts}</p>
        <p class="mt-2 text-sm font-semibold ${r.pct >= T ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}">${r.pct >= T ? `Above the ${Math.round(T * 100)}% benchmark. Nice work.` : `Below the ${Math.round(T * 100)}% benchmark. Review the explanations below, then retake the set.`}</p>
      </div>
      <div class="flex flex-col gap-2">
        ${next ? `<button data-action="practice-open" data-set="${next.n}" class="${B('primary')}">Next: Set ${next.n} ▶</button>` : `<button data-action="nav" data-view="result" class="${B('primary')}">Final result →</button>`}
        <button data-action="practice-start" data-set="${n}" class="${B('secondary')}">Retake this set</button>
      </div>
    </div>
  </section>
  <section class="mt-6 space-y-3">
    ${s.questions.map((q, i) => {
      const resp = r.answers?.[q.id], ok = resp !== undefined && isCorrect(q, resp);

/** Progress ring (single value). The number sits in the centre in text ink, never in the arc colour. */
function ring(p, tone = 'amber', size = 'h-40 w-40') {
  const C = 2 * Math.PI * 52, v = Math.max(0, Math.min(1, p || 0));
  const stroke = { emerald: 'stroke-emerald-500', amber: 'stroke-amber-500', orange: 'stroke-orange-500', rose: 'stroke-rose-500', slate: 'stroke-slate-400' }[tone];
  return `<div class="relative ${size} shrink-0" role="img" aria-label="${Math.round(v * 100)} percent">
    <svg viewBox="0 0 120 120" class="h-full w-full -rotate-90">
      <circle cx="60" cy="60" r="52" fill="none" stroke-width="10" class="stroke-slate-200 dark:stroke-slate-700"/>
      <circle cx="60" cy="60" r="52" fill="none" stroke-width="10" stroke-linecap="round" class="${stroke} transition-all duration-700"
        stroke-dasharray="${(C * v).toFixed(1)} ${C.toFixed(1)}"/>
    </svg>
    <div class="absolute inset-0 flex flex-col items-center justify-center"><span class="text-3xl font-extrabold tabular-nums">${Math.round(v * 100)}%</span></div>
  </div>`;
}

/** Compile the training summary and stream it to the webhook. */
function sendFinalReport(auto) {
  if (!diagnosticDone()) return;
  const r = readiness(), cats = categoryTable().filter((c) => c.pct != null);
  track('final_report', {
    readinessPct: Math.round(r.score * 100), verdict: r.verdict.text,
    diagnosticPct: Math.round(r.diag * 100), practiceAvgPct: r.practiceAvg == null ? 0 : Math.round(r.practiceAvg * 100),
    setsCompleted: r.setsCompleted, setsTotal: PRACTICE_SETS.length,
    topicsMastered: Object.keys(S.remediation.mastered).map((k) => CATEGORIES[k]?.name).filter(Boolean),
    strengths: cats.filter((c) => c.pct >= 0.85).map((c) => `${c.name} ${Math.round(c.pct * 100)}%`),
    weakAreas: cats.filter((c) => c.pct < T).map((c) => `${c.name} ${Math.round(c.pct * 100)}%`),
  });
  S.tracked.final = Date.now();
  persist();
  if (!auto) { render(); toast('Training summary report sent.', 'ok'); }
}

/* ---------- Practice actions ---------- */
function startPracticeSet(n) {
  const cur = S.practice.active;
  if (cur && cur.set !== n && Object.keys(cur.locked).length
    && !confirm(`Set ${cur.set} is in progress (${Object.keys(cur.locked).length} answered). Abandon it and start Set ${n}?`)) return;
  S.practice.active = { set: n, index: 0, picks: {}, locked: {}, elapsedMs: 0, startedAt: Date.now() };
  S.practice.mode = 'play'; explainOpen = false;
  persist(); render(); window.scrollTo({ top: 0 });
}
function openPracticeSet(n) {
  const a = S.practice.active;
  if (a?.set === n) {   // resume at the first unanswered question of this page load's order
    const first = setOrder(n).findIndex((id) => a.locked[id] === undefined);
    a.index = first < 0 ? 0 : first; S.practice.mode = 'play'; explainOpen = false;
    persist(); render(); window.scrollTo({ top: 0 }); return;
  }
  if (S.practice.results[n]) { S.practice.mode = 'summary'; S.practice.summarySet = n; persist(); render(); window.scrollTo({ top: 0 }); return; }
  startPracticeSet(n);
}
function lockPracticeAnswer() {
  const a = S.practice.active, q = practiceQ();
  if (!a || a.locked[q.id] !== undefined) return;
  const resp = a.picks[q.id];
  if (!isAnswered(q, resp)) { toast(qType(q) === 'multi' ? `Select exactly ${q.answer.length} answers.` : 'Choose an answer first.', 'error'); return; }
  a.locked[q.id] = resp;
  recordAttempt(q, resp, 'practice', false);
  checkMilestones();
  persist(); render();
  toast(isCorrect(q, resp) ? 'Correct! Open the explanation for the full breakdown.' : 'Incorrect. Open the explanation to see why.', isCorrect(q, resp) ? 'ok' : 'error');
}
function movePractice(index) {
  const a = S.practice.active; if (!a) return;
  a.index = Math.max(0, Math.min(setOrder(a.set).length - 1, index)); explainOpen = false;
  persist(); render();
}
function finishPracticeSet() {
  const a = S.practice.active; if (!a) return;
  const s = setById(a.set), order = setOrder(a.set);
  const open = order.filter((id) => a.locked[id] === undefined).length;
  if (open && !confirm(`${open} question${open === 1 ? ' is' : 's are'} unanswered and will count as incorrect. Finish the set anyway?`)) return;
  const correct = s.questions.filter((q) => a.locked[q.id] !== undefined && isCorrect(q, a.locked[q.id])).length;
  const total = s.questions.length, pct = correct / total, prev = S.practice.results[s.n];
  S.practice.results[s.n] = { pct, correct, total, durationSec: Math.round(a.elapsedMs / 1000), ts: Date.now(),
    best: Math.max(pct, prev?.best ?? 0), attempts: (prev?.attempts || 0) + 1, answers: { ...a.locked } };
  S.practice.active = null; S.practice.mode = 'summary'; S.practice.summarySet = s.n; explainOpen = false;
  track('practice_complete', { set: s.n, setsTotal: PRACTICE_SETS.length, scorePct: Math.round(pct * 100), correct, total, durationSec: Math.round(a.elapsedMs / 1000) });
  if (setsDone() === PRACTICE_SETS.length && !S.tracked.final) sendFinalReport(true);
  persistNow(); render(); window.scrollTo({ top: 0 });
  toast(`Set ${s.n} complete: ${Math.round(pct * 100)}%.`, pct >= T ? 'ok' : 'amber');
}

// Running exam timer: counts only while the player is visible.
let lastTick = Date.now();
setInterval(() => {
  const now = Date.now(), dt = Math.min(now - lastTick, 5000); lastTick = now;

  a.elapsedMs += dt;

}, 1000);

function tutorPanel(q) {
  const d = S.drill, c = CONCEPTS[q.concept];
  // The masterclass is always available; it is actively recommended after repeated misses or a Confused flag.
  const recommended = !!S.unlocked[q.id];
  const masterBtn = recommended
    ? `<div class="mb-2 text-xs font-semibold text-amber-600 dark:text-amber-400">Recommended: you missed this twice or flagged it as confusing.</div>
       <button data-action="open-drawer" data-concept="${q.concept}" class="${B('primary', 'w-full pulse-ring')}">Master It: open the ${esc(c.name)} masterclass</button>`
    : `<button data-action="open-drawer" data-concept="${q.concept}" class="${B('secondary', 'w-full')}">Master It: ${esc(c.name)} masterclass</button>`;

  if (!d.evaluated) {
    return `
      <div class="flex items-center gap-2"><span class="flex h-8 w-8 items-center justify-center rounded-full bg-amber-500 font-bold text-slate-900">T</span><div><div class="font-semibold">Instant Tutor</div><div class="text-xs ${ui.muted}">Waiting for your answer…</div></div></div>
      <div class="mt-4 rounded-xl bg-slate-50 p-4 text-sm leading-relaxed dark:bg-slate-900/50">
        Pick an option on the left. The tutor evaluates it <b>immediately</b>: architectural proof for the optimal answer, plus elimination logic for every distractor.
      </div>
      <div class="mt-4 ${ui.label}">This scenario tests</div>
      <div class="mt-2 flex flex-wrap gap-1">${chip(c.name, '!bg-amber-100 !text-amber-800 dark:!bg-amber-500/15 dark:!text-amber-300')}${chip(AREAS[c.area])}</div>
      <div class="mt-5">${masterBtn}</div>`;
  }

  const ok = d.selected === q.answer;
  return `
    <div class="fade-in">
      <div class="flex items-center gap-3 rounded-xl px-4 py-3 ${ok ? 'bg-emerald-50 text-emerald-800 dark:bg-emerald-500/10 dark:text-emerald-300' : 'bg-rose-50 text-rose-800 dark:bg-rose-500/10 dark:text-rose-300'}">
        <span class="text-xl font-extrabold">${ok ? '✓ Optimal' : '✗ Sub-optimal'}</span>
        <span class="text-sm">You chose <b>${LETTERS[d.selected]}</b>${ok ? '' : ` · optimal is <b>${LETTERS[q.answer]}</b>`}</span>
      </div>

      <div class="mt-4 rounded-xl border border-emerald-200 p-4 dark:border-emerald-500/30">
        <div class="${ui.label} !text-emerald-700 dark:!text-emerald-400">Architectural proof: why ${LETTERS[q.answer]} is optimal</div>
        <p class="mt-2 text-sm leading-relaxed">${esc(q.proof)}</p>
      </div>

      <div class="mt-4 rounded-xl border border-slate-200 p-4 dark:border-slate-700">
        <div class="${ui.label}">Elimination logic</div>
        <ul class="mt-3 space-y-3">
          ${q.options.map((_, i) => i).filter((i) => i !== q.answer).map((i) => `
            <li class="flex gap-3 text-sm ${i === d.selected ? 'rounded-lg bg-rose-50 p-2 dark:bg-rose-500/10' : ''}">
              <span class="mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-md bg-slate-100 text-xs font-bold dark:bg-slate-700">${LETTERS[i]}</span>
              <span class="leading-relaxed">${i === d.selected ? '<b class="text-rose-600 dark:text-rose-400">Your pick · </b>' : ''}${esc(q.eliminate[i])}</span>
            </li>`).join('')}
        </ul>
      </div>

      <div class="mt-4 rounded-xl border-l-4 border-amber-500 bg-amber-50 p-4 dark:bg-amber-500/10">
        <div class="${ui.label} !text-amber-700 dark:!text-amber-300">Exam trigger</div>
        <p class="mt-1 text-sm">${esc(q.trigger)}</p>
      </div>

      <div class="mt-5">${masterBtn}</div>
    </div>`;
}

function viewCoach() {
  const d = S.drill, q = QUESTIONS.get(d.currentId), c = CONCEPTS[q.concept];
  const ranked = rankDrills().filter((r) => r.q.id !== q.id).slice(0, 4);
  const hist = (id) => S.attempts.filter((a) => a.qid === id);
  const confused = !!S.confused[q.id];

  const optionBtn = (o, i) => {
    let cls = 'border-slate-200 hover:border-amber-400 hover:bg-amber-50/50 dark:border-slate-700 dark:hover:border-amber-500/60 dark:hover:bg-amber-500/5';
    let tag = '';
    if (d.evaluated) {
      if (i === q.answer) { cls = 'border-emerald-500 bg-emerald-50 dark:bg-emerald-500/10'; tag = '<span class="ml-auto shrink-0 text-xs font-bold text-emerald-600 dark:text-emerald-400">OPTIMAL</span>'; }
      else if (i === d.selected) { cls = 'border-rose-500 bg-rose-50 dark:bg-rose-500/10'; tag = '<span class="ml-auto shrink-0 text-xs font-bold text-rose-600 dark:text-rose-400">YOUR PICK</span>'; }
      else cls = 'border-slate-200 opacity-60 dark:border-slate-700';
    }
    return `<button type="button" data-action="drill-answer" data-index="${i}" ${d.evaluated ? 'disabled aria-disabled="true"' : ''}
      class="flex w-full items-start gap-3 rounded-xl border-2 p-4 text-left transition ${cls} disabled:cursor-default">
      <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-md bg-slate-100 text-xs font-bold dark:bg-slate-700">${LETTERS[i]}</span>
      <span class="text-sm leading-relaxed sm:text-[15px]">${esc(o)}</span>${tag}</button>`;
  };

  return `
  <div class="mb-5 flex flex-wrap items-end justify-between gap-3">
    <div>
      <div class="${ui.label} !text-amber-600 dark:!text-amber-400">Phase C · Adaptive coaching core</div>
      <h1 class="text-2xl font-bold">Drill down &amp; instant tutor</h1>
    </div>
    <div class="flex flex-wrap items-center gap-2 text-xs">
      ${[...stuckConceptIds()].slice(0, 4).map((id) => chip(`Stuck: ${CONCEPTS[id].name}`, '!bg-rose-100 !text-rose-700 dark:!bg-rose-500/15 dark:!text-rose-300')).join('') || chip('No stuck concepts', '!bg-emerald-100 !text-emerald-700 dark:!bg-emerald-500/15 dark:!text-emerald-300')}
    </div>
  </div>

  <div class="grid gap-6 lg:grid-cols-2">
    <!-- LEFT: scenario drill -->
    <div class="space-y-6">
      <article class="${ui.card} sm:p-6 fade-in">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div class="flex flex-wrap items-center gap-2">
            ${chip(q.id, 'font-mono')}
            ${q.bootcamp ? chip('Bootcamp', '!bg-amber-500 !text-slate-900') : ''}
            ${chip(DOMAINS[q.domain].short)}
            ${chip(c.name, '!bg-amber-100 !text-amber-800 dark:!bg-amber-500/15 dark:!text-amber-300')}
          </div>
          <button type="button" data-action="confused" aria-pressed="${confused}" class="${B('ghost', '!px-2.5 !py-1 text-xs')} ${confused ? '!bg-amber-100 !text-amber-800 dark:!bg-amber-500/20 dark:!text-amber-300' : ''}">${confused ? '⚑ Flagged confused' : '⚐ I\'m confused'}</button>
        </div>
        ${q.title ? `<div class="mt-3 text-xs font-semibold uppercase tracking-wide ${ui.muted}">${esc(q.title)}</div>` : ''}
        <p class="mt-2 text-base leading-relaxed">${esc(q.scenario)}</p>
        <div class="mt-5 space-y-3" role="group" aria-label="Answer options">${q.options.map(optionBtn).join('')}</div>
        <div class="mt-5 flex flex-wrap items-center justify-between gap-3 border-t border-slate-200 pt-4 dark:border-slate-700">
          <div class="text-xs ${ui.muted}">Attempts: <b>${hist(q.id).length}</b> · wrong: <b>${S.wrong[q.id] || 0}</b>${d.retry ? ' · <span class="text-amber-600 dark:text-amber-400">retry (not scored)</span>' : ''}</div>
          <div class="flex gap-2">
            ${d.evaluated && d.selected !== q.answer ? `<button data-action="drill-retry" class="${B('secondary', '!py-1.5')}">Retry scenario</button>` : ''}
            <button data-action="drill-next" class="${B(d.evaluated ? 'primary' : 'secondary', '!py-1.5')}">${d.evaluated ? 'Next adaptive scenario →' : 'Skip →'}</button>
          </div>
        </div>
        <p class="mt-3 hidden text-xs ${ui.muted} sm:block">Shortcuts: <kbd>A</kbd>–<kbd>D</kbd> answer · <kbd>R</kbd> retry · <kbd>N</kbd> next · <kbd>?</kbd> confused</p>
      </article>

      <section class="${ui.card}">
        <div class="${ui.label}">Adaptive queue: up next</div>
        <ol class="mt-3 space-y-2">
          ${ranked.map((r, i) => `<li><button data-action="open-drill" data-id="${r.q.id}" class="flex w-full items-center gap-3 rounded-lg p-2 text-left hover:bg-slate-50 dark:hover:bg-slate-700/40">
            <span class="w-5 text-center font-mono text-xs ${ui.muted}">${i + 1}</span>
            <span class="min-w-0 flex-1"><span class="block truncate text-sm font-medium">${esc(r.q.title || r.q.id)}</span><span class="block truncate text-xs ${ui.muted}">${esc(CONCEPTS[r.q.concept].name)}</span></span>
            <span class="flex shrink-0 flex-wrap justify-end gap-1">${r.reasons.slice(0, 2).map((x) => chip(x, x === 'Blind spot' ? '!bg-rose-100 !text-rose-700 dark:!bg-rose-500/15 dark:!text-rose-300' : '')).join('')}</span>
          </button></li>`).join('')}
        </ol>
      </section>

      <section class="${ui.card} !p-0 overflow-hidden">
        <div class="p-5 pb-3 ${ui.label}">Scenario library</div>
        <div class="max-h-80 overflow-auto thin-scroll"><table class="w-full text-sm">
          <thead class="sticky top-0 bg-slate-50 dark:bg-slate-900"><tr><th class="${ui.th}">ID</th><th class="${ui.th}">Scenario</th><th class="${ui.th}">Tries</th><th class="${ui.th}">Last</th></tr></thead>
          <tbody class="divide-y divide-slate-100 dark:divide-slate-700/60">
            ${DRILLS.map((x) => { const h = hist(x.id); const l = h[h.length - 1]; return `<tr class="${x.id === q.id ? 'bg-amber-50 dark:bg-amber-500/10' : ''}">
              <td class="${ui.td} font-mono text-xs">${x.id}</td>
              <td class="${ui.td}"><button data-action="open-drill" data-id="${x.id}" class="text-left hover:text-amber-600 dark:hover:text-amber-400"><span class="block font-medium">${esc(x.title)}</span><span class="block text-xs ${ui.muted}">${esc(CONCEPTS[x.concept].name)}${S.unlocked[x.id] ? ' · ★ Master It recommended' : ''}</span></button></td>
              <td class="${ui.td} font-mono">${h.length || '—'}</td>
              <td class="${ui.td}">${!l ? '<span class="text-slate-400">—</span>' : l.correct ? '<span class="text-emerald-600 dark:text-emerald-400">✓</span>' : '<span class="text-rose-600 dark:text-rose-400">✗</span>'}</td>
            </tr>`; }).join('')}
          </tbody>
        </table></div>
      </section>
    </div>

    <!-- RIGHT: instant tutor -->
    <aside class="${ui.card} h-fit lg:sticky lg:top-24 lg:max-h-[calc(100vh-7rem)] lg:overflow-y-auto thin-scroll" aria-live="polite" aria-label="Instant tutor">
      ${tutorPanel(q)}
    </aside>
  </div>`;
}

let drawerConcept = null;
let editingProfile = false;   // transient UI state (not persisted)
let lastFocus = null;
function openDrawer(cid) {
  drawerConcept = cid; lastFocus = document.activeElement;
  renderDrawer();
  const root = $('#drawer');
  root.hidden = false;
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => {
    $('#drawer-overlay').classList.replace('opacity-0', 'opacity-100');
    $('#drawer-panel').classList.remove('translate-x-full');
    $('#drawer-close')?.focus();
  });
}
function closeDrawer() {
  if (!drawerConcept) return;
  drawerConcept = null;
  $('#drawer-overlay').classList.replace('opacity-100', 'opacity-0');
  $('#drawer-panel').classList.add('translate-x-full');
  document.body.style.overflow = '';
  setTimeout(() => { if (!drawerConcept) { $('#drawer').hidden = true; $('#drawer-panel').innerHTML = ''; } }, 300);
  lastFocus?.focus?.();
}

      <section>

      <section><h3 class="${ui.label}">Core facts</h3>
