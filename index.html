    const st = stepState(s.view), active = S.view === s.view;
    return `<button type="button" data-action="nav" data-view="${s.view}" ${active ? 'aria-current="page"' : ''}
      class="group flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-left text-sm transition ${active ? 'bg-amber-500 text-slate-900 shadow-sm' : 'text-slate-700 hover:bg-slate-100 dark:text-slate-200 dark:hover:bg-slate-700/60'}">
      <span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-xs font-bold ${active ? 'bg-slate-900/15' : st === 'done' ? 'bg-emerald-500 text-white' : 'bg-slate-200 dark:bg-slate-700'}">${st === 'done' && !active ? checkIcon : st === 'locked' && !active ? lockIcon : s.n}</span>
      <span class="min-w-0"><span class="block font-semibold">${s.title}</span><span class="block truncate text-[11px] ${active ? 'text-slate-800' : ui.muted}">${s.sub}</span></span>
    </button>`;
  }).join('');
  $('#side-nav').innerHTML = side;
  $('#mobile-nav').innerHTML = STEPS.map((s) => {
    const active = S.view === s.view;
    return `<button type="button" data-action="nav" data-view="${s.view}" ${active ? 'aria-current="page"' : ''} class="flex shrink-0 items-center gap-1.5 rounded-lg px-3 py-1.5 text-sm font-semibold ${active ? 'bg-amber-500 text-slate-900' : 'text-slate-700 dark:text-slate-200'}">${s.title}</button>`;
  }).join('');

  const o = overall();
  const name = S.profile?.name || CONFIG.ownerName;
  $('#side-meta').innerHTML = `
    <div class="text-xs ${ui.muted}">Learner</div><div class="truncate text-sm font-semibold">${esc(name)}</div>
    ${o.n ? `<div class="mt-3 text-xs ${ui.muted}">Live weighted mastery</div>
      <div class="mt-1 flex items-center gap-2"><div class="flex-1">${bar(o.weighted)}</div><span class="font-mono text-xs font-bold ${masteryText(o.weighted)}">${fmtPct(o.weighted)}</span></div>
      <div class="mt-1 text-[11px] ${ui.muted}">Benchmark ${Math.round(T * 100)}% ≈ 720/1000</div>` : ''}
    ${diagnosticDone() ? '' : `<button type="button" data-action="nav" data-view="diagnostic" class="mt-2 text-xs font-semibold text-amber-600 hover:underline dark:text-amber-400">Diagnostic not taken yet →</button>`}`;

  $('#header-status').innerHTML = `<span class="${ui.muted}">${esc(name)}</span>${o.n ? `<span class="rounded-full bg-amber-500/15 px-2 py-0.5 font-mono font-semibold text-amber-700 dark:text-amber-300">${fmtPct(o.weighted)}</span>` : ''}`;
}

function render() {
  const locked = !hasSession();
  const shell = $('#shell'), gate = $('#gate');
  shell.hidden = locked; shell.inert = locked; gate.hidden = !locked;
  if (locked) {
    // Not merely disabled: the portal's views, navigation and widgets are never rendered.
    closeDrawer();
    if ($('#settings').open) $('#settings').close();
    for (const id of ['#view', '#side-nav', '#mobile-nav', '#side-meta', '#header-status']) $(id).innerHTML = '';
    gate.innerHTML = viewGate();
    return;
  }
  gate.innerHTML = '';
  if (!VIEWS[S.view]) S.view = 'welcome';
  if (S.view === 'coach' && !QUESTIONS.get(S.drill.currentId)) pickNextDrill(false);
  renderNav();
  $('#view').innerHTML = VIEWS[S.view]();
  if (drawerConcept) renderDrawer();
}

/* =====================================================================
   12. EVENTS (delegated)
   ===================================================================== */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const a = el.dataset.action, ds = el.dataset;
  if (!hasSession() && a !== 'theme') return;   // only Step 1 is usable before onboarding
  switch (a) {
    case 'nav': go(ds.view); break;
    case 'theme': S.theme = S.theme === 'light' ? 'dark' : 'light'; applyTheme(); persist(); break;
    case 'settings': $('#settings').showModal(); break;
    case 'close-settings': $('#settings').close(); break;
    case 'edit-profile': editingProfile = true; render(); break;
    case 'cancel-edit': editingProfile = false; render(); break;
    case 'diag-prev': S.diagnostic.index = Math.max(0, S.diagnostic.index - 1); persist(); render(); break;
    case 'diag-next': S.diagnostic.index = Math.min(DIAGNOSTIC.length - 1, S.diagnostic.index + 1); persist(); render(); break;
    case 'diag-goto': S.diagnostic.index = Number(ds.index); persist(); render(); break;
    case 'diag-submit': submitDiagnostic(); break;
    case 'retake': retakeDiagnostic(); break;
    case 'drill-answer': answerDrill(Number(ds.index)); break;
    case 'drill-retry': S.drill.evaluated = false; S.drill.selected = null; S.drill.retry = true; persist(); render(); break;
    case 'drill-next': pickNextDrill(); persist(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); break;
    case 'open-drill': setDrill(ds.id); persist(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); break;
    case 'drill-concept': {
      const pick = rankDrills().find((r) => r.q.concept === ds.concept);
      if (!pick) { toast('No drills for this concept yet.', 'error'); break; }
      closeDrawer(); setDrill(pick.q.id); go('coach'); break;
    }
    case 'confused': toggleConfused(); break;
    case 'practice-open': openPracticeSet(Number(ds.set)); break;
    case 'practice-start': startPracticeSet(Number(ds.set)); break;
    case 'practice-list': S.practice.mode = 'list'; explainOpen = false; persist(); render(); break;
    case 'practice-lock': lockPracticeAnswer(); break;
    case 'practice-prev': movePractice(S.practice.active.index - 1); break;
    case 'practice-next': movePractice(S.practice.active.index + 1); break;
    case 'practice-goto': movePractice(Number(ds.index)); break;
    case 'practice-next-open': { const a = S.practice.active; movePractice(Math.max(0, setOrder(a.set).findIndex((id) => a.locked[id] === undefined))); break; }
    case 'practice-explain': explainOpen = !explainOpen; render(); break;
    case 'practice-finish': finishPracticeSet(); break;
    case 'send-report': sendFinalReport(false); break;
    case 'open-drawer': openDrawer(ds.concept); break;
    case 'close-drawer': closeDrawer(); break;
    case 'clear-link': delete S.links[ds.concept]; persist(); renderDrawer(); toast('Training link cleared.'); break;
    case 'reset-logo': S.logo = null; applyLogo(); persist(); toast('Default logo restored.', 'ok'); break;
    case 'export-progress': download(`saa-c03-portal-progress-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(S, null, 2)); break;
    case 'reset-all':
      if (!confirm('Erase your identity, baseline and all tracked answers? This cannot be undone.')) break;
      { const keep = { theme: S.theme, logo: S.logo, links: S.links }; S = { ...defaultState(), ...keep }; persistNow(); setSession(null); $('#settings').close(); closeDrawer(); render(); toast('Portal reset.'); }
      break;
  }
});

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.pick != null) {
    if (!hasSession()) return;
    const diag = t.dataset.ns === 'diag', a = S.practice.active;
    const q = diag ? diagQuestion(S.diagnostic.index) : practiceQ();
    if (!q || (!diag && a.locked[q.id] !== undefined)) return;
    const store = diag ? S.diagnostic.answers : a.picks, i = Number(t.dataset.pick);
    if (qType(q) === 'multi') {
      const cur = Array.isArray(store[q.id]) ? store[q.id].filter((x) => x !== i) : [];
      if (t.checked) {
        if (cur.length >= q.answer.length) { t.checked = false; toast(`Choose exactly ${q.answer.length}. Untick one first.`, 'error'); return; }
        cur.push(i);
      }
      store[q.id] = cur.sort((x, y) => x - y);
    } else store[q.id] = i;
    persist(); render();
  } else if (t.dataset.master) {
    const k = t.dataset.master, wasLocked = !practiceUnlocked();
    if (t.checked) S.remediation.mastered[k] = Date.now(); else delete S.remediation.mastered[k];
    persist(); render();
    if (wasLocked && practiceUnlocked()) toast('All weak topics mastered. The practice exams are unlocked!', 'ok');
    else if (t.checked) toast(`${CATEGORIES[k].name} marked as mastered.`, 'ok');
  } else if (t.id === 'logo-input' && t.files[0]) {
    const f = t.files[0];
    if (f.size > 400 * 1024) { toast('Logo must be under 400 KB.', 'error'); t.value = ''; return; }
    const r = new FileReader();
    r.onload = () => { S.logo = String(r.result); applyLogo(); persistNow(); toast('Logo updated.', 'ok'); t.value = ''; };
    r.readAsDataURL(f);
  }
});

// Fill-in-the-blank: save as the learner types, without re-rendering (keeps focus and caret).
document.addEventListener('input', (e) => {
  const t = e.target;
  if (!t.dataset.fill || !hasSession()) return;
  if (t.dataset.fill === 'diag') {
    const q = diagQuestion(S.diagnostic.index);
    S.diagnostic.answers[q.id] = t.value;
    const done = DIAGNOSTIC.filter((x) => isAnswered(x, S.diagnostic.answers[x.id])).length;
    const count = $('#diag-count'); if (count) count.textContent = done;
    document.querySelectorAll('[data-action="diag-submit"]').forEach((b) => { b.disabled = done < DIAGNOSTIC.length; });
  } else {
    const a = S.practice.active, q = practiceQ();
    if (!a || a.locked[q.id] !== undefined) return;
    a.picks[q.id] = t.value;
    const lock = $('#yt-lock'); if (lock) lock.disabled = !isAnswered(q, t.value);
  }
  persist();
});

document.addEventListener('submit', (e) => {
  if (e.target.id === 'gate-form') {
    e.preventDefault();
    startSession(e.target);
  } else if (e.target.id === 'identity-form') {
    e.preventDefault();
    const fd = new FormData(e.target);
    const name = String(fd.get('name') || '').replace(/\s+/g, ' ').trim();
    const examDate = String(fd.get('examDate') || '');
    if (!name) { toast('Please enter your name to continue.', 'error'); e.target.elements.name.focus(); return; }
    if (!examDate) { toast('Please pick your target exam date.', 'error'); e.target.elements.examDate.focus(); return; }
    const level = LEVELS[fd.get('level')] ? String(fd.get('level')) : 'intermediate';
    S.profile = { name, level, examDate, createdAt: S.profile?.createdAt || Date.now() };
    editingProfile = false;
    persist(); render(); toast('Identity updated.', 'ok');
  } else if (e.target.id === 'link-form') {
    e.preventDefault();
    const cid = e.target.dataset.concept, url = String(new FormData(e.target).get('url') || '').trim();
    if (!youtubeEmbed(url)) { toast('Paste a valid YouTube video or playlist URL.', 'error'); return; }
    S.links[cid] = url; persist(); renderDrawer(); toast('Training set linked to this concept.', 'ok');
  }
});

document.addEventListener('keydown', (e) => {
  if (!hasSession()) return;
  if (e.key === 'Escape' && drawerConcept) { e.preventDefault(); closeDrawer(); return; }
  if (drawerConcept || e.ctrlKey || e.metaKey || e.altKey || $('#settings').open) return;
  const tag = e.target.tagName;
  if ((tag === 'INPUT' && !['radio', 'checkbox'].includes(e.target.type)) || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (tag === 'BUTTON' && (e.key === 'Enter' || e.key === ' ')) return;
  const k = e.key.toLowerCase(), idx = 'abcde'.indexOf(k);
  if (S.view === 'diagnostic') {
    if (k.length === 1 && idx >= 0) { e.preventDefault(); $(`[data-ns="diag"][data-pos="${idx}"]`)?.click(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); $('[data-action="diag-next"]')?.click(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); $('[data-action="diag-prev"]')?.click(); }
  } else if (S.view === 'practice' && S.practice.mode === 'play' && S.practice.active) {
    if (k.length === 1 && idx >= 0) { e.preventDefault(); $(`[data-ns="prac"][data-pos="${idx}"]:not(:disabled)`)?.click(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); $('[data-action="practice-next"]:not(:disabled)')?.click(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); $('[data-action="practice-prev"]:not(:disabled)')?.click(); }
    else if (k === 'l') { e.preventDefault(); $('#yt-lock:not(:disabled)')?.click(); }
    else if (k === 'x') { e.preventDefault(); $('[data-action="practice-explain"]:not(:disabled)')?.click(); }
  } else if (S.view === 'coach') {
    if (k.length === 1 && idx >= 0 && idx < (QUESTIONS.get(S.drill.currentId)?.options.length || 4) && !S.drill.evaluated) { e.preventDefault(); answerDrill(idx); }
    else if (k === 'r') { e.preventDefault(); $('[data-action="drill-retry"]')?.click(); }
    else if (k === 'n') { e.preventDefault(); $('[data-action="drill-next"]')?.click(); }
    else if (e.key === '?') { e.preventDefault(); toggleConfused(); }
  }
});

// Keep keyboard focus inside the open drawer.
document.addEventListener('focusin', (e) => {
  if (drawerConcept && !$('#drawer').contains(e.target)) $('#drawer-close')?.focus();
});

/* =====================================================================
   13. BOOT
   ===================================================================== */
applyTheme();
applyLogo();
if (!S.view || !VIEWS[S.view]) S.view = 'welcome';
render();
if (hasSession()) flushOutbox();   // deliver anything a dropped connection held back
</script>
</body>
</html>
