  { id: 15, mod: 'M01', svc: 'AWS STS', domain: 'SEC',
    q: "A company hires an auditing firm that uses its own AWS account. The firm needs read-only access to the company's resources. The company wants to avoid long-term shared credentials and to protect against the confused deputy problem. What should a solutions architect do?",
    opts: [
      ["Create an IAM user with the ReadOnlyAccess policy and send the firm its access keys.", "Long-term shared keys are hard to rotate and revoke, and they give no confused-deputy protection."],
      ["Create an IAM role with the ReadOnlyAccess policy that trusts the firm's AWS account and requires a unique external ID in the trust policy.", "Temporary STS credentials, revocable by editing the trust policy; the sts:ExternalId condition ties role assumption to this specific customer."],
      ["Share the root user credentials, protected with MFA.", "Sharing root violates every IAM best practice and grants full control."],
      ["Add a bucket policy to every S3 bucket that grants the firm's account access.", "Covers only S3 and still leaves every other service unaudited."]
    ], ans: [1],
    exp: "Third-party cross-account access = role + trust policy + external ID." },
  { id: 16, mod: 'M01', svc: 'IAM (Users, Groups, Policies, Roles)', domain: 'SEC',

      ["Share the root user password with all administrators through a password manager.", "Shared root credentials destroy accountability and widen the attack surface."],
      ["Attach the AdministratorAccess managed policy to the root user.", "Identity policies cannot be attached to the root user; it already has full access."],

  { id: 17, mod: 'M02', svc: 'Amazon EBS', domain: 'PERF',

  { id: 18, mod: 'M02', svc: 'Amazon EBS', domain: 'SEC',
    q: "A production EC2 instance has an unencrypted EBS volume. Compliance now requires every volume to be encrypted with an AWS KMS key. How can the data be moved to an encrypted volume?",

  { id: 19, mod: 'M02', svc: 'Amazon EBS', domain: 'RES',
    q: "A company must back up the EBS volumes of hundreds of EC2 instances every 12 hours and keep each backup for 14 days, with the LEAST operational overhead. What should a solutions architect do?",
    opts: [
      ["Run a cron script on every instance that calls CreateSnapshot and deletes old snapshots.", "Hundreds of scripts to deploy, monitor and fix: high overhead and silent failures."],
      ["Create an Amazon Data Lifecycle Manager (or AWS Backup) policy that targets volumes by tag, snapshots every 12 hours and retains snapshots for 14 days.", "Managed, tag-driven policies handle creation and retention centrally with no servers."],
      ["Enable EBS Multi-Attach and attach each volume to a central backup instance.", "Only io1/io2 in the same AZ, and a shared disk is not a backup."],
      ["Copy the data to instance store volumes every 12 hours.", "Instance store is ephemeral; the data is lost when the instance stops or fails."]

    exp: "Least operational overhead means managed automation: DLM or AWS Backup." },
  { id: 20, mod: 'M03', svc: 'Amazon RDS', domain: 'RES',
    q: "An e-commerce application uses an Amazon RDS for MySQL DB instance. The company needs automatic failover with minimal data loss if the primary instance or its Availability Zone fails. What should a solutions architect do?",
    opts: [
      ["Create a cross-Region read replica.", "Asynchronous (possible data loss) and requires manual promotion; better suited to DR than HA."],
      ["Convert the DB instance to a Multi-AZ deployment.", "A synchronous standby in another AZ with automatic DNS failover, typically within 60 to 120 seconds."],
      ["Take manual snapshots every 5 minutes.", "Restoring takes a long time and loses changes since the last snapshot."],
      ["Move the DB instance to a larger instance class.", "Still a single instance in a single AZ."]
    ], ans: [1],
    exp: "Multi-AZ = high availability (synchronous, automatic failover). Read replicas = read scaling and DR (asynchronous, manual promotion)." },
  { id: 21, mod: 'M03', svc: 'Amazon RDS', domain: 'PERF',
    q: "A reporting team runs long read-only analytical queries against a production Amazon RDS for PostgreSQL database. CPU usage spikes and slows order processing. What is the MOST effective fix with minimal application changes?",
    opts: [

      ["Enable Multi-AZ and point the reporting tools at the standby instance.", "In a Multi-AZ DB instance deployment the standby does not accept connections."],
      ["Enable RDS storage autoscaling.", "Addresses storage capacity, not CPU contention."],
      ["Increase the automated backup retention period.", "Backup settings have no effect on query load."]
    ], ans: [0],
    exp: "Readable scaling = read replicas. The Multi-AZ instance standby is for failover only." },
  { id: 22, mod: 'M06', svc: 'AWS Secrets Manager', domain: 'SEC',
    q: "A company must store the credentials for an Amazon RDS for MySQL database securely and rotate them automatically every 30 days without application downtime. Which service should it use?",
    opts: [

  { id: 23, mod: 'M03', svc: 'Amazon RDS', domain: 'RES',
    q: "A serverless application's AWS Lambda functions connect to an Amazon RDS for PostgreSQL database. During traffic spikes the database fails with 'too many connections' errors. What should a solutions architect do with minimal code changes?",
    opts: [

  { id: 24, mod: 'M14', svc: 'Amazon CloudWatch', domain: 'RES',
    q: "A solutions architect must monitor memory utilization and free disk space on a fleet of Amazon EC2 Linux instances and alarm when thresholds are crossed. What should the architect do?",

  { id: 25, mod: 'M14', svc: 'Amazon CloudWatch', domain: 'RES',
    q: "A legacy application runs on a single EC2 instance that cannot join an Auto Scaling group. If the underlying host fails, the instance must be recovered automatically and keep its instance ID, private IP address and Elastic IP address. What should a solutions architect do?",

  { id: 26, mod: 'M14', svc: 'Amazon CloudWatch', domain: 'RES',

  { id: 27, mod: 'M07', svc: 'Amazon Route 53', domain: 'PERF',
    q: "A company runs identical stacks in us-east-1, eu-west-1 and ap-southeast-1. Users must reach the Region with the lowest network latency for them, and traffic must shift away from a Region that becomes unhealthy. Which Amazon Route 53 configuration meets these requirements?",
    opts: [

      ["A simple routing record with multiple IP addresses", "Returns all values in random order, with no health checks."]
    ], ans: [0],
    exp: "Lowest latency = latency routing; legal or content localization by country = geolocation." },
  { id: 28, mod: 'M07', svc: 'Amazon Route 53', domain: 'RES',
    q: "A company's primary web application runs in us-west-2, and a static maintenance site is hosted in Amazon S3. If the primary application fails health checks, traffic must go to the maintenance site automatically. Which Route 53 routing policy should be used?",
    opts: [

      ["Multivalue answer routing", "Returns up to eight healthy records at random, with no primary/secondary semantics."],
      ["Geoproximity routing", "Routes by geographic distance with a bias; it is not a failover pattern."]

    exp: "Active-passive DR in DNS = failover routing policy." },
  { id: 29, mod: 'M07', svc: 'Amazon Route 53', domain: 'PERF',

  { id: 30, mod: 'M07', svc: 'Amazon CloudFront', domain: 'SEC',

  { id: 31, mod: 'M07', svc: 'Amazon CloudFront', domain: 'SEC',

  { id: 32, mod: 'M07', svc: 'Amazon CloudFront', domain: 'SEC',

  { id: 33, mod: 'M02', svc: 'High Availability & Scalability', domain: 'RES',

  { id: 34, mod: 'M07', svc: 'AWS Site-to-Site VPN', domain: 'COST',

  { id: 35, mod: 'M02', svc: 'EC2 Purchase Options', domain: 'COST',

  { id: 36, mod: 'M04', svc: 'S3 Storage Classes', domain: 'COST',

  { id: 37, mod: 'M03', svc: 'Amazon Aurora (Serverless & Global Database)', domain: 'COST',

  { id: 38, mod: 'M07', svc: 'Amazon CloudFront', domain: 'COST',

  { id: 39, mod: 'M14', svc: 'Amazon CloudWatch', domain: 'COST',
    q: "An organization's CloudWatch Logs bill is growing quickly. Engineers query application logs only during the first 30 days, but auditors require the logs to be kept for 7 years and rarely access them. What should a solutions architect do to MINIMIZE cost while meeting the requirements?",

  { id: 40, mod: 'M02', svc: 'Amazon EBS', domain: 'COST',

  { id: 41, mod: 'M01', svc: 'IAM Access Analyzer', domain: 'SEC',

function randInt(max) {
  if (window.crypto && crypto.getRandomValues) {
    const buf = new Uint32Array(1);
    crypto.getRandomValues(buf);
    return buf[0] % max;
  }
  return Math.floor(Math.random() * max);
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = randInt(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function sameSet(a, b) {
  if (a.length !== b.length) return false;
  const s = new Set(a);

}

function dialog({ title, html, ok = 'OK', cancel = 'Cancel', danger = false }) {
  return new Promise(resolve => {
    const modal = $('#modal'), okBtn = $('#modalOk'), cancelBtn = $('#modalCancel');
    const previous = document.activeElement;
    $('#modalTitle').textContent = title;
    $('#modalBody').innerHTML = html;
    okBtn.textContent = ok;
    okBtn.className = danger ? 'danger' : 'primary';
    cancelBtn.hidden = !cancel;
    if (cancel) cancelBtn.textContent = cancel;
    modal.hidden = false;
    okBtn.focus();
    const done = value => {
      modal.hidden = true;
      okBtn.onclick = cancelBtn.onclick = modal.onclick = null;
      document.removeEventListener('keydown', onKey, true);
      if (previous && previous.focus) previous.focus();
      resolve(value);
    };
    const onKey = e => {
      if (e.key === 'Escape') { e.stopPropagation(); done(false); }
      if (e.key === 'Tab') {
        const items = [cancelBtn, okBtn].filter(b => !b.hidden);
        const idx = items.indexOf(document.activeElement);
        e.preventDefault();
        items[(idx + (e.shiftKey ? -1 : 1) + items.length) % items.length].focus();
      }
    };
    okBtn.onclick = () => done(true);
    cancelBtn.onclick = () => done(false);
    modal.onclick = e => { if (e.target === modal && cancel) done(false); };
    document.addEventListener('keydown', onKey, true);
  });
}

// Removes a flat backdrop (e.g. the white canvas of a JPEG logo) so the logo
// sits directly on the nav bar. The backdrop colour is estimated from the
// border pixels; everything connected to the border that is close to it
// becomes transparent, large enclosed pockets of it too, and edge pixels get
// feathered alpha with the backdrop colour un-mixed (no white fringe).
// Resolves to a PNG data URI, or null when the image has no flat backdrop
// (already transparent, photo edges, or unreadable).
const keyedLogoCache = new Map();
function keyLogoBackground(src) {
  if (keyedLogoCache.has(src)) return keyedLogoCache.get(src);
  const job = new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      try {
        const scale = Math.min(1, 512 / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * scale)), h = Math.max(1, Math.round(img.naturalHeight * scale));
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, w, h);
        const im = ctx.getImageData(0, 0, w, h), d = im.data, n = w * h;
        const ring = [];
        for (let x = 0; x < w; x++) ring.push(x, (h - 1) * w + x);
        for (let y = 1; y < h - 1; y++) ring.push(y * w, y * w + w - 1);
        if (ring.filter(i => d[i * 4 + 3] < 250).length > ring.length * 0.5) return resolve(null); // already transparent
        const med = c => { const v = ring.map(i => d[i * 4 + c]).sort((a, b) => a - b); return v[v.length >> 1]; };
        const bg = [med(0), med(1), med(2)];
        const dist = new Uint8Array(n);
        for (let i = 0; i < n; i++) {
          dist[i] = Math.max(Math.abs(d[i * 4] - bg[0]), Math.abs(d[i * 4 + 1] - bg[1]), Math.abs(d[i * 4 + 2] - bg[2]));
        }
        if (ring.filter(i => dist[i] <= 24).length < ring.length * 0.85) return resolve(null); // no flat backdrop
        const FILL = 46, CORE = 10, SOFT = 64;
        const mask = new Uint8Array(n), stack = [];
        const seed = i => { if (!mask[i] && dist[i] <= FILL) { mask[i] = 1; stack.push(i); } };
        const flood = () => {
          while (stack.length) {
            const i = stack.pop(), x = i % w, y = (i / w) | 0;
            if (x > 0) seed(i - 1);
            if (x < w - 1) seed(i + 1);
            if (y > 0) seed(i - w);
            if (y < h - 1) seed(i + w);
          }
        };
        ring.forEach(seed);
        flood();
        // Enclosed pockets of backdrop (letter counters): near-exact matches
        // only, and big enough not to be a specular highlight.
        const seen = new Uint8Array(n), minPocket = Math.max(24, n * 0.0015);
        for (let i = 0; i < n; i++) {
          if (mask[i] || seen[i] || dist[i] > 6) continue;
          const comp = [i]; seen[i] = 1;
          for (let k = 0; k < comp.length; k++) {
            const j = comp[k], x = j % w, y = (j / w) | 0;
            const nb = [x > 0 ? j - 1 : -1, x < w - 1 ? j + 1 : -1, y > 0 ? j - w : -1, y < h - 1 ? j + w : -1];
            for (const t of nb) if (t >= 0 && !seen[t] && !mask[t] && dist[t] <= 6) { seen[t] = 1; comp.push(t); }
          }
          if (comp.length >= minPocket) comp.forEach(j => { mask[j] = 1; stack.push(j); });
        }
        flood();
        // Feather: backdrop pixels plus a 2 px band around them.
        const band = new Uint8Array(n);
        for (let i = 0; i < n; i++) {
          if (!mask[i]) continue;
          const x = i % w, y = (i / w) | 0;
          for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
            const xx = x + dx, yy = y + dy;
            if (xx >= 0 && yy >= 0 && xx < w && yy < h) band[yy * w + xx] = 1;
          }
        }
        for (let i = 0; i < n; i++) {
          if (!band[i]) continue;
          const t = Math.min(1, Math.max(0, (dist[i] - CORE) / (SOFT - CORE)));
          const s = t * t * (3 - 2 * t);
          const a = mask[i] ? s : Math.max(s, 0.35 + 0.65 * t);
          if (a <= 0.01) { d[i * 4 + 3] = 0; continue; }
          for (let c = 0; c < 3; c++) {
            d[i * 4 + c] = Math.min(255, Math.max(0, Math.round(bg[c] + (d[i * 4 + c] - bg[c]) / a)));
          }
          d[i * 4 + 3] = Math.round(a * 255);
        }
        ctx.putImageData(im, 0, 0);
        resolve(cv.toDataURL('image/png'));
      } catch (e) {
        resolve(null);
      }
    };
    img.onerror = () => resolve(null);
    img.src = src;
  });
  keyedLogoCache.set(src, job);
  return job;
}

function handleLogoFile(file) {
  if (!file) return;
  if (!/^image\/(png|jpeg|svg\+xml|webp|gif)$/.test(file.type)) {
    log('error', `Logo rejected: unsupported type ${file.type || 'unknown'}.`);
    return;
  }
  if (file.size > BRAND_CONFIG.maxLogoBytes) {
    log('error', `Logo rejected: ${Math.round(file.size / 1024)} KB exceeds the ${BRAND_CONFIG.maxLogoBytes / 1024} KB limit.`);

  reader.onload = () => {

    } else {

}

const sysTest = { results: null, running: false, resizeTimer: 0 };

function checkStorage() {
  try {
    const k = 'saa.__probe__', v = String(Date.now()) + Math.random();
    localStorage.setItem(k, v);
    const ok = localStorage.getItem(k) === v;
    localStorage.removeItem(k);
    if (!ok) throw new Error('value read back did not match');
    let bytes = 0;
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && key.startsWith('saa.')) bytes += (key.length + (localStorage.getItem(key) || '').length) * 2;
    }
    return { status: 'ok', detail: `Write, read and delete verified. Portal data uses ${(bytes / 1024).toFixed(1)} KB. Answers, mode, flags and the timer survive a refresh.` };
  } catch (err) {
    return { status: 'err', detail: `LocalStorage is unavailable (${err.name}: ${err.message}). Exam progress will NOT survive a refresh. Leave private browsing or allow site data for this page.` };
  }
}

async function checkNetwork() {
  if (!navigator.onLine) {
    return { status: 'err', detail: 'The browser reports it is offline. Exams, diagrams, labs and drills still work; the Live Lab and documentation links need a connection.' };
  }
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 5000);
  const t0 = performance.now();
  try {
    await fetch(PROBE_URL, { method: 'HEAD', mode: 'no-cors', cache: 'no-store', signal: ctrl.signal });
    const ms = Math.round(performance.now() - t0);
    const conn = navigator.connection && navigator.connection.effectiveType ? `, effective type ${navigator.connection.effectiveType}` : '';
    return ms < 1500
      ? { status: 'ok', detail: `Online. External resources reachable in ${ms} ms${conn}.` }
      : { status: 'warn', detail: `Online but slow: an external CDN answered in ${ms} ms${conn}. Documentation links may load slowly.` };
  } catch (err) {
    return { status: 'warn', detail: `Online, but external resources are unreachable (${err.name === 'AbortError' ? 'timed out after 5 s' : err.message}). Everything in the portal still works; external documentation links may not open.` };
  } finally {
    clearTimeout(timer);
  }
}

function checkScaling() {
  const w = window.innerWidth, h = window.innerHeight;
  const dpr = Math.round((window.devicePixelRatio || 1) * 100) / 100;
  const zoom = window.visualViewport ? window.visualViewport.scale : 1;
  const info = `Viewport ${w}×${h} CSS px, device pixel ratio ${dpr}${Math.abs(zoom - 1) > 0.01 ? `, pinch zoom ${zoom.toFixed(2)}×` : ''}.`;
  if (w < 320 || h < 400) return { status: 'err', detail: `${info} Too small for the exam interface: enlarge the window or reduce browser zoom.` };
  if (w < 1100 || h < 600 || Math.abs(zoom - 1) > 0.05) return { status: 'warn', detail: `${info} Usable, with the compact layout (navigator below the question). 1100×600 or larger at 100% zoom is optimal.` };
  return { status: 'ok', detail: `${info} Optimal for the side-by-side exam layout.` };
}

const ST_LABEL = { ok: 'Pass', warn: 'Warning', err: 'Fail', pending: 'Checking…' };
function overallStatus(results) {
  const list = Object.values(results);
  if (list.some(r => r.status === 'err')) return 'err';
  if (list.some(r => r.status === 'warn')) return 'warn';
  if (list.some(r => r.status === 'pending')) return 'pending';
  return 'ok';
}

function renderSystemTest() {
  const box = $('#sysTest');
  const r = sysTest.results;
  if (!r) return;
  const overall = overallStatus(r);
  const head = { ok: 'All checks passed: ready to launch', warn: 'Ready, with warnings', err: 'Action needed before a timed exam', pending: 'Running checks…' }[overall];
  const tile = (key, title) => `
    <div class="check" id="st-${key}">
      <div class="row"><b>${title}</b><span class="spacer"></span><span class="pill ${r[key].status === 'pending' ? 'pending' : r[key].status}">${ST_LABEL[r[key].status]}</span></div>
      <p>${esc(r[key].detail)}</p>
    </div>`;
  box.className = `systest${overall === 'warn' ? ' has-warn' : overall === 'err' ? ' has-err' : ''}`;
  box.innerHTML = `
    <div class="systest-head">
      <h3>System Test</h3>
      <span class="pill ${overall === 'pending' ? 'pending' : overall}">${esc(head)}</span>
      <span class="spacer"></span>
      <button class="sm" id="stRerun"${sysTest.running ? ' disabled' : ''}>Re-run test</button>
      <button class="sm primary" id="stDismiss">Continue</button>
    </div>
    <p class="muted small" style="margin:6px 0 0">Onboarding health check of the browser features the portal depends on. Run it again any time from the status log bar.</p>
    <div class="checks">
      ${tile('storage', 'LocalStorage access')}
      ${tile('network', 'Network connectivity')}
      ${tile('scaling', 'Window scaling')}
    </div>`;
  $('#stRerun').onclick = () => runSystemTest(true);
  $('#stDismiss').onclick = dismissSystemTest;
}

async function runSystemTest(show) {
  if (sysTest.running) return;
  sysTest.running = true;
  sysTest.results = {
    storage: checkStorage(),
    network: { status: 'pending', detail: 'Probing connectivity…' },
    scaling: checkScaling()
  };
  const prior = store.get(KEY_SYSTEST, null);
  const box = $('#sysTest');
  if (show || !prior) box.hidden = false;
  renderSystemTest();
  sysTest.results.network = await checkNetwork();
  sysTest.running = false;
  const overall = overallStatus(sysTest.results);
  if (overall === 'err') box.hidden = false;
  renderSystemTest();
  const summary = ['storage', 'network', 'scaling'].map(k => `${k} ${ST_LABEL[sysTest.results[k].status].toLowerCase()}`).join(', ');
  log(overall === 'ok' ? 'ok' : overall === 'warn' ? 'warn' : 'error', `System test: ${summary}.`);
  ['storage', 'network', 'scaling'].forEach(k => {
    if (sysTest.results[k].status !== 'ok') log(sysTest.results[k].status === 'err' ? 'error' : 'warn', `System test (${k}): ${sysTest.results[k].detail}`);
  });
}

function dismissSystemTest() {
  $('#sysTest').hidden = true;
  store.set(KEY_SYSTEST, { at: Date.now(), overall: sysTest.results ? overallStatus(sysTest.results) : 'unknown' });
}

function loadExam(key, submitted) {
  const e = store.get(key, null);
  if (!e || e.v !== 3 || !Array.isArray(e.order) || !e.optOrder || !MODES[e.mode] || typeof e.startedAt !== 'number') return null;
  if (e.mode === 'timed' && typeof e.endsAt !== 'number') return null;
  if (!!e.submitted !== submitted || (submitted && !e.result)) return null;
  e.order = e.order.filter(id => QMAP[id] && Array.isArray(e.optOrder[id]) && e.optOrder[id].length === QMAP[id].opts.length);
  if (!e.order.length) return null;
  e.answers = e.answers || {};
  e.flags = e.flags || {};
  e.checked = e.checked || {};
  e.unscored = Array.isArray(e.unscored) ? e.unscored : [];
  e.warned = e.warned || {};
  e.current = Math.min(Math.max(0, e.current | 0), e.order.length - 1);

function countdownParts() {
  const diff = EXAM_DEADLINE - Date.now();
  if (diff <= 0) return null;
  const s = Math.floor(diff / 1000);
  return { d: Math.floor(s / 86400), h: Math.floor(s % 86400 / 3600), m: Math.floor(s % 3600 / 60), s: s % 60 };
}
function updateCountdown() {
  const p = countdownParts();
  $('#navCountdown').textContent = p ? `${p.d}d ${pad(p.h)}:${pad(p.m)}:${pad(p.s)}` : 'Deadline reached';
  $('#navCountdownShort').textContent = p ? `${p.d}d ${pad(p.h)}h` : 'Today';

/* ======================================================================
   Mock exam: lifecycle (Timed Exam Mode vs Review Practice Mode)
   ====================================================================== */
function describeLaunch(kind, setNo, mods) {
  if (kind === 'set') return { ids: SETS[setNo - 1], label: setTitle(setNo) };
  if (kind === 'full') { const f = buildFullLength(); return { ids: f.ids, unscored: f.unscored, label: 'SAA-C03 Full-Length Exam Simulation (65 Q)' }; }
  if (kind === 'domain') return { ids: QUESTIONS.filter(q => mods.includes(q.domain)).map(q => q.id), label: `Domain practice (${mods.map(d => DOMAIN_SHORT[d]).join(', ')})` };
  const ids = QUESTIONS.filter(q => mods.includes(q.mod)).map(q => q.id);
  const label = kind === 'drill' ? `Module ${MOD[mods[0]].code} drill: ${MOD[mods[0]].name}`
    : `Weak-area practice (${mods.map(id => MOD[id].code).join(', ')})`;
  return { ids, label };
}

async function startExam({ kind, setNo = null, mods = null, mode = prefMode }) {
  const { ids, label, unscored = [] } = describeLaunch(kind, setNo, mods);
  if (!ids.length) return;
  const minutes = mode === 'timed' ? (kind === 'set' || kind === 'full' ? FULL_EXAM_MINUTES : Math.max(10, ids.length * 2)) : null;
  const ok = await dialog({
    title: `Start ${label}?`,
    html: `<p><span class="mode-badge ${mode}">${esc(MODES[mode].name)}</span></p>
      <p>${ids.length} questions${mode === 'timed'
        ? ` · strict ${minutes}-minute countdown. Answers and explanations stay hidden until you submit. At 0:00:00 inputs freeze and the exam is graded automatically.`
        : ` · no time limit (elapsed time is tracked). Use <b>Check Answer</b> under each question for instant explanations and memory tricks.`}</p>
      ${kind === 'full' ? `<p>${ids.length - unscored.length} questions are scored and ${unscored.length} are unscored, as on the real exam. You will not know which are unscored until the report.</p>` : ''}
      ${examActive() ? `<p class="warn-text">An exam is already in progress (${esc(exam.label)}). Starting discards it without grading.</p>` : ''}
      <p class="muted small">Progress, mode, flags and time are saved to LocalStorage on every change.</p>`,
    ok: 'Start', danger: examActive()
  });
  if (!ok) return;
  if (examActive()) log('warn', `In-progress session discarded: ${exam.label}.`);
  const order = shuffle(ids);
  const optOrder = {};
  order.forEach(id => { optOrder[id] = shuffle(QMAP[id].opts.map((_, i) => i)); });
  const now = Date.now();
  exam = {
    v: 3, id: now.toString(36), kind, setNo, mods, label, mode, order, optOrder, unscored,
    answers: {}, flags: {}, checked: {}, warned: {}, current: 0,
    minutes, startedAt: now, endsAt: minutes ? now + minutes * 60000 : null,
    locked: false, submitted: false, result: null
  };
  saveExam();
  log('info', `${label} started in ${MODES[mode].name}: ${order.length} questions${minutes ? `, ${minutes}-minute timer` : ', untimed'}. Session saved to LocalStorage on every change.`);
  toggleSidebar(false);
  showView('exam');
}

function grade(auto) {
  const per = {}, perSvc = {}, perDomain = {};
  let correct = 0;
  exam.order.forEach(id => {
    if (exam.unscored.includes(id)) return; // unscored items never count
    const q = QMAP[id];
    const ok = sameSet(exam.answers[id] || [], q.ans);
    [[per, q.mod], [perSvc, q.svc], [perDomain, q.domain]].forEach(([bucket, key]) => {
      bucket[key] = bucket[key] || { c: 0, n: 0 };
      bucket[key].n++;
      if (ok) bucket[key].c++;
    });
    if (ok) correct++;
  });
  const total = exam.order.filter(id => !exam.unscored.includes(id)).length;
  const scaled = Math.round(100 + 900 * correct / total);
  const end = exam.mode === 'timed' ? Math.min(Date.now(), exam.endsAt) : Date.now();
  return {
    correct, total, scaled, pass: scaled >= PASS_SCORE, per, perSvc, perDomain,
    answered: exam.order.filter(id => (exam.answers[id] || []).length).length,
    flagged: exam.order.filter(id => exam.flags[id]).length,
    checkedCount: Object.keys(exam.checked).length,
    usedMs: end - exam.startedAt, submittedAt: Date.now(), auto
  };
}

function submitExam(auto) {
  if (!examActive()) return;
  const r = grade(auto);
  exam.submitted = true;
  exam.result = r;
  report = exam;
  exam = null;
  store.set(KEY_REPORT, report);
  store.del(KEY_SESSION);
  attemptLog.push({
    when: r.submittedAt, label: report.label, kind: report.kind, setNo: report.setNo, mode: report.mode,
    full: report.kind === 'set', total: r.total, correct: r.correct, scaled: r.scaled, pass: r.pass, usedMs: r.usedMs, per: r.per
  });
  if (attemptLog.length > 200) attemptLog = attemptLog.slice(-200);
  store.set(KEY_HISTORY, attemptLog);
  renderSidebar();
  const weak = weakModulesOf(report);
  log(r.pass ? 'ok' : 'warn', `${report.label} (${MODES[report.mode].short}) ${auto ? 'auto-submitted at 0:00:00' : 'submitted'}: ${r.correct}/${r.total} correct, scaled score ${r.scaled}/1000, ${r.pass ? 'PASS' : 'FAIL'} (passing score ${PASS_SCORE}).`);
  log(weak.length ? 'warn' : 'ok', weak.length ? `Weak modules below ${WEAK_THRESHOLD}%: ${weak.map(id => MOD[id].code).join(', ')}. Remediation generated in the Performance Report.` : `No weak modules below ${WEAK_THRESHOLD}%.`);
  reportState.filter = 'all'; reportState.mod = ''; reportState.metric = 'module';
  showView('report');
  if (auto) dialog({ title: "Time's up", html: `<p>The ${report.minutes}-minute timer reached 0:00:00. Inputs were frozen and the ${r.answered} answer${r.answered === 1 ? '' : 's'} you had tracked were graded automatically.</p>`, ok: 'View report', cancel: null });
}

// Timed Mode deadline: freeze every input first, then grade whatever was tracked.
function expireExam() {
  if (!examActive()) return;
  if (!exam.locked) {
    exam.locked = true;
    saveExam();
    log('warn', 'Time expired: exam inputs frozen, auto-submitting tracked answers.');
  }
  freezeExamUI();
  submitExam(true);
}
function freezeExamUI() {
  const shell = $('#view-exam .exam');
  if (shell) shell.classList.add('frozen');
  $$('#view-exam input, #view-exam button').forEach(el => { el.disabled = true; });
}
// Returns true when the exam no longer accepts input (and triggers expiry if time is up).
function inputBlocked() {
  if (!examActive()) return true;
  if (exam.locked) { expireExam(); return true; }
  if (isTimed() && Date.now() >= exam.endsAt) { expireExam(); return true; }
  return false;
}

async function requestSubmit() {
  if (inputBlocked()) return;
  const n = exam.order.length;
  const answered = exam.order.filter(id => (exam.answers[id] || []).length).length;
  const incomplete = exam.order.filter(id => {
    const sel = exam.answers[id] || [];
    return sel.length > 0 && sel.length < QMAP[id].ans.length;
  }).length;
  const flagged = exam.order.filter(id => exam.flags[id]).length;
  const ok = await dialog({
    title: 'Submit exam?',
    html: `<p>You have answered <b>${answered}</b> of <b>${n}</b> questions${isTimed() ? ` with <b>${fmtHMS(exam.endsAt - Date.now())}</b> remaining` : ` in <b>${fmtHMS(Date.now() - exam.startedAt)}</b>`}.</p>
      ${n - answered ? `<p class="warn-text">${n - answered} unanswered question${n - answered === 1 ? '' : 's'} will be scored as incorrect.</p>` : ''}
      ${incomplete ? `<p class="warn-text">${incomplete} multiple-response question${incomplete === 1 ? ' has' : 's have'} fewer selections than required.</p>` : ''}
      ${flagged ? `<p>${flagged} question${flagged === 1 ? ' is' : 's are'} still flagged for review.</p>` : ''}
      <p class="muted">Answers cannot be changed after submission.</p>`,
    ok: 'Submit exam', danger: true
  });
  if (ok && examActive()) submitExam(false);
}

  if (!rep) return [];
  return Object.keys(DOMAINS).filter(d => rep.result.perDomain[d] && pctOf(rep.result.perDomain[d]) < WEAK_THRESHOLD);
}

function domainMix(ids) {
  const c = { SEC: 0, RES: 0, PERF: 0, COST: 0 };

}

function updateTimer() {
  const el = $('#examTimer');
  if (!el || !examActive()) return;
  if (isTimed()) {
    const remaining = exam.endsAt - Date.now();
    el.innerHTML = `<small>Time left</small>${fmtHMS(remaining)}`;
    el.classList.toggle('warn', remaining <= 600000 && remaining > 60000);
    el.classList.toggle('crit', remaining <= 60000);
  } else {
    el.innerHTML = `<small>Elapsed</small>${fmtHMS(Date.now() - exam.startedAt)}`;
  }
}

function renderQuestion() {
  const id = exam.order[exam.current];
  const q = QMAP[id];
  const multi = q.ans.length > 1;
  const sel = exam.answers[id] || [];
  const checked = exam.mode === 'review' && !!exam.checked[id];
  $('#qPos').textContent = `${exam.current + 1} of ${exam.order.length}`;
  $('#qMod').textContent = `Module ${MOD[q.mod].code} · ${MOD[q.mod].name}`;
  $('#qDomain').textContent = DOMAIN_SHORT[q.domain];
  $('#qDomain').title = DOMAINS[q.domain];
  $('#qHint').textContent = multi ? `Multiple response · select ${q.ans.length}` : 'Multiple choice · select 1';
  $('#qText').textContent = q.q;
  $('#qOpts').setAttribute('role', multi ? 'group' : 'radiogroup');
  $('#qOpts').innerHTML = exam.optOrder[id].map((orig, pos) => {
    const picked = sel.includes(orig), right = q.ans.includes(orig);
    const state = checked ? (right ? ' correct' : picked ? ' wrong' : '') : picked ? ' selected' : '';
    return `<label class="opt${state}${checked ? ' locked' : ''}">
      <input type="${multi ? 'checkbox' : 'radio'}" name="q${id}" value="${orig}"${picked ? ' checked' : ''}${checked ? ' disabled' : ''}>
      <span class="letter">${letter(pos)}.</span>
      <span>${esc(q.opts[orig][0])}${checked ? `<span class="why">${right ? '✓ ' : picked ? '✗ ' : ''}${esc(q.opts[orig][1])}</span>` : ''}</span>
    </label>`;
  }).join('');
  renderCheckArea();
  $('#flagChk').checked = !!exam.flags[id];
  $('#flagWrap').classList.toggle('on', !!exam.flags[id]);
  $('#prevBtn').disabled = exam.current === 0;
  $('#nextBtn').innerHTML = exam.current === exam.order.length - 1 ? 'Finish &amp; Submit' : 'Next Question &#9654;';
}

function renderCheckArea() {
  const box = $('#qCheck');
  if (exam.mode !== 'review') { box.innerHTML = ''; return; }
  const id = exam.order[exam.current];
  const q = QMAP[id];
  const sel = exam.answers[id] || [];
  if (!exam.checked[id]) {
    const ready = sel.length === q.ans.length;
    box.innerHTML = `<div class="check-row">
      <button class="primary" id="checkBtn"${ready ? '' : ' disabled'}>Check Answer</button>
      <span class="muted small">${ready ? 'Locks this answer and shows the explanation.' : `Select ${q.ans.length} option${q.ans.length > 1 ? 's' : ''} to check.`}</span>
    </div>`;
    return;
  }
  const ok = sameSet(sel, q.ans);
  box.innerHTML = `<div class="feedback ${ok ? 'ok' : 'bad'}" role="status">
    <div class="verdict-line">${ok ? '✓ Correct' : `✗ Incorrect · correct answer: ${optLetters(exam.optOrder[id], q.ans)}`}</div>
    <div class="small" style="color:var(--soft-text)"><b>Architect's takeaway:</b> ${esc(q.exp)}</div>
    ${trickHtml(q.svc)}
  </div>`;
}

function syncOptionStates() {
  const sel = exam.answers[exam.order[exam.current]] || [];
  $$('#qOpts .opt').forEach(label => {
    const input = $('input', label);
    const on = sel.includes(Number(input.value));
    input.checked = on;
    label.classList.toggle('selected', on);
  });
  renderCheckArea();
}

function renderPalette() {
  const answered = exam.order.filter(id => (exam.answers[id] || []).length).length;
  const flagged = exam.order.filter(id => exam.flags[id]).length;
  const checkedIds = exam.order.filter(id => exam.checked[id]);
  const checkedOk = checkedIds.filter(id => sameSet(exam.answers[id] || [], QMAP[id].ans)).length;
  $('#palStats').innerHTML = `
    <div><b>${answered}</b>Attempted</div>
    <div><b>${flagged}</b>Flagged</div>
    <div><b>${exam.order.length - answered}</b>Unattempted</div>
    ${exam.mode === 'review' ? `<div style="grid-column:1/-1"><b>${checkedOk}/${checkedIds.length}</b>Checked answers correct</div>` : ''}`;
  $('#palGrid').innerHTML = exam.order.map((id, i) => {
    const a = (exam.answers[id] || []).length > 0;
    const f = !!exam.flags[id];
    const chk = exam.mode === 'review' && exam.checked[id] ? (sameSet(exam.answers[id] || [], QMAP[id].ans) ? 'chk-ok' : 'chk-bad') : '';
    const cls = ['pal-cell', chk || (a ? 'answered' : 'unanswered'), f ? 'flagged' : '', i === exam.current ? 'current' : ''].join(' ');
    const state = chk === 'chk-ok' ? 'checked correct' : chk === 'chk-bad' ? 'checked incorrect' : a ? 'attempted' : 'unattempted';
    return `<button class="${cls}" data-idx="${i}" aria-label="Question ${i + 1}: ${state}${f ? ', flagged' : ''}"${i === exam.current ? ' aria-current="true"' : ''}>${i + 1}</button>`;
  }).join('');
}

function goTo(idx) {
  if (inputBlocked() || idx < 0 || idx >= exam.order.length || idx === exam.current) return;
  exam.current = idx;
  saveExam();
  renderQuestion();
  renderPalette();
  $('#qText').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function jumpTo(predicate, label) {
  const n = exam.order.length;
  for (let step = 1; step < n; step++) {
    const idx = (exam.current + step) % n;
    if (predicate(exam.order[idx])) { goTo(idx); return; }
  }
  log('info', `No other ${label} questions.`);
}

function selectOption(orig) {
  if (inputBlocked()) return;
  const id = exam.order[exam.current];
  if (exam.mode === 'review' && exam.checked[id]) { log('info', 'This answer was already checked and is locked.'); return; }
  const need = QMAP[id].ans.length;
  let sel = (exam.answers[id] || []).slice();
  if (need === 1) sel = [orig];
  else if (sel.includes(orig)) sel = sel.filter(x => x !== orig);
  else if (sel.length >= need) log('warn', `Question ${exam.current + 1} requires exactly ${need} selections. Deselect an option first.`);
  else sel.push(orig);
  if (sel.length) exam.answers[id] = sel; else delete exam.answers[id];
  saveExam();
  syncOptionStates();
  renderPalette();
}

function checkAnswer() {
  if (inputBlocked() || exam.mode !== 'review') return;
  const id = exam.order[exam.current];
  const q = QMAP[id];
  const sel = exam.answers[id] || [];
  if (exam.checked[id] || sel.length !== q.ans.length) return;
  exam.checked[id] = true;
  saveExam();
  renderQuestion();
  renderPalette();
  const ok = sameSet(sel, q.ans);
  log(ok ? 'ok' : 'warn', `Question ${exam.current + 1} checked: ${ok ? 'correct' : 'incorrect'} (${q.svc}).`);
}

function setFlag(on) {
  if (inputBlocked()) return;
  const id = exam.order[exam.current];
  if (on) exam.flags[id] = true; else delete exam.flags[id];
  saveExam();
  $('#flagChk').checked = on;
  $('#flagWrap').classList.toggle('on', on);
  renderPalette();
  log('info', `Question ${exam.current + 1} ${on ? 'flagged for review' : 'unflagged'}.`);
}

function filterStudy() {
  const q = studyState.query.trim().toLowerCase();
  let services = 0, modules = 0;
  MODULES.forEach(m => {
    const d = document.getElementById(`study-${m.id}`);
    if (!d) return;
    const nameHit = !q || `${m.code} ${m.name}`.toLowerCase().includes(q);
    const notesHit = !!q && $('.notes', d).dataset.text.includes(q);
    let hits = 0;
    $$('.svc-card', d).forEach(card => {
      const show = nameHit || card.dataset.text.includes(q);
      card.hidden = !show;
      if (show) hits++;
    });
    d.hidden = hits === 0 && !notesHit;
    if (!d.hidden) { modules++; services += hits; }
    if (q && !d.hidden && !d.open) d.open = true;
  });
  $('#studyCount').textContent = q
    ? `${services} service${services === 1 ? '' : 's'} in ${modules} module${modules === 1 ? '' : 's'} match "${studyState.query.trim()}".`
    : `${MODULES.length} modules · ${Object.keys(SVC_INFO).length} services with memory tricks · ${QUESTIONS.length} practice questions.`;
}

}

  $$('[data-copy]', root).forEach(btn => btn.addEventListener('click', () => copyDiagram(btn.dataset.copy, btn)));

function renderMetricBars() {
  const r = report.result;
  $$('#metricMode button').forEach(b => b.classList.toggle('on', b.dataset.metric === reportState.metric));
  let rows;
  if (reportState.metric === 'module') {
    rows = MODULES.filter(m => r.per[m.id]).map(m => ({ name: `${m.code} · ${m.name}`, v: r.per[m.id], mod: m.id }));
  } else if (reportState.metric === 'service') {
    const svcs = Object.keys(r.perSvc || {});
    rows = MODULES.flatMap(m => m.services.map(s => s[0]).filter(s => svcs.includes(s))
      .map(s => ({ name: s, sub: m.code, v: r.perSvc[s], mod: m.id })));
  } else {
    rows = Object.keys(DOMAINS).filter(d => r.perDomain[d]).map(d => ({ name: DOMAINS[d], v: r.perDomain[d], mod: null }));
  }
  $('#metricBars').innerHTML = rows.map(row => {
    const p = pctOf(row.v);
    const weak = p < WEAK_THRESHOLD;
    const tag = row.mod ? 'button' : 'div';
    return `<${tag} class="bar-row${row.mod ? ' clickable' : ''}${weak ? ' is-weak' : ''}"${row.mod ? ` data-mod-row="${row.mod}"` : ''}
        title="${esc(row.name)}: ${row.v.c} of ${row.v.n} correct (${p}%)">
      <span class="bar-name">${esc(row.name)}${row.sub ? ` <small>M${esc(row.sub)}</small>` : ''}</span>
      <span class="bar-track"><i class="${scoreClass(p)}" style="width:${p}%"></i><b class="thr" aria-hidden="true"></b></span>
      <span class="bar-val">${p}% · ${row.v.c}/${row.v.n}</span>
    </${tag}>`;
  }).join('');
}

function jumpToModule(modId) {
  const rem = document.getElementById(`rem-${modId}`);
  if (rem) {
    rem.open = true;
    rem.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  reportState.mod = modId;
  reportState.filter = 'all';
  $('#reviewMod').value = modId;
  renderReviewList();
  $('#reviewCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderRemedy(modId) {
  const r = report.result;
  const m = MOD[modId];
  const v = r.per[modId];
  const missed = report.order.filter(id => QMAP[id].mod === modId && !(report.unscored || []).includes(id) && !sameSet(report.answers[id] || [], QMAP[id].ans));
  const missedSvcs = [...new Set(missed.map(id => QMAP[id].svc))];
  return `
  <details class="remedy" id="rem-${modId}" open>
    <summary><span class="t-code">${esc(m.code)}</span> Remediation: Module ${esc(m.code)} · ${esc(m.name)}
      <span class="pill err">${pctOf(v)}% · ${v.c}/${v.n} correct</span></summary>
    <div class="remedy-body">
      <div class="remedy-block">
        <h4>Detailed explanations (${missed.length} missed)</h4>
        ${missed.map(renderMissed).join('')}
      </div>
      <div class="remedy-block">
        <h4>Memory aids and real-world use cases for the services you missed</h4>
        <div class="trick-list">${missedSvcs.map(trickHtml).join('')}</div>
      </div>
      <div class="remedy-grid">
        <div class="remedy-block">
          <h4>Core notes &amp; key architectural points</h4>
          <ul class="notes">${m.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>
        </div>

          <h4>References</h4>
          <ul class="refs">
            ${m.refs.map(([t, u]) => `<li><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(t)}</a><span>AWS documentation</span></li>`).join('')}
            ${GENERAL_REFS.map(([t, u, d]) => `<li><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(t)}</a><span>${esc(d)}</span></li>`).join('')}
          </ul>
        </div>
      </div>
      <div class="remedy-block">
        <h4>Target architecture${m.diagrams.length > 1 ? 's' : ''} (official AWS icons)</h4>
        ${m.diagrams.map((_, i) => diagramBlock(modId, i)).join('')}

    </div>

}

function renderMissed(id) {
  const q = QMAP[id];
  const order = report.optOrder[id];
  const sel = report.answers[id] || [];
  const qNum = report.order.indexOf(id) + 1;
  const correctItems = order.filter(o => q.ans.includes(o));
  const wrongItems = order.filter(o => !q.ans.includes(o));
  return `
    <div class="missed">
      <div class="q-meta">
        <strong>Question ${qNum}</strong>
        <span class="tag">${esc(q.svc)}</span>
        <span class="tag domain" title="${esc(DOMAINS[q.domain])}">${esc(DOMAIN_SHORT[q.domain])}</span>
        <span class="pill err">Your answer: ${sel.length ? optLetters(order, sel) : 'none'}</span>
        <span class="pill ok">Correct: ${optLetters(order, q.ans)}</span>
      </div>
      <p class="q-text" style="font-size:14.5px;margin-bottom:8px">${esc(q.q)}</p>
      <h5>Why the correct answer is architecturally superior</h5>
      <ul class="why-list">${correctItems.map(o => `<li class="right"><b>${letter(order.indexOf(o))}.</b> ${esc(q.opts[o][0])}<span class="why">${esc(q.opts[o][1])}</span></li>`).join('')}</ul>
      <p class="small" style="margin:8px 0 0;color:var(--soft-text)"><b>Architect's takeaway:</b> ${esc(q.exp)}</p>
      <h5>Why the distractors fail</h5>
      <ul class="why-list">${wrongItems.map(o => `<li class="bad${sel.includes(o) ? ' picked' : ''}"><b>${letter(order.indexOf(o))}.</b> ${esc(q.opts[o][0])}${sel.includes(o) ? ' <span class="pill err" style="margin-left:4px">your choice</span>' : ''}<span class="why">${esc(q.opts[o][1])}</span></li>`).join('')}</ul>
    </div>`;
}

function renderReviewList() {
  $$('#reviewFilters [data-filter]').forEach(b => b.classList.toggle('on', b.dataset.filter === reportState.filter));
  const items = report.order.map((id, i) => {
    const q = QMAP[id];
    const sel = report.answers[id] || [];
    return { id, i, q, sel, ok: sameSet(sel, q.ans), flagged: !!report.flags[id] };
  }).filter(it => (!reportState.mod || it.q.mod === reportState.mod) && ({
    all: true, incorrect: !it.ok, correct: it.ok, flagged: it.flagged, unanswered: !it.sel.length
  })[reportState.filter]);

  $('#reviewList').innerHTML = items.length ? items.map(it => `
    <div class="review-item ${it.ok ? 'ok' : 'bad'}">
      <div class="q-meta">
        <strong>Question ${it.i + 1}</strong>
        <span class="tag mod">${esc(MOD[it.q.mod].code)}</span>
        <span class="tag">${esc(it.q.svc)}</span>
        <span class="tag domain" title="${esc(DOMAINS[it.q.domain])}">${esc(DOMAIN_SHORT[it.q.domain])}</span>
        <span class="pill ${it.ok ? 'ok' : 'err'}">${it.ok ? 'Correct' : it.sel.length ? 'Incorrect' : 'Unanswered'}</span>
        ${it.flagged ? '<span class="pill warn">Flagged</span>' : ''}
        ${(report.unscored || []).includes(it.id) ? '<span class="pill idle">Unscored item</span>' : ''}
      </div>
      <p class="q-text" style="font-size:14.5px">${esc(it.q.q)}</p>
      <div class="options">${report.optOrder[it.id].map((orig, pos) => {
        const correct = it.q.ans.includes(orig), picked = it.sel.includes(orig);
        return `<div class="opt ${correct ? 'correct' : picked ? 'wrong' : ''}">
          <span class="mark ${correct ? 'c' : 'w'}">${correct ? '&#10003;' : picked ? '&#10007;' : ''}</span>
          <span class="letter">${letter(pos)}.</span>
          <span>${esc(it.q.opts[orig][0])}${picked ? ' <span class="muted">(your answer)</span>' : ''}<span class="why">${esc(it.q.opts[orig][1])}</span></span>
        </div>`;
      }).join('')}</div>
      <div class="explain"><b>Takeaway.</b> ${esc(it.q.exp)}</div>
      ${it.ok ? '' : trickHtml(it.q.svc)}
    </div>`).join('') : `<div class="empty">No questions match this filter.</div>`;
}

/* ======================================================================
   Full-length simulation: 65 questions, 50 scored in the official domain
   split plus 15 unscored items
   ====================================================================== */
function buildFullLength() {
  const scored = [];
  Object.entries(FULL_SCORED).forEach(([dom, n]) => {
    scored.push(...shuffle(QUESTIONS.filter(q => q.domain === dom).map(q => q.id)).slice(0, n));
  });
  const unscored = shuffle(QUESTIONS.map(q => q.id).filter(id => !scored.includes(id))).slice(0, FULL_UNSCORED);
  return { ids: shuffle(scored.concat(unscored)), unscored };
}

/* ======================================================================
   Score trajectory chart (SVG line chart, one series per practice set)
   ====================================================================== */
const TRAJ_SERIES = [1, 2, 3, 4, 5, 6].map(n => ({ key: `set${n}`, name: `Set ${n}`, match: h => h.setNo === n, color: `var(--s${n})` }))
  .concat([{ key: 'full', name: 'Full-length', match: h => h.kind === 'full', color: 'var(--s7)' }]);

function renderTrajectory() {
  const series = TRAJ_SERIES.map(s => ({ ...s, pts: attemptLog.filter(s.match) })).filter(s => s.pts.length);
  if (!series.length) return `<div class="empty">Complete a practice test to plot your score trajectory.</div>`;
  const W = 720, H = 260, L = 44, R = 16, T = 14, B = 34;
  const maxN = Math.max(2, ...series.map(s => s.pts.length));
  const x = i => L + (W - L - R) * (maxN === 1 ? 0.5 : i / (maxN - 1));
  const y = v => T + (H - T - B) * (1 - (v - 100) / 900);
  const grid = [100, 300, 500, 720, 1000].map(v => `
      <line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="${v === PASS_SCORE ? 'traj-pass' : 'traj-grid'}"/>
      <text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" class="traj-axis">${v}</text>`).join('');
  const xTicks = Array.from({ length: maxN }, (_, i) => `<text x="${x(i)}" y="${H - 12}" text-anchor="middle" class="traj-axis">#${i + 1}</text>`).join('');
  const lines = series.map(s => {
    const pts = s.pts.map((h, i) => [x(i), y(h.scaled), h]);
    return `<g class="traj-series" data-series="${s.key}">
      <polyline points="${pts.map(p => `${p[0]},${p[1]}`).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map(([px, py, h], i) => `<circle cx="${px}" cy="${py}" r="5" fill="${s.color}" class="traj-pt"
          data-tip="${esc(`${s.name} · attempt ${i + 1}: ${h.scaled} (${h.pass ? 'PASS' : 'FAIL'}) · ${MODES[h.mode] ? MODES[h.mode].short : 'Timed'} · ${fmtDate(h.when)}`)}"/>`).join('')}
    </g>`;
  }).join('');
  return `<div class="traj-wrap">
      <svg class="traj" viewBox="0 0 ${W} ${H}" role="img" aria-label="Scaled score by attempt for each practice set">
        ${grid}
        <text x="${L + 6}" y="${y(PASS_SCORE) - 6}" text-anchor="start" class="traj-axis">pass ${PASS_SCORE}</text>
        ${xTicks}${lines}
      </svg>
      <div class="traj-tip" id="trajTip" hidden></div>
    </div>
    <div class="traj-legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)} · last ${s.pts[s.pts.length - 1].scaled}</span>`).join('')}</div>`;
}
function bindTrajectory(root) {
  const wrap = $('.traj-wrap', root);
  if (!wrap) return;
  const tip = $('#trajTip', wrap);
  wrap.addEventListener('pointerover', e => {
    const pt = e.target.closest('.traj-pt');
    if (!pt) return;
    const wb = wrap.getBoundingClientRect(), pb = pt.getBoundingClientRect();
    tip.textContent = pt.dataset.tip;
    tip.hidden = false;
    tip.style.left = `${Math.min(pb.left - wb.left + 10, wb.width - 230)}px`;
    tip.style.top = `${pb.top - wb.top - 40}px`;
  });
  wrap.addEventListener('pointerout', e => { if (e.target.closest('.traj-pt')) tip.hidden = true; });
}

async function copyDiagram(key, btn) {
  const [modId, i] = key.split(':');

  try {
    await navigator.clipboard.writeText(text);
    btn.textContent = 'Copied';

    const range = document.createRange();
    range.selectNodeContents(btn.parentElement.querySelector('pre'));
    const s = getSelection(); s.removeAllRanges(); s.addRange(range);
    btn.textContent = 'Selected: press Ctrl+C';
  }
  setTimeout(() => { btn.textContent = 'Copy Mermaid config'; }, 2000);
}

function renderDrill(root, id) {
  const d = LINUX_DRILLS[id];

        ${p.log.map(termLine).join('')}
        ${p.done ? '' : `<form class="t-input" id="termForm" autocomplete="off"><span class="t-ps">${esc(PS1)}</span><input type="text" id="termIn" spellcheck="false" aria-label="Type a command" placeholder="type a command, or: hint, answer, clear"></form>`}
      </div>
      <div class="row" style="margin-top:10px">
        ${p.done ? '' : '<button class="sm" data-action="drill-hint">Hint</button><button class="sm" data-action="drill-answer">Show answer</button>'}
        <span class="muted small">Commands are checked against accepted solutions; "sudo" is optional. Output is simulated from a real incident.</span>
      </div>
    </div>`;
  const term = $('#term');
  term.scrollTop = term.scrollHeight;
  if (!p.done) {
    $('#termForm').onsubmit = e => { e.preventDefault(); runDrillCommand(id, $('#termIn').value); };
    $('#termIn').focus();
  }
}

function runDrillCommand(id, raw) {
  const d = LINUX_DRILLS[id];
  const p = drillProg(id);
  if (p.done) return;
  const step = d.steps[p.step];
  const cmd = normCmd(raw);
  if (!cmd) return;
  if (cmd === 'clear') { p.log = []; saveLinux(); return renderLinux(); }
  if (cmd === 'hint' || cmd === 'help') {
    p.log.push(['cmd', raw.trim()], ['info', `# hint: start with "${step.answer.split(' ').slice(0, 2).join(' ')} ..."`]);
    saveLinux(); return renderLinux();
  }
  if (cmd === 'answer' || cmd === 'solution') {
    p.log.push(['cmd', raw.trim()], ['info', `# one accepted answer: ${step.answer}`]);
    saveLinux(); return renderLinux();
  }
  const ok = step.accept.some(rx => new RegExp(rx).test(cmd));
  p.log.push(['cmd', raw.trim()]);
  if (ok) {
    if (step.output) p.log.push(['out', step.output]);
    p.log.push(['ok', `# ✓ ${step.explain}`]);
    p.step++;
    p.wrong = 0;
    if (p.step >= d.steps.length) {
      p.done = true;
      p.step = d.steps.length;
      p.completedAt = Date.now();
      log('ok', `Linux drill completed: ${d.title}.`);
    }
  } else {
    p.wrong++;
    p.log.push(['err', p.wrong >= 2
      ? `# ✗ Not the command this step needs. Try: ${step.answer.split(' ').slice(0, 2).join(' ')} ... (type "answer" to reveal)`
      : '# ✗ That command does not move this investigation forward. Re-read the step, or type "hint".']);
  }
  if (p.log.length > 200) p.log = p.log.slice(-200);
  saveLinux();
  renderLinux();
  renderSidebar();
}

const GENERIC_AWS = ['ec2', 'vpc', 'cloudwatch', 'cloudtrail', 'iam', 's3', 'rds', 'aurora', 'dynamodb', 'alb', 'nlb', 'elb', 'auto scaling', 'route 53', 'cloudfront', 'lambda', 'ssm', 'systems manager', 'session manager', 'patch manager', 'ebs', 'efs', 'kms', 'sns', 'sqs', 'eventbridge', 'guardduty', 'security group', 'nacl', 'flow logs', 'transit gateway', 'nat gateway', 'identity center', 'cloudformation', 'terraform', 'aws backup', 'snapshot', 'ami', 'target group', 'health check', 'multi-az'];
const ivState = Object.assign({ idx: 0, drafts: {}, results: {}, finishedAt: null }, store.get(KEY_INTERVIEW, {}));
const saveIv = () => store.set(KEY_INTERVIEW, ivState);

function hasTerm(text, term) {
  const t = term.toLowerCase();
  if (/[^a-z0-9 ]/.test(t) || t.includes(' ')) return text.includes(t);
  return new RegExp(`(^|[^a-z0-9_-])${t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}([^a-z0-9_]|$)`).test(text);
}

function evaluateAnswer(answer, q) {
  const text = ` ${answer.toLowerCase()} `;
  const words = (answer.match(/\S+/g) || []).length;
  const sig = INTERVIEW.signals;
  const star = {
    Situation: sig.situation.some(k => hasTerm(text, k)) || /situation\s*:/.test(text),
    Task: sig.task.some(k => hasTerm(text, k)) || /task\s*:/.test(text),
    Action: sig.action.some(k => hasTerm(text, k)) || /action\s*:/.test(text),
    Result: sig.result.some(k => hasTerm(text, k)) || /result\s*:/.test(text)
  };
  const linuxAll = [...new Set(GENERIC_LINUX.concat(q.linux).filter(k => hasTerm(text, k)))];
  const awsAll = [...new Set(GENERIC_AWS.concat(q.aws).filter(k => hasTerm(text, k)))];
  const senior = sig.senior.filter(k => text.includes(k));
  const metrics = (answer.match(/\b\d+(\.\d+)?\s*(%|percent|ms|s\b|sec|seconds|min|minutes|hours?|hrs|days?|weeks?|gb|gib|tb|x\b|servers|instances|engineers)/gi) || []).length;
  const iCount = (text.match(/\bi\b|\bi'm\b|\bi've\b|\bmy\b/g) || []).length;
  const weCount = (text.match(/\bwe\b|\bour\b/g) || []).length;
  const starScore = Object.values(star).filter(Boolean).length * 10;
  const linuxScore = Math.min(linuxAll.length, 4) * 4;
  const awsScore = Math.min(awsAll.length, 4) * 4;
  const seniorScore = Math.min(senior.length, 3) * 4;
  const metricScore = Math.min(metrics, 2) * 5;
  const lengthScore = words >= 120 ? 6 : words >= 60 ? 3 : 0;
  const score = starScore + linuxScore + awsScore + seniorScore + metricScore + lengthScore;
  const feedback = [];
  Object.entries(star).filter(([, v]) => !v).forEach(([k]) => feedback.push({
    Situation: 'Open with the Situation: the system, scale and what was at stake.',
    Task: 'State your Task: what you personally owned or were accountable for.',
    Action: 'Walk through your Actions step by step, in the order you performed them.',
    Result: 'Close with a measurable Result: what changed, by how much, and what you did to prevent recurrence.'
  }[k]));
  const missLinux = q.linux.filter(k => !hasTerm(text, k)).slice(0, 5);
  const missAws = q.aws.filter(k => !hasTerm(text, k)).slice(0, 5);
  if (linuxAll.length < 3 && q.linux.length) feedback.push(`Show Linux depth by naming exact commands you ran, for example: ${missLinux.join(', ')}.`);
  if (awsAll.length < 2 && q.aws.length) feedback.push(`Anchor the answer in AWS components, for example: ${missAws.join(', ')}.`);
  if (!metrics) feedback.push('Quantify the outcome: MTTR, error rate, latency, hours saved or number of servers.');
  if (senior.length < 2) feedback.push('Senior signals are thin: mention root cause, prevention, monitoring and alarms, rollback plans or runbooks.');
  if (weCount > iCount * 2 && weCount > 3) feedback.push('Too much "we": say "I" for the actions you personally took so the panel can assess you.');
  if (words < 80) feedback.push('Too brief for a senior panel: aim for about 150 to 300 words (2 to 3 minutes spoken).');
  if (words > 450) feedback.push('Tighten it: over 450 words risks losing the panel; keep the Action section focused on decisions.');
  const rating = score >= 75 ? { cls: 'ok', text: 'Sounds senior-level' } : score >= 50 ? { cls: 'warn', text: 'Mid-level: add depth' } : { cls: 'err', text: 'Needs work' };
  return { score, rating, star, linuxAll, awsAll, senior, metrics, words, feedback, at: Date.now() };
}

function renderInterviewSummary(root) {
  const Q = INTERVIEW.questions;
  const scored = Q.map((q, i) => ({ q, i, r: ivState.results[i] })).filter(x => x.r && !x.r.skipped);
  const avg = scored.length ? Math.round(scored.reduce((s, x) => s + x.r.score, 0) / scored.length) : 0;
  const verdict = avg >= 75 ? ['ok', 'Ready for a senior technical round'] : avg >= 50 ? ['warn', 'Solid mid-level: deepen commands, AWS specifics and metrics'] : ['err', 'Keep practicing: structure every answer with STAR'];
  root.innerHTML = `
    <div class="card section">
      <h2 style="margin-top:0">Interview summary</h2>
      <div class="row"><div class="iv-score"><b>${avg}</b><small>/100 avg</small></div><span class="pill ${verdict[0]}">${esc(verdict[1])}</span></div>
      <div class="table-wrap" style="margin-top:14px"><table>
        <thead><tr><th>#</th><th>Stage</th><th>Score</th><th>Rating</th></tr></thead>
        <tbody>${Q.map((q, i) => { const r = ivState.results[i]; return `<tr><td>${i + 1}</td><td>${esc(q.stage)}</td><td class="mono">${r && !r.skipped ? r.score : '--'}</td><td>${r ? (r.skipped ? 'Skipped' : esc(r.rating.text)) : 'Not answered'}</td></tr>`; }).join('')}</tbody>
      </table></div>
      <div class="row" style="margin-top:14px"><button class="primary" data-action="iv-restart">Start a new interview</button><button data-action="iv-review">Review answers</button></div>
    </div>`;
}

function interviewAction(action) {
  const Q = INTERVIEW.questions;
  const i = ivState.idx;
  if (action === 'iv-submit') {
    const text = ($('#ivAnswer') || {}).value || '';
    if ((text.match(/\S+/g) || []).length < 15) { log('warn', 'Interview: write at least a few sentences (15+ words) before submitting.'); return; }
    ivState.drafts[i] = text;
    ivState.results[i] = evaluateAnswer(text, Q[i]);
    log(ivState.results[i].score >= 75 ? 'ok' : 'info', `Interview Q${i + 1} evaluated: ${ivState.results[i].score}/100 (${ivState.results[i].rating.text}).`);
  } else if (action === 'iv-skip') {
    ivState.results[i] = { skipped: true, at: Date.now() };
  } else if (action === 'iv-next') {
    ivState.idx = Math.min(i + 1, Q.length);
    if (ivState.idx >= Q.length) ivState.finishedAt = Date.now();
  } else if (action === 'iv-retry') {
    delete ivState.results[i];
  } else if (action === 'iv-review') {
    ivState.idx = 0;
  } else if (action === 'iv-restart') {
    ivState.idx = 0; ivState.drafts = {}; ivState.results = {}; ivState.finishedAt = null;
    log('info', 'Interview restarted.');
  }
  saveIv();
  renderInterview();
  $('#workspace').scrollTop = 0;
}

  inflight: false,

  shellRendered: false
};
const apiUrl = path => (lab.base || '').trim().replace(/\/+$/, '') + path;

async function labFetch(path, options = {}) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 8000);
  try {
    return await fetch(apiUrl(path), { ...options, signal: ctrl.signal, cache: 'no-store' });
  } finally {
    clearTimeout(timer);
  }
}

function setConn(kind, text) {
  const el = $('#labConn');
  if (!el) return;
  el.className = `pill ${kind}`;
  el.textContent = text;
}

async function pollLab() {
  if (lab.inflight) return; // never stack requests during rapid refreshes
  lab.inflight = true;
  try {
    const res = await labFetch('/api/lab/status');
    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
    const data = await res.json();
    if (lab.online !== true) log('ok', `Connected to lab backend at ${apiUrl('') || location.origin}.`);
    lab.online = true;
    renderLabData(data);
  } catch (err) {
    const msg = err.name === 'AbortError' ? 'Request timed out after 8 s' : `${err.name}: ${err.message}`;
    if (lab.online !== false) log('error', `Lab backend unreachable: ${msg}`);
    lab.online = false;
    renderLabOffline(msg);
  } finally {
    lab.inflight = false;
  }
}

async function triggerRefresh() {
  const btn = $('#labRefresh');
  btn.disabled = true;
  try {
    const res = await labFetch('/api/lab/refresh', { method: 'POST' });
    const body = await res.json().catch(() => ({}));
    if (res.status === 202) log('info', 'Manual check cycle scheduled on the backend.');
    else if (res.status === 429) log('warn', body.message || 'Refresh rate limited by backend.');
    else throw new Error(`HTTP ${res.status} ${res.statusText}`);
    setTimeout(pollLab, 1200);
  } catch (err) {
    log('error', `Refresh request failed: ${err.name === 'AbortError' ? 'timed out' : err.message}`);
  } finally {
    setTimeout(() => { btn.disabled = false; }, 1500);
  }
}

/* ======================================================================
   Global events & timers
   ====================================================================== */
function tick() {
  updateCountdown();
  if (!examActive()) return;
  updateTimer();
  if (!isTimed()) return;
  const remaining = exam.endsAt - Date.now();
  if (remaining <= 600000 && !exam.warned.t10 && exam.minutes > 10 && remaining > 0) {
    exam.warned.t10 = true; saveExam();
    log('warn', '10 minutes remaining in the exam.');
  }
  if (remaining <= 60000 && !exam.warned.t1 && remaining > 0) {
    exam.warned.t1 = true; saveExam();
    log('warn', '1 minute remaining. At 0:00:00 inputs freeze and the exam submits automatically.');
  }
  if (remaining <= 0) expireExam();
}

function validateBank() {
  const problems = [];
  const ids = new Set();
  QUESTIONS.forEach(q => {
    if (ids.has(q.id)) problems.push(`duplicate id ${q.id}`);
    ids.add(q.id);
    if (!MOD[q.mod]) problems.push(`Q${q.id}: unknown module ${q.mod}`);
    if (!SVC_INFO[q.svc]) problems.push(`Q${q.id}: unknown service "${q.svc}"`);
    else if (SVC_INFO[q.svc].mod !== q.mod) problems.push(`Q${q.id}: service "${q.svc}" belongs to ${SVC_INFO[q.svc].mod}, not ${q.mod}`);
    if (!DOMAINS[q.domain]) problems.push(`Q${q.id}: unknown domain ${q.domain}`);
    if (!q.ans.length || q.ans.some(a => !q.opts[a])) problems.push(`Q${q.id}: invalid answer key`);
  });
  MODULES.forEach(m => {
    if (!m.lab) problems.push(`${m.id}: missing Hands-On Lab Blueprint`);
    if (!m.diagrams.length) problems.push(`${m.id}: missing architecture diagram`);
    m.services.forEach(([name]) => { if (!USE_CASES[name]) problems.push(`${m.id}: missing use case for ${name}`); });
    m.diagrams.forEach(d => Object.values(d.nodes).concat(Object.values(d.groups || {}).map(g => [GROUP_STYLE[g[0]] ? GROUP_STYLE[g[0]].icon || 'region' : 'x'])).forEach(n => { if (!AWS_ICON_PACK.icons[n[0]]) problems.push(`${m.id}: unknown AWS icon ${n[0]}`); }));
  });
  problems.forEach(p => log('error', `Content check: ${p}`));
  return problems.length === 0;
}

document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go) { showView(go.dataset.go); return; }
  const tab = e.target.closest('.tab');
  if (tab) { showView(tab.dataset.view); return; }
  const mod = e.target.closest('button.topic[data-mod]');
  if (mod) { openStudyModule(mod.dataset.mod); return; }
  const lmod = e.target.closest('button.topic[data-linux]');
  if (lmod) { linuxState.module = lmod.dataset.linux; linuxState.active = null; saveLinux(); toggleSidebar(false); showView('linux'); renderSidebar(); return; }
  const action = e.target.closest('[data-action]');
  if (!action) return;
  switch (action.dataset.action) {
    case 'start-set': startExam({ kind: 'set', setNo: Number(action.dataset.set) }); break;
    case 'start-drill': startExam({ kind: 'drill', mods: [$('#drillMod').value] }); break;
    case 'drill': startExam({ kind: 'drill', mods: [action.dataset.mod], mode: action.dataset.mode === 'review' ? 'review' : 'timed' }); break;
    case 'practice-weak': { const w = weakModulesOf(report); if (w.length) startExam({ kind: 'weak', mods: w }); break; }
    case 'retake':
      if (report) startExam({ kind: report.kind, setNo: report.setNo, mods: report.mods, mode: report.mode });
      break;
    case 'open-study': openStudyModule(action.dataset.mod); break;
    case 'start-full': startExam({ kind: 'full' }); break;
    case 'practice-domain': startExam({ kind: 'domain', mods: [action.dataset.dom] }); break;
    case 'blueprint': toggleBlueprint(true); break;
    case 'open-drill': linuxState.active = action.dataset.drill; if (drillProg(action.dataset.drill).done) { linuxState.drills[action.dataset.drill] = { step: 0, log: [], wrong: 0, done: false }; } saveLinux(); renderLinux(); $('#workspace').scrollTop = 0; break;
    case 'drill-exit': linuxState.active = null; saveLinux(); renderLinux(); renderSidebar(); break;
    case 'drill-reset': if (linuxState.active) { linuxState.drills[linuxState.active] = { step: 0, log: [], wrong: 0, done: false }; saveLinux(); renderLinux(); renderSidebar(); } break;
    case 'drill-hint': if (linuxState.active) runDrillCommand(linuxState.active, 'hint'); break;
    case 'drill-answer': if (linuxState.active) runDrillCommand(linuxState.active, 'answer'); break;
    case 'iv-submit': case 'iv-skip': case 'iv-next': case 'iv-retry': case 'iv-review': case 'iv-restart': interviewAction(action.dataset.action); break;
  }
});

document.addEventListener('keydown', e => {
  if (!$('#modal').hidden || currentView !== 'exam' || !examActive()) return;
  if (e.ctrlKey || e.metaKey || e.altKey || e.target.matches('input[type=text], input[type=url], input[type=search], select, textarea')) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); goTo(exam.current + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(exam.current - 1); }
  else if (e.key === 'f' || e.key === 'F') { setFlag(!exam.flags[exam.order[exam.current]]); }
  else if ((e.key === 'c' || e.key === 'C') && exam.mode === 'review') { checkAnswer(); }
  else if (/^[1-5]$/.test(e.key)) {
    const pos = Number(e.key) - 1;
    const opts = exam.optOrder[exam.order[exam.current]];
    if (pos < opts.length) selectOption(opts[pos]);
  }
});

window.addEventListener('storage', e => {
  if (e.key !== KEY_SESSION || !examActive() || !e.newValue) return;
  let other;
  try { other = JSON.parse(e.newValue); } catch { return; }
  // Ignore echoes of our own state (e.g. the previous page's pagehide save during a reload).
  const same = other.id === exam.id &&
    JSON.stringify(other.answers) === JSON.stringify(exam.answers) &&
    JSON.stringify(other.flags) === JSON.stringify(exam.flags) &&
    JSON.stringify(other.checked) === JSON.stringify(exam.checked);
  if (!same) log('warn', 'The exam session was changed in another tab; this tab keeps its own copy until reloaded.');
});

setInterval(tick, 1000);
setInterval(() => {
  if (currentView === 'lab' && !document.hidden && $('#labAuto') && $('#labAuto').checked) pollLab();
}, 5000);

/* ======================================================================
   Boot
   ====================================================================== */
applyTheme(theme);
applyBrand();
setLogCollapsed(!!store.get(KEY_LOG_COLLAPSED, false));
validateBank();
renderSidebar();
showView(examActive() ? 'exam' : 'dashboard');
log('info', `Portal ready: ${QUESTIONS.length} questions in ${SET_COUNT} practice sets + full-length simulation, ${MODULES.length} AWS modules (${Object.keys(SVC_INFO).length} services with memory aids and use cases, ${MODULES.reduce((n, m) => n + m.diagrams.length, 0)} AWS-icon diagrams, ${MODULES.length} labs), ${LINUX.length} Linux modules with ${Object.keys(LINUX_DRILLS).length} drills, ${INTERVIEW.questions.length}-question interview. Deadline ${EXAM_DEADLINE.toDateString()}.`);
if (examActive()) {
  const left = isTimed() ? `${fmtHMS(exam.endsAt - Date.now())} remaining` : `${fmtHMS(Date.now() - exam.startedAt)} elapsed`;
  log('ok', `Session restored from LocalStorage: ${exam.label}, ${MODES[exam.mode].name}, question ${exam.current + 1}, ${Object.keys(exam.answers).length} answered, ${Object.keys(exam.flags).length} flagged, ${left}.`);
}
tick();
runSystemTest(false);

// Offline mode: register the service worker when served over http(s).
// It needs HTTPS (or localhost); opening index.html as a file skips it.
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js')
    .then(reg => log('ok', `Offline mode ready (service worker scope ${reg.scope}). Install via "Add to Home screen".`))
    .catch(err => log('warn', `Offline mode unavailable: ${err.message}. Serve the portal over HTTPS to enable it.`));
}
