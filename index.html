:root {
  --bg: #0b0f17;

  --muted: #8d99b3;
  --faint: #5f6b85;
  --accent: #1a73e8;
  --accent-2: #3b8bf5;
  --accent-fg: #5aa5ff;
  --accent-ink: #ffffff;
  --accent-bg: rgba(59, 139, 245, .12);
  --blue: #4c9aff;
  --green: #2fbf71;
  --green-bg: rgba(47, 191, 113, .14);
  --red: #f06464;
  --red-bg: rgba(240, 100, 100, .14);
  --yellow: #ff8a4c;
  --yellow-bg: rgba(255, 138, 76, .14);
  --gray-bg: rgba(141, 153, 179, .14);
  --blue-bg: rgba(76, 154, 255, .14);
  --hero-grad: linear-gradient(135deg, #1b2438 0%, #141b2a 60%);
  --hero-glow: rgba(59, 139, 245, .22);
  --code-bg: #07090f;
  --code-text: #cbd3e3;
  --diagram-bg: #0a0e16;
  --soft-text: #c4ccdc;
  --notes-text: #d3daea;
  --errbox-text: #ffb3b3;
  --errbox-ok: #9fe3bd;
  --chip-weak-text: #ffc2c2;
  --chip-strong-text: #b7ecd0;
  --trick-bg: rgba(167, 139, 250, .12);
  --trick-border: #a78bfa;

  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9;

  --top-h: 58px;
  --side-w: 290px;
  --log-h: 170px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f3f5fa;
  --bg-2: #ffffff;
  --panel: #ffffff;
  --panel-2: #eef1f7;
  --panel-3: #e1e6ef;
  --border: #dbe1ec;
  --border-2: #c5cedf;
  --text: #182033;
  --muted: #56627c;
  --faint: #8792a8;
  --accent: #1a73e8;
  --accent-2: #1765cc;
  --accent-fg: #1558b0;
  --accent-ink: #ffffff;
  --accent-bg: rgba(26, 115, 232, .1);
  --blue: #1f63d6;
  --green: #17864f;
  --green-bg: rgba(23, 134, 79, .11);
  --red: #cc3535;
  --red-bg: rgba(204, 53, 53, .09);
  --yellow: #c2410c;
  --yellow-bg: rgba(194, 65, 12, .1);
  --gray-bg: rgba(86, 98, 124, .1);
  --blue-bg: rgba(31, 99, 214, .1);
  --hero-grad: linear-gradient(135deg, #e6f0ff 0%, #ffffff 65%);
  --hero-glow: rgba(26, 115, 232, .2);
  --code-bg: #f6f8fc;
  --code-text: #243047;
  --diagram-bg: #fbfcfe;
  --soft-text: #3b4761;
  --notes-text: #26324a;
  --errbox-text: #b42318;
  --errbox-ok: #137a45;
  --chip-weak-text: #a12a2a;
  --chip-strong-text: #146c40;
  --trick-bg: rgba(124, 92, 230, .09);
  --trick-border: #7c5ce6;
  --trick-text: #3d2b8a;
  --scrim: rgba(20, 30, 50, .4);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7;
  --shadow: 0 8px 30px rgba(30, 40, 70, .16);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 var(--sans);
  display: grid;
  grid-template-columns: var(--side-w) minmax(0, 1fr);
  grid-template-rows: var(--top-h) minmax(0, 1fr) auto;
  grid-template-areas: "top top" "side main" "log log";
  overflow: hidden;
  transition: background-color .2s, color .2s;
}
a { color: var(--blue); }
button, input, select { font: inherit; color: inherit; }
button {
  cursor: pointer;
  border: 1px solid var(--border-2);
  background: var(--panel-2);
  color: var(--text);
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  transition: background .15s, border-color .15s;
}
button:hover:not(:disabled) { background: var(--panel-3); border-color: var(--faint); }
button:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, .opt:focus-within, a:focus-visible, .mode-pick label:focus-within {
  outline: 2px solid var(--blue); outline-offset: 2px;
}
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
button.primary:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); }
button.danger { border-color: var(--red); color: var(--red); background: transparent; }
button.danger:hover:not(:disabled) { background: var(--red-bg); }
button.link { background: none; border: 0; padding: 0; color: var(--blue); text-decoration: underline; font-size: inherit; }
button.link:hover:not(:disabled) { background: none; color: var(--accent-fg); }
button.sm { padding: 5px 10px; font-size: 12.5px; }
input[type=text], input[type=url], input[type=search], select {
  background: var(--bg-2); border: 1px solid var(--border-2); border-radius: var(--radius-sm);
  padding: 8px 10px; min-width: 0;
}
h1, h2, h3, h4, h5 { margin: 0 0 .5em; line-height: 1.25; }
h2 { font-size: 20px; }
h3 { font-size: 16px; }
h4 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
h5 { font-size: 13px; color: var(--accent-fg); margin-top: 14px; }
p { margin: 0 0 .75em; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.mono { font-family: var(--mono); }
.spacer { flex: 1; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
.section { margin-bottom: 18px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.tag {
  display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600;
  background: var(--blue-bg); color: var(--blue); letter-spacing: .02em;
}
.tag.domain { background: var(--gray-bg); color: var(--muted); }
.tag.mod { background: var(--accent-bg); color: var(--accent-fg); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.up, .pill.ok { background: var(--green-bg); color: var(--green); }
.pill.down, .pill.err { background: var(--red-bg); color: var(--red); }
.pill.degraded, .pill.warn { background: var(--yellow-bg); color: var(--yellow); }
.pill.unconfigured, .pill.idle { background: var(--gray-bg); color: var(--muted); }
.pill.pending, .pill.unknown, .pill.info { background: var(--blue-bg); color: var(--blue); }
.logo-img { width: 32px; height: 32px; border-radius: 8px; object-fit: contain; display: block; flex: none; }

/* ---------- Seamless logo ----------
   1. keyLogoBackground() (JS) turns the image's flat backdrop (e.g. the white
      canvas of a JPEG) into real transparency with feathered edges and the
      backdrop colour un-mixed, so no white fringe or box remains.
   2. Theme tokens pick the blend mode + filter for the surface behind it:
      light -> multiply (any residual near-white pixel vanishes into the bar),
      dark  -> normal with a soft blue glow so the chrome reads on navy.
   3. If keying cannot run, .logo-raw hides a white box with CSS alone:
      multiply in light mode; in dark mode invert + hue-rotate turns the white
      to black and screen blends the black away. */
:root {
  --logo-blend: normal;
  --logo-filter: drop-shadow(0 0 5px rgba(59, 139, 245, .45)) drop-shadow(0 1px 1px rgba(0, 0, 0, .55)) saturate(1.12) brightness(1.08);
  --logo-raw-blend: screen;
  --logo-raw-filter: invert(1) hue-rotate(180deg) saturate(1.2) brightness(1.1);
}
:root[data-theme="light"] {
  --logo-blend: multiply;
  --logo-filter: saturate(1.1) contrast(1.06) drop-shadow(0 1px 1.5px rgba(24, 32, 51, .22));
  --logo-raw-blend: multiply;
  --logo-raw-filter: saturate(1.1) contrast(1.06);
}
.brand-logo {
  width: auto; height: 36px; max-width: 64px; border-radius: 0; object-fit: contain;
  background: transparent; mix-blend-mode: var(--logo-blend); filter: var(--logo-filter);
  transition: filter .25s ease, opacity .25s ease;
}
.brand-logo.logo-raw { mix-blend-mode: var(--logo-raw-blend); filter: var(--logo-raw-filter); }
.brand-logo.logo-pending { opacity: 0; }

/* ---------- Top navigation ---------- */
.topbar {
  grid-area: top; display: flex; align-items: center; gap: 14px; padding: 0 16px;
  background: var(--bg-2); border-bottom: 1px solid var(--border); min-width: 0;
}
.icon-btn { display: none; padding: 6px 10px; font-size: 18px; line-height: 1; }
.theme-btn { padding: 6px 10px; font-size: 16px; line-height: 1; flex: none; }
.brand { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.brand strong { display: block; font-size: 15px; }
.brand small { display: block; color: var(--muted); font-size: 11px; margin-top: -2px; }
.tabs { display: flex; gap: 4px; margin-left: 12px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.tab { background: transparent; border-color: transparent; color: var(--muted); padding: 8px 14px; white-space: nowrap; }
.tab.active { color: var(--text); background: var(--panel-2); border-color: var(--border-2); }
.tab .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-left: 6px; vertical-align: middle; }
.lbl-short, .cd-short { display: none; }
.nav-countdown {
  margin-left: auto; display: flex; flex-direction: column; align-items: flex-end;
  padding: 4px 12px; border: 1px solid var(--border-2); border-radius: var(--radius-sm); background: var(--panel);
  white-space: nowrap;
}
.nav-countdown .label { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.nav-countdown .mono { color: var(--accent-fg); font-weight: 700; font-size: 14px; }

/* ---------- Sidebar ---------- */
.sidebar {
  grid-area: side; background: var(--bg-2); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; min-height: 0; overflow: hidden;
}
.side-head { padding: 16px 16px 8px; }
.side-head h4 { margin: 0; }
.side-head p { margin: 4px 0 0; font-size: 11.5px; color: var(--faint); }
.topic-list { list-style: none; margin: 0; padding: 4px 10px 10px; overflow-y: auto; flex: 1; }
.topic {
  width: 100%; text-align: left; display: grid; grid-template-columns: 46px 1fr auto; grid-template-rows: auto 4px;
  column-gap: 10px; row-gap: 6px; align-items: center; padding: 9px 10px; margin-bottom: 4px;
  background: transparent; border-color: transparent;
}
.topic:hover:not(:disabled) { background: var(--panel); border-color: var(--border); }
.topic.current { background: var(--panel); border-color: var(--border-2); }
.t-code {
  grid-row: 1 / span 2; font-family: var(--mono); font-size: 11px; font-weight: 700; text-align: center;
  padding: 7px 0; border-radius: 6px; background: var(--panel-2); color: var(--accent-fg); border: 1px solid var(--border-2);
}
.t-name { font-size: 13px; font-weight: 600; line-height: 1.2; }
.t-name small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; margin-top: 2px; }
.t-pct { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.t-bar { grid-column: 2 / span 2; height: 4px; background: var(--panel-3); border-radius: 2px; overflow: hidden; }
.t-bar i { display: block; height: 100%; width: 0; background: var(--faint); transition: width .4s; }
.good { background: var(--green) !important; }
.mid { background: var(--yellow) !important; }
.low { background: var(--red) !important; }
.side-foot { padding: 12px 16px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
.side-foot .row { margin-top: 8px; gap: 8px; }
.scrim { display: none; }

/* ---------- Workspace ---------- */
.workspace { grid-area: main; overflow-y: auto; padding: 22px; min-width: 0; }
.view { display: none; max-width: 1280px; margin: 0 auto; }
.view.active { display: block; animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* System test banner */
.systest { max-width: 1280px; margin: 0 auto 18px; border: 1px solid var(--blue); border-left-width: 4px; background: var(--panel); border-radius: var(--radius); padding: 14px 18px; }
.systest[hidden] { display: none; }
.systest.has-warn { border-color: var(--yellow); }
.systest.has-err { border-color: var(--red); }
.systest-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.systest-head h3 { margin: 0; }
.checks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 12px 0; }
.check { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; min-width: 0; }
.check .row { gap: 8px; }
.check b { font-size: 13px; }
.check p { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); word-break: break-word; }

/* Dashboard */
.hero { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; margin-bottom: 18px; }
.hero-main { background: var(--hero-grad); position: relative; overflow: hidden; }
.hero-main::after {
  content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%;
  background: radial-gradient(circle, var(--hero-glow), transparent 70%); pointer-events: none;
}
.hero-head { display: flex; gap: 14px; align-items: center; margin-bottom: 6px; }
.hero-head .logo-img { width: auto; height: 52px; max-width: 88px; border-radius: 0; }
.cd-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 16px 0 12px; }
.cd-tile { background: var(--bg-2); border: 1px solid var(--border-2); border-radius: var(--radius-sm); padding: 12px 6px; text-align: center; }
.cd-tile b { display: block; font-family: var(--mono); font-size: 30px; color: var(--accent-fg); line-height: 1.1; }
.cd-tile span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; }
.stat b { display: block; font-size: 22px; font-family: var(--mono); }
.stat span { font-size: 12px; color: var(--muted); }
.dash-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { background: var(--panel-2); color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
tr:last-child td { border-bottom: 0; }
.weak-list { list-style: none; padding: 0; margin: 0; }
.weak-list li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--border); }
.weak-list li:last-child { border-bottom: 0; }
.empty { color: var(--muted); padding: 14px; text-align: center; border: 1px dashed var(--border-2); border-radius: var(--radius-sm); }

/* Practice-set score history graph */
.set-graph { display: grid; gap: 10px; margin-top: 10px; }
.set-row { display: grid; grid-template-columns: 215px minmax(0, 1fr) 150px; gap: 14px; align-items: center; }
.set-name b { display: block; font-size: 13px; }
.set-name small { color: var(--muted); font-size: 11.5px; }
.set-track { position: relative; height: 18px; background: var(--panel-3); border-radius: 9px; }
.set-track > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 9px; transition: width .6s ease; }
.set-track .pass-line { position: absolute; top: -5px; bottom: -5px; left: 72%; border-left: 2px dashed var(--text); opacity: .6; }
.set-track .last { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--bg-2); border: 3px solid var(--text); }
.set-val { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: right; }
.set-val b { color: var(--text); font-size: 14px; }
.set-hist { grid-column: 2 / 3; display: flex; gap: 4px; flex-wrap: wrap; margin-top: -4px; }
.set-hist span { font: 10.5px/1 var(--mono); padding: 3px 5px; border-radius: 4px; border: 1px solid var(--border-2); color: var(--muted); }
.set-hist span.p { border-color: var(--green); color: var(--green); }
.set-hist span.f { border-color: var(--red); color: var(--red); }
.graph-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 12px; }
.graph-legend span { display: inline-flex; align-items: center; gap: 6px; }
.graph-legend i { display: inline-block; width: 14px; height: 8px; border-radius: 4px; }

/* Exam lobby */
.mode-pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: 16px 0 6px; }
.mode-pick label {
  display: grid; grid-template-columns: 20px 1fr; gap: 10px; cursor: pointer; padding: 14px 16px;
  background: var(--bg-2); border: 2px solid var(--border-2); border-radius: var(--radius);
}
.mode-pick label.on { border-color: var(--accent); background: var(--accent-bg); }
.mode-pick input { accent-color: var(--accent); width: 16px; height: 16px; margin-top: 3px; }
.mode-pick b { display: block; font-size: 15px; }
.mode-pick ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
.set-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; margin: 14px 0 18px; }
.set-card { background: var(--bg-2); border: 1px solid var(--border-2); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.set-card h3 { margin: 0; font-size: 15px; }
.set-card .meta { font-size: 12.5px; color: var(--muted); }
.set-card .row { margin-top: auto; }
.lobby-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin: 18px 0; }
.mode-card { background: var(--bg-2); border: 1px solid var(--border-2); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.mode-card.weak { border-color: var(--red); }
.mode-card ul { margin: 0; padding-left: 18px; color: var(--muted); }
.mode-card .row { margin-top: auto; }
.kbd { font-family: var(--mono); font-size: 12px; padding: 1px 6px; border: 1px solid var(--border-2); border-bottom-width: 2px; border-radius: 4px; background: var(--bg-2); }
.notice { border-left: 3px solid var(--accent); background: var(--panel-2); padding: 10px 14px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }

/* Exam interface */
.exam { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 18px; align-items: start; }
.exam-main { padding: 0; overflow: hidden; position: relative; }
.exam-bar {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 12px 18px;
  background: var(--panel-2); border-bottom: 1px solid var(--border);
}
.mode-badge { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; }
.mode-badge.timed { background: var(--red-bg); color: var(--red); }
.mode-badge.review { background: var(--green-bg); color: var(--green); }
.flag-toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; padding: 6px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border-2); }
.flag-toggle.on { border-color: var(--accent); color: var(--accent-fg); background: var(--accent-bg); }
.flag-toggle input { accent-color: var(--accent); width: 16px; height: 16px; }
.timer { margin-left: auto; font-family: var(--mono); font-size: 18px; font-weight: 700; padding: 4px 12px; border-radius: var(--radius-sm); background: var(--bg-2); border: 1px solid var(--border-2); }
.timer small { font-family: var(--sans); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-right: 6px; }
.timer.warn { color: var(--yellow); border-color: var(--yellow); }
.timer.crit { color: var(--red); border-color: var(--red); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .55; } }
.q-body { padding: 20px 22px 8px; }
.q-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.q-text { font-size: 15.5px; line-height: 1.65; margin-bottom: 18px; }
.options { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 22px 28px 1fr; align-items: start; gap: 8px; padding: 12px 14px;
  border: 1px solid var(--border-2); border-radius: var(--radius-sm); background: var(--bg-2); cursor: pointer;
  transition: border-color .12s, background .12s;
}
.opt:hover { border-color: var(--faint); }
.opt input { margin: 3px 0 0; width: 16px; height: 16px; accent-color: var(--accent); }
.opt .letter { font-family: var(--mono); font-weight: 700; color: var(--muted); }
.opt.selected { border-color: var(--accent); background: var(--accent-bg); }
.opt.selected .letter { color: var(--accent-fg); }
.opt.locked { cursor: default; }
.opt.correct { border-color: var(--green); background: var(--green-bg); }
.opt.wrong { border-color: var(--red); background: var(--red-bg); }
.opt .why { display: block; color: var(--soft-text); font-size: 12.5px; margin-top: 4px; }
.check-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
.feedback { margin-top: 14px; border-radius: var(--radius-sm); padding: 12px 14px; border: 1px solid var(--border-2); background: var(--panel-2); }
.feedback.ok { border-color: var(--green); }
.feedback.bad { border-color: var(--red); }
.feedback .verdict-line { font-weight: 700; margin-bottom: 6px; }
.feedback.ok .verdict-line { color: var(--green); }
.feedback.bad .verdict-line { color: var(--red); }
.trick { margin-top: 10px; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--trick-bg); border-left: 3px solid var(--trick-border); color: var(--trick-text); font-size: 13px; }
.trick b { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 3px; }
.exam-nav { display: flex; gap: 10px; flex-wrap: wrap; padding: 16px 22px 20px; border-top: 1px solid var(--border); margin-top: 18px; }
.frozen-banner { display: none; padding: 10px 18px; background: var(--red-bg); color: var(--red); font-weight: 700; border-bottom: 1px solid var(--red); }
.exam.frozen .frozen-banner { display: block; }
.exam.frozen .q-body, .exam.frozen .exam-nav, .exam.frozen .palette { opacity: .55; pointer-events: none; }
.palette { position: sticky; top: 0; }
.pal-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0 12px; text-align: center; }
.pal-stats div { background: var(--bg-2); border-radius: var(--radius-sm); padding: 6px 2px; font-size: 11px; color: var(--muted); }
.pal-stats b { display: block; font-size: 16px; color: var(--text); font-family: var(--mono); }
.pal-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.pal-cell {
  position: relative; padding: 8px 0; font-family: var(--mono); font-size: 13px; font-weight: 600; text-align: center;
  background: var(--bg-2); border: 1px solid var(--border-2); color: var(--muted);
}
.pal-cell.answered { background: var(--blue-bg); border-color: var(--blue); color: var(--text); }
.pal-cell.chk-ok { background: var(--green-bg); border-color: var(--green); color: var(--text); }
.pal-cell.chk-bad { background: var(--red-bg); border-color: var(--red); color: var(--text); }
.pal-cell.flagged::after {
  content: ""; position: absolute; top: 0; right: 0; border-style: solid; border-width: 0 12px 12px 0;
  border-color: transparent var(--accent) transparent transparent; border-top-right-radius: 5px;
}
.pal-cell.current { outline: 2px solid var(--text); outline-offset: 1px; color: var(--text); }
.legend { display: grid; gap: 6px; margin: 14px 0; font-size: 12px; color: var(--muted); }
.legend span { display: flex; align-items: center; gap: 8px; }
.legend i { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--border-2); background: var(--bg-2); position: relative; flex: none; }
.legend i.answered { background: var(--blue-bg); border-color: var(--blue); }
.legend i.chk-ok { background: var(--green-bg); border-color: var(--green); }
.legend i.chk-bad { background: var(--red-bg); border-color: var(--red); }
.legend i.flagged::after { content: ""; position: absolute; top: 0; right: 0; border-style: solid; border-width: 0 8px 8px 0; border-color: transparent var(--accent) transparent transparent; }
.legend i.current { outline: 2px solid var(--text); outline-offset: 1px; }
.palette button.full { width: 100%; margin-top: 6px; }
.save-note { font-size: 11px; color: var(--faint); margin-top: 10px; }

/* Study guide */
.study-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.study-tools input[type=search] { flex: 1 1 260px; }
.mod-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.mod-chips button { padding: 4px 10px; font-size: 12px; font-family: var(--mono); }
details.module { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; }
details.module[open] { border-color: var(--border-2); }
details.module > summary {
  list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 18px; font-weight: 700; font-size: 15px;
}
details.module > summary::-webkit-details-marker { display: none; }
details.module > summary::after { content: "\25BE"; margin-left: auto; color: var(--muted); transition: transform .2s; }
details.module:not([open]) > summary::after { transform: rotate(-90deg); }
details.module > summary .t-code { grid-row: auto; padding: 5px 8px; }
.module-body { padding: 0 18px 18px; display: grid; gap: 16px; }
.svc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.svc-card { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.svc-card h4 { margin: 0; text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--text); }
.svc-card p { margin: 0; font-size: 13px; color: var(--soft-text); }
.svc-card .trick { margin-top: 2px; }
.svc-card .qcount { font-size: 11px; color: var(--faint); }
mark { background: var(--blue-bg); color: inherit; padding: 0 1px; border-radius: 2px; }

/* Performance report */
.result-head { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 22px; align-items: center; }
.gauge { position: relative; width: 190px; height: 190px; }
.gauge svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.gauge .g-center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.gauge b { display: block; font-size: 38px; font-family: var(--mono); line-height: 1; }
.gauge small { color: var(--muted); }
.verdict { font-size: 22px; font-weight: 800; letter-spacing: .04em; }
.verdict.pass { color: var(--green); }
.verdict.fail { color: var(--red); }
.seg { display: inline-flex; border: 1px solid var(--border-2); border-radius: var(--radius-sm); overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; border-radius: 0; background: transparent; color: var(--muted); padding: 6px 12px; font-size: 13px; }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.bars { display: grid; gap: 6px; margin-top: 12px; }
.bar-row {
  display: grid; grid-template-columns: minmax(120px, 280px) minmax(0, 1fr) 96px; gap: 12px; align-items: center;
  font-size: 13px; text-align: left; background: transparent; border: 1px solid transparent; padding: 7px 10px;
}
.bar-row.clickable:hover { background: var(--panel-2); border-color: var(--border-2); }
.bar-row:not(.clickable) { cursor: default; }
.bar-row.is-weak .bar-name::after { content: " \25CF weak"; color: var(--red); font-size: 11px; font-weight: 700; }
.bar-name small { color: var(--faint); font-size: 11px; }
.bar-track { position: relative; height: 12px; background: var(--panel-3); border-radius: 6px; overflow: visible; }
.bar-track i { display: block; height: 100%; border-radius: 6px; transition: width .5s ease; }
.bar-track .thr { position: absolute; top: -4px; bottom: -4px; left: 72%; border-left: 2px dashed var(--text); opacity: .55; }
.bar-val { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: right; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; gap: 6px; align-items: center; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border-2); background: var(--bg-2); font-size: 13px; text-decoration: none; color: var(--text); }
.chip.weak { border-color: var(--red); color: var(--chip-weak-text); }
.chip.strong { border-color: var(--green); color: var(--chip-strong-text); }
details.remedy { background: var(--panel); border: 1px solid var(--red); border-left-width: 4px; border-radius: var(--radius); margin-bottom: 18px; }
details.remedy > summary {
  list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 18px;
  font-weight: 700; font-size: 15px;
}
details.remedy > summary::-webkit-details-marker { display: none; }
details.remedy > summary::after { content: "\25BE"; margin-left: auto; color: var(--muted); transition: transform .2s; }
details.remedy:not([open]) > summary::after { transform: rotate(-90deg); }
details.remedy > summary .t-code { grid-row: auto; padding: 5px 8px; }
.remedy-body { padding: 0 18px 18px; display: grid; gap: 16px; }
.remedy-block { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; min-width: 0; }
.remedy-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
.missed { border-top: 1px dashed var(--border-2); padding-top: 14px; margin-top: 14px; }
.missed:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
.why-list { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 8px; }
.why-list li { padding: 10px 12px; border-radius: var(--radius-sm); background: var(--panel); border: 1px solid var(--border); }
.why-list li.right { background: var(--green-bg); border-color: var(--green); }
.why-list li.bad { border-left: 3px solid var(--red); }
.why-list li.picked { border-color: var(--red); background: var(--red-bg); }
.why-list .why { display: block; color: var(--soft-text); font-size: 13px; margin-top: 4px; }
.notes { margin: 0; padding-left: 18px; display: grid; gap: 7px; font-size: 13.5px; color: var(--notes-text); }
.refs { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 13px; }
.refs li span { display: block; color: var(--faint); font-size: 11px; }
.trick-list { display: grid; gap: 10px; }
.trick-list .trick { margin: 0; }
.diagram { background: var(--diagram-bg); border: 1px solid var(--border-2); border-radius: var(--radius-sm); padding: 14px; overflow-x: auto; min-height: 120px; }
.diagram svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
.diagram .loading { color: var(--muted); font-size: 13px; }
.diagram + .diagram-title { margin-top: 14px; }
details.src { margin-top: 10px; }
details.src summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
.filters button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.review-item { border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; background: var(--bg-2); }
.review-item.ok { border-left: 4px solid var(--green); }
.review-item.bad { border-left: 4px solid var(--red); }
.review-item .opt { cursor: default; }
.review-item .opt .why { color: var(--muted); }
.mark { font-weight: 800; }
.mark.c { color: var(--green); }
.mark.w { color: var(--red); }
.explain { margin-top: 12px; padding: 12px 14px; border-radius: var(--radius-sm); background: var(--panel-2); color: var(--soft-text); font-size: 13.5px; }

/* Lab */
.lab-controls { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 18px; }
.lab-controls label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.lab-controls input[type=url] { width: 280px; max-width: 100%; }
.switch { flex-direction: row !important; align-items: center; gap: 8px !important; font-size: 13px !important; color: var(--text) !important; padding-bottom: 8px; }
.switch input { accent-color: var(--accent); width: 16px; height: 16px; }
.matrix td.detail { white-space: normal; min-width: 240px; color: var(--muted); }
.errbox {
  margin: 0; min-height: 110px; max-height: 260px; overflow: auto; padding: 12px 14px;
  background: var(--code-bg); border: 1px solid var(--border-2); border-radius: var(--radius-sm);
  font: 12.5px/1.6 var(--mono); color: var(--errbox-text); white-space: pre-wrap; word-break: break-word;
}
.errbox.clean { color: var(--errbox-ok); }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-top: 18px; }
dl.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 12px; margin: 0; font-size: 13px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; font-family: var(--mono); word-break: break-all; }
.diag { margin-top: 10px; font: 12px/1.5 var(--mono); color: var(--yellow); background: var(--yellow-bg); padding: 8px 10px; border-radius: var(--radius-sm); word-break: break-word; }
details.card summary { cursor: pointer; font-weight: 600; }
pre.code { margin: 12px 0 0; padding: 12px 14px; overflow-x: auto; background: var(--code-bg); border: 1px solid var(--border-2); border-radius: var(--radius-sm); font: 12.5px/1.6 var(--mono); color: var(--code-text); }

/* ---------- Bottom status log ---------- */
.logpanel { grid-area: log; background: var(--bg-2); border-top: 1px solid var(--border); display: flex; flex-direction: column; height: var(--log-h); transition: height .2s; }
.logpanel.collapsed { height: 38px; }
.log-head { display: flex; align-items: center; gap: 10px; padding: 5px 14px; border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); min-height: 37px; }
.log-head button { padding: 3px 10px; font-size: 12px; text-transform: none; letter-spacing: 0; }
.log-body { flex: 1; overflow-y: auto; padding: 6px 14px; font: 12px/1.65 var(--mono); }
.log-line { display: grid; grid-template-columns: 70px 50px minmax(0, 1fr); gap: 8px; }
.log-ts { color: var(--faint); }
.log-lvl { font-weight: 700; }
.lvl-info .log-lvl { color: var(--blue); }
.lvl-ok .log-lvl { color: var(--green); }
.lvl-warn .log-lvl { color: var(--yellow); }
.lvl-error .log-lvl { color: var(--red); }
.log-msg { word-break: break-word; }

/* ---------- Modal ---------- */
.modal { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal[hidden] { display: none; }
.modal-box { width: min(500px, 100%); background: var(--panel); border: 1px solid var(--border-2); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
.warn-text { color: var(--yellow); }

/* ---------- Responsive ---------- */
@media (max-width: 1100px) {
  .hero, .dash-grid, .remedy-grid { grid-template-columns: minmax(0, 1fr); }
  .grid-3, .checks { grid-template-columns: minmax(0, 1fr); }
  .exam { grid-template-columns: minmax(0, 1fr); }
  .palette { position: static; }
  .pal-grid { grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); }
}
@media (max-width: 900px) {
  body { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "main" "log"; }
  .icon-btn { display: inline-block; }
  .sidebar {
    position: fixed; top: var(--top-h); bottom: 0; left: 0; width: min(310px, 86vw); z-index: 40;
    transform: translateX(-100%); transition: transform .2s ease; box-shadow: var(--shadow);
  }
  body.side-open .sidebar { transform: none; }
  body.side-open .scrim { display: block; position: fixed; inset: var(--top-h) 0 0 0; background: var(--scrim); z-index: 39; }
  .result-head { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; }
  .result-head .row, .result-head .stats { justify-content: center; }
  .bar-row { grid-template-columns: 130px minmax(0, 1fr) 80px; gap: 8px; padding: 7px 4px; }
  .brand div { display: none; }
  .mode-pick { grid-template-columns: minmax(0, 1fr); }
  .set-row { grid-template-columns: 120px minmax(0, 1fr) 110px; gap: 10px; }
}
@media (max-width: 640px) {
  :root { --log-h: 140px; --top-h: 54px; }
  .workspace { padding: 14px 16px; }
  .topbar { gap: 6px; padding: 0 8px; }
  .brand div { display: none; }
  .brand-logo { height: 28px; max-width: 44px; }
  .icon-btn, .theme-btn { padding: 5px 7px; font-size: 15px; }
  .tabs { margin-left: 0; gap: 1px; }
  .tab { padding: 6px 7px; font-size: 12px; }
  .tab .dot { margin-left: 3px; }
  .lbl-long, .cd-long { display: none; }
  .lbl-short, .cd-short { display: inline; }
  .nav-countdown { padding: 3px 6px; }
  .nav-countdown .label { display: none; }
  .nav-countdown .mono { font-size: 11.5px; }
  .cd-tile b { font-size: 22px; }
  .q-body { padding: 16px; }
  .exam-bar { padding: 10px 16px; gap: 10px; }
  .exam-nav { padding: 14px 16px 16px; }
  .exam-nav button { flex: 1 1 40%; }
  .exam-nav .spacer { display: none; }
  .log-line { grid-template-columns: 62px minmax(0, 1fr); }
  .log-lvl { display: none; }
  .log-head { gap: 6px; padding: 5px 10px; }
  .log-head .lh-title { display: none; }
  .lab-controls input[type=url] { width: 100%; }
  .lab-controls label:first-child { width: 100%; }
  .bar-row { grid-template-columns: minmax(0, 1fr) 76px; }
  .bar-row .bar-track { grid-column: 1 / -1; grid-row: 2; }
  .set-row { grid-template-columns: minmax(0, 1fr) auto; }
  .set-row .set-track { grid-column: 1 / -1; grid-row: 2; }
  .set-hist { grid-column: 1 / -1; }
  .remedy-body, .module-body { padding: 0 12px 12px; }
  details.remedy > summary, details.module > summary { padding: 12px; }
  .svc-grid { grid-template-columns: minmax(0, 1fr); }
}

/* ---------- v4: curriculum extras, diagrams, labs, Linux zone, interview, blueprint ---------- */
.side-sep { list-style: none; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 14px 10px 6px; border-top: 1px solid var(--border); margin-top: 6px; }
.usecase { margin-top: 6px; padding: 8px 12px; border-radius: var(--radius-sm); background: var(--blue-bg); border-left: 3px solid var(--blue); font-size: 13px; color: var(--text); }
.usecase b { display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 3px; color: var(--blue); }
.diagram { background: #ffffff !important; border-color: #d5dbdb !important; padding: 10px !important; }
.arch-svg { display: block; width: 100%; min-width: 640px; height: auto; }
.arch-fig { margin: 0 0 18px; }
.arch-fig figcaption { margin-bottom: 6px; }
details.lab-card { border: 1px solid var(--accent); border-left-width: 4px; border-radius: var(--radius); background: var(--panel); }
details.lab-card > summary { cursor: pointer; padding: 12px 16px; font-weight: 700; list-style: none; }
details.lab-card > summary::-webkit-details-marker { display: none; }
.lab-badge { display: inline-block; background: var(--accent); color: var(--accent-ink); font-size: 11px; padding: 2px 8px; border-radius: 4px; margin-right: 8px; text-transform: uppercase; letter-spacing: .04em; }
.lab-body { padding: 0 16px 16px; }
.lab-steps { padding-left: 22px; display: grid; gap: 14px; margin: 6px 0 0; }
.lab-steps p { margin: 4px 0 0; color: var(--soft-text); font-size: 13.5px; }
.lab-steps pre.code { margin-top: 8px; }
.terminal { background: #0b0f14; color: #d7e2f0; font: 13px/1.6 var(--mono); border-radius: var(--radius-sm); padding: 12px 14px; min-height: 240px; max-height: 460px; overflow: auto; border: 1px solid var(--border-2); }
.t-line { white-space: pre-wrap; word-break: break-word; }
.t-ps { color: #7ee787; white-space: nowrap; }
.t-out { color: #c9d1d9; }
.t-ok { color: #7ee787; }
.t-err { color: #ff7b72; }
.t-info { color: #79c0ff; }
.t-input { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
.t-input input { flex: 1; min-width: 0; background: transparent; border: 0; color: #ffffff; font: inherit; outline: none; padding: 2px 0; }
.drill-prompt { font-size: 15px; font-weight: 600; }
.drill-dots, .iv-progress { display: flex; gap: 4px; flex-wrap: wrap; }
.drill-dots i, .iv-progress i { width: 26px; height: 6px; border-radius: 3px; background: var(--panel-3); }
.iv-progress { margin-top: 12px; }
.drill-dots i.ok, .iv-progress i.ok { background: var(--green); }
.drill-dots i.cur, .iv-progress i.cur { background: var(--accent); }
.cmd-list { display: grid; gap: 10px; }
.cmd-row { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 12px; align-items: center; }
.cmd-row pre.code { margin: 0; white-space: pre-wrap; word-break: break-word; }
.cmd-row p { margin: 0; font-size: 13px; color: var(--soft-text); }
.iv-bubble { margin: 12px 0; padding: 14px 16px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--border-2); font-size: 15px; line-height: 1.6; }
.iv-answer { width: 100%; background: var(--bg-2); border: 1px solid var(--border-2); border-radius: var(--radius-sm); padding: 10px 12px; font: 14px/1.6 var(--sans); color: var(--text); resize: vertical; margin-top: 4px; }
.iv-result { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 14px; }
.iv-score { display: inline-flex; align-items: baseline; gap: 4px; padding: 8px 14px; border-radius: var(--radius); background: var(--bg-2); border: 1px solid var(--border-2); }
.iv-score b { font: 700 28px var(--mono); }
.iv-score small { color: var(--muted); }
pre.iv-model { white-space: pre-wrap; word-break: break-word; font-family: var(--sans); font-size: 13.5px; line-height: 1.6; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(470px, 100vw); background: var(--panel); border-left: 1px solid var(--border-2); box-shadow: var(--shadow); z-index: 60; display: flex; flex-direction: column; }
.drawer-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.drawer-body { overflow: auto; padding: 16px 18px 24px; }
.drawer-scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 59; }
dl.kv.bp-kv dd { font-family: var(--sans); word-break: normal; }
.bp-domains { display: grid; gap: 10px; }
.bp-domain { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; background: var(--bg-2); }
.bp-domain ul { margin: 0 0 6px; padding-left: 18px; font-size: 13px; color: var(--soft-text); }
.traj-wrap { position: relative; }
.traj { width: 100%; height: auto; display: block; }
.traj-grid { stroke: var(--border); stroke-width: 1; }
.traj-pass { stroke: var(--text); stroke-width: 1.2; stroke-dasharray: 5 4; opacity: .6; }
.traj-axis { fill: var(--muted); font: 11px var(--sans); }
.traj-pt { stroke: var(--panel); stroke-width: 2; cursor: pointer; }
.traj-pt:hover { stroke: var(--text); }
.traj-tip { position: absolute; background: var(--panel-2); border: 1px solid var(--border-2); color: var(--text); font-size: 12px; padding: 6px 8px; border-radius: 6px; pointer-events: none; max-width: 230px; box-shadow: var(--shadow); z-index: 2; }
.traj-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--text); margin-top: 8px; }
.traj-legend i { display: inline-block; width: 16px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.log-body { background: var(--code-bg); }
.log-msg::before { content: "$ "; color: var(--green); }
@media (max-width: 900px) { .cmd-row { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 1180px) { .tabs .lbl-long { display: none; } .tabs .lbl-short { display: inline; } .tab { padding: 8px 10px; } }
@media (max-width: 640px) { .bp-lbl { display: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

/* ======================================================================
   Architecture diagram engine: deterministic SVG using the official AWS
   Architecture Icons, AWS group conventions and orthogonal edge routing.
   Also exports an equivalent Mermaid architecture-beta configuration.
   ====================================================================== */
const DIAG = { CW: 150, RH: 140, ICON: 48, PAD: 14, LABEL_TOP: 26, LINE_H: 14, MAX_CHARS: 17 };
const GROUP_STYLE = {
  'region': { stroke: '#00A4A6', dash: '6 4', fill: 'none', icon: 'region' },
  'vpc': { stroke: '#8C4FFF', dash: '', fill: 'none', icon: 'vpc' },
  'public-subnet': { stroke: '#7AA116', dash: '', fill: '#F2F6E8', icon: 'public-subnet' },
  'private-subnet': { stroke: '#00A4A6', dash: '', fill: '#E6F6F7', icon: 'private-subnet' },
  'az': { stroke: '#147EBA', dash: '8 4', fill: 'none', icon: null },
  'auto-scaling-group': { stroke: '#ED7100', dash: '6 4', fill: 'none', icon: 'auto-scaling-group' },
  'aws-account': { stroke: '#E7157B', dash: '', fill: 'none', icon: 'aws-account' },
  'aws-cloud': { stroke: '#232F3E', dash: '', fill: 'none', icon: 'aws-cloud' },
  'corporate-data-center': { stroke: '#7D8998', dash: '', fill: 'none', icon: 'corporate-data-center' },
  'organizations': { stroke: '#E7157B', dash: '6 4', fill: 'none', icon: 'organizations' },
  'org-ou': { stroke: '#E7157B', dash: '4 3', fill: 'none', icon: 'org-ou' }
};

function wrapLabel(text, max = DIAG.MAX_CHARS) {
  const lines = [];
  let line = '';
  String(text).split(/\s+/).forEach(word => {
    if (!line) line = word;
    else if ((line + ' ' + word).length <= max) line += ' ' + word;
    else { lines.push(line); line = word; }
  });
  if (line) lines.push(line);
  return lines.slice(0, 3);
}

function iconSvg(name, x, y, size) {
  const ic = AWS_ICON_PACK.icons[name];
  if (!ic) return `<rect x="${x}" y="${y}" width="${size}" height="${size}" rx="6" fill="#ddd"/>`;
  return `<svg x="${x}" y="${y}" width="${size}" height="${size}" viewBox="0 0 ${ic.width} ${ic.height}" overflow="hidden">${ic.body}</svg>`;
}

function layoutDiagram(spec) {
  const { CW, RH, ICON, LINE_H } = DIAG;
  const nodes = {};
  Object.entries(spec.nodes).forEach(([id, [icon, label, col, row, group]]) => {
    const lines = wrapLabel(label);
    const cx = col * CW, cy = row * RH;
    nodes[id] = {
      id, icon, label, lines, group, cx, cy,
      box: { x1: cx - 62, y1: cy - ICON / 2 - 4, x2: cx + 62, y2: cy + ICON / 2 + 8 + lines.length * LINE_H }
    };
  });
  const groups = {};
  Object.entries(spec.groups || {}).forEach(([id, [type, label, parent, members]]) => {
    groups[id] = { id, type, label, parent, members: members || null };
  });
  const depthOf = g => (g.parent && groups[g.parent] ? 1 + depthOf(groups[g.parent]) : 0);
  const union = (a, b) => (a ? { x1: Math.min(a.x1, b.x1), y1: Math.min(a.y1, b.y1), x2: Math.max(a.x2, b.x2), y2: Math.max(a.y2, b.y2) } : { ...b });
  const boxOf = g => {
    if (g.box) return g.box;
    let b = null;
    if (g.members) g.members.forEach(n => { if (nodes[n]) b = union(b, nodes[n].box); });
    else {
      Object.values(nodes).filter(n => n.group === g.id).forEach(n => { b = union(b, n.box); });
      Object.values(groups).filter(c => c.parent === g.id && !c.members).forEach(c => { b = union(b, boxOf(c)); });
      Object.values(groups).filter(c => c.parent === g.id && c.members).forEach(c => { b = union(b, boxOf(c)); });
    }
    if (!b) b = { x1: 0, y1: 0, x2: 10, y2: 10 };
    const pad = g.members ? 8 : DIAG.PAD;
    const top = g.members ? 0 : DIAG.LABEL_TOP;
    const bottom = g.members ? 22 : 0;
    g.box = { x1: b.x1 - pad, y1: b.y1 - pad - top, x2: b.x2 + pad, y2: b.y2 + pad + bottom };
    return g.box;
  };
  Object.values(groups).forEach(boxOf);
  Object.values(groups).forEach(g => { g.depth = depthOf(g); });
  return { nodes, groups };
}

function routeEdge(s, t) {
  const gap = DIAG.ICON / 2 + 6;
  const below = n => n.cy + DIAG.ICON / 2 + 8 + n.lines.length * DIAG.LINE_H;
  const dx = t.cx - s.cx, dy = t.cy - s.cy;
  if (Math.abs(dy) < 1) return [[s.cx + Math.sign(dx) * gap, s.cy], [t.cx - Math.sign(dx) * gap, t.cy]];
  if (Math.abs(dx) < 1) {
    return dy > 0 ? [[s.cx, below(s)], [t.cx, t.cy - gap]] : [[s.cx, s.cy - gap], [t.cx, below(t) + 2]];
  }
  const sx = s.cx + Math.sign(dx) * gap, ex = t.cx - Math.sign(dx) * gap;
  const mx = (s.cx + t.cx) / 2;
  return [[sx, s.cy], [mx, s.cy], [mx, t.cy], [ex, t.cy]];
}

let diagSeq = 0;
function renderArchSvg(spec) {
  const { nodes, groups } = layoutDiagram(spec);
  const uid = `d${++diagSeq}`;
  let all = null;
  const grow = b => { all = all ? { x1: Math.min(all.x1, b.x1), y1: Math.min(all.y1, b.y1), x2: Math.max(all.x2, b.x2), y2: Math.max(all.y2, b.y2) } : { ...b }; };
  Object.values(nodes).forEach(n => grow(n.box));
  Object.values(groups).forEach(g => grow(g.box));
  const M = 16;
  const vb = { x: all.x1 - M, y: all.y1 - M, w: all.x2 - all.x1 + 2 * M, h: all.y2 - all.y1 + 2 * M };
  const out = [];
  out.push(`<svg xmlns="http://www.w3.org/2000/svg" class="arch-svg" viewBox="${vb.x} ${vb.y} ${vb.w} ${vb.h}" width="${Math.round(vb.w)}" role="img" aria-label="${esc(spec.title)}" font-family="Amazon Ember, Helvetica Neue, Arial, sans-serif">`);
  out.push(`<defs><marker id="${uid}-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#545B64"/></marker></defs>`);
  out.push(`<rect x="${vb.x}" y="${vb.y}" width="${vb.w}" height="${vb.h}" fill="#ffffff"/>`);
  // Groups: outermost first; overlay groups (e.g. Auto Scaling group) drawn last without fill.
  Object.values(groups).sort((a, b) => (a.members ? 1 : 0) - (b.members ? 1 : 0) || a.depth - b.depth).forEach(g => {
    const st = GROUP_STYLE[g.type] || GROUP_STYLE['aws-cloud'];
    const b = g.box;
    out.push(`<rect x="${b.x1}" y="${b.y1}" width="${b.x2 - b.x1}" height="${b.y2 - b.y1}" fill="${g.members ? 'none' : st.fill}" stroke="${st.stroke}" stroke-width="1.6"${st.dash ? ` stroke-dasharray="${st.dash}"` : ''}/>`);
    const iconSize = 22;
    const ly = g.members ? b.y2 - iconSize : b.y1; // overlay groups label their bottom edge
    if (st.icon) out.push(iconSvg(st.icon, b.x1, ly, iconSize));
    out.push(`<text x="${b.x1 + (st.icon ? iconSize + 6 : 8)}" y="${ly + 15}" font-size="11.5" font-weight="600" fill="${st.stroke}">${esc(g.label)}</text>`);
  });
  // Edges
  const edgeLabels = [];
  (spec.edges || []).forEach(([from, to, label, style]) => {
    const s = nodes[from], t = nodes[to];
    if (!s || !t) return;
    const pts = routeEdge(s, t);
    out.push(`<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="#545B64" stroke-width="1.5"${style === 'dash' ? ' stroke-dasharray="5 4"' : ''} marker-end="url(#${uid}-arrow)"/>`);
    if (label) {
      let best = 0, bi = 0;
      for (let i = 0; i < pts.length - 1; i++) {
        const len = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]);
        if (len > best) { best = len; bi = i; }
      }
      const mx = (pts[bi][0] + pts[bi + 1][0]) / 2, my = (pts[bi][1] + pts[bi + 1][1]) / 2;
      edgeLabels.push({ x: mx, y: my, text: label });
    }
  });
  // Nodes
  Object.values(nodes).forEach(n => {
    out.push(iconSvg(n.icon, n.cx - DIAG.ICON / 2, n.cy - DIAG.ICON / 2, DIAG.ICON));
    out.push(`<text x="${n.cx}" y="${n.cy + DIAG.ICON / 2 + 15}" text-anchor="middle" font-size="12" fill="#232F3E">${n.lines.map((l, i) => `<tspan x="${n.cx}" dy="${i ? DIAG.LINE_H : 0}">${esc(l)}</tspan>`).join('')}</text>`);
  });
  edgeLabels.forEach(l => {
    const w = l.text.length * 5.6 + 8;
    out.push(`<rect x="${l.x - w / 2}" y="${l.y - 8}" width="${w}" height="15" rx="3" fill="#ffffff" stroke="#D5DBDB"/>`);
    out.push(`<text x="${l.x}" y="${l.y + 3.5}" text-anchor="middle" font-size="10" fill="#545B64">${esc(l.text)}</text>`);
  });
  out.push('</svg>');
  return out.join('');
}

// Equivalent Mermaid architecture-beta configuration (icons from the same AWS pack).
function archToMermaid(spec) {
  const clean = s => String(s).replace(/[^A-Za-z0-9 \-]/g, ' ').replace(/\s+/g, ' ').trim();
  const lines = [
    '%% Register the AWS Architecture Icons pack first, e.g.',
    '%% mermaid.registerIconPacks([{ name: "aws", icons: AWS_ICON_PACK }])',
    'architecture-beta'
  ];
  Object.entries(spec.groups || {}).forEach(([id, [type, label, parent, members]]) => {
    if (members) { lines.push(`  %% ${clean(label)} spans: ${members.join(', ')}`); return; }
    const st = GROUP_STYLE[type] || {};
    lines.push(`  group ${id}(aws:${st.icon || 'aws-cloud'})[${clean(label)}]${parent ? ` in ${parent}` : ''}`);
  });
  Object.entries(spec.nodes).forEach(([id, [icon, label, , , group]]) => {
    lines.push(`  service ${id}(aws:${icon})[${clean(label)}]${group && !(spec.groups[group] || [])[3] ? ` in ${group}` : ''}`);
  });
  (spec.edges || []).forEach(([from, to]) => {
    const a = spec.nodes[from], b = spec.nodes[to];
    if (!a || !b) return;
    const dx = b[2] - a[2], dy = b[3] - a[3];
    let s, t;
    if (Math.abs(dx) < 0.01) { s = dy > 0 ? 'B' : 'T'; t = dy > 0 ? 'T' : 'B'; }
    else { s = dx > 0 ? 'R' : 'L'; t = dx > 0 ? 'L' : 'R'; }
    lines.push(`  ${from}:${s} --> ${t}:${to}`);
  });
  return lines.join('\n');
}

  { id: 'M03', code: '03', name: 'Database Ecosystem',

      ["AWS Backup",

       "One insurance broker for all your assets instead of a separate policy per car, house and boat. Vault Lock is the clause nobody, not even you, can cancel."],
      ["AWS DMS",
       "Database Migration Service replicates data between homogeneous and heterogeneous engines with a full load plus change data capture (CDC) for minimal downtime; schema conversion via AWS SCT or DMS Schema Conversion.",
       "DMS is a live moving truck: it carries the furniture (full load) and keeps delivering anything you buy during the move (CDC) until you flip the address. SCT is the tailor who re-cuts Oracle-shaped clothes to fit PostgreSQL."],
      ["AWS Application Migration Service (MGN)",
       "Lift-and-shift rehosting of physical, virtual and cloud servers to EC2 using continuous block-level replication, non-disruptive test launches and a short cutover window.",
       "MGN photocopies a running server page by page while it keeps working, then swaps the original for the copy in minutes. 'Rehost with minimal downtime' = MGN."],
      ["AWS Elastic Disaster Recovery (DRS)",
       "Continuous block-level replication of on-premises or cloud servers into a low-cost staging area in AWS; launch recovery instances in minutes (RPO of seconds, RTO of minutes) and fail back when ready.",
       "MGN's twin with a different job: MGN moves you house once, DRS keeps a furnished spare apartment updated every second in case your house burns down."]
    ],
    notes: [
      "Transfer time = data / bandwidth. 80 TB over 50 Mbps is about 150 days, so ship Snowball. Over a fast link, use DataSync for scheduled, verified online transfers.",
      "Hybrid file access with local cache = Storage Gateway (S3 File Gateway). Managed SFTP into S3 = Transfer Family.",
      "FSx: Windows (SMB + AD), Lustre (HPC, linked to S3), NetApp ONTAP (multi-protocol, SnapMirror), OpenZFS.",
      "DR strategies by cost and RTO/RPO: backup and restore < pilot light < warm standby < multi-site active/active.",
      "AWS Backup = centralized policies, cross-account/Region copies, Vault Lock immutability. DLM = EBS snapshots and AMIs only.",
      "Database moves = DMS (full load + CDC) with SCT/DMS Schema Conversion for engine changes. Server rehost = MGN. Ongoing server DR = Elastic Disaster Recovery."
    ],
    refs: [
      ["Disaster recovery options in the cloud", "https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html"],
      ["AWS Storage Gateway", "https://docs.aws.amazon.com/storagegateway/"],

      ["Amazon FSx", "https://aws.amazon.com/fsx/"],
      ["AWS Backup Vault Lock", "https://docs.aws.amazon.com/aws-backup/latest/devguide/vault-lock.html"],

  { id: 'M06', code: '06', name: 'Advanced AWS Security',
    services: [
      ["Amazon Inspector",
       "Automated, continuous vulnerability management for EC2 instances, ECR container images and Lambda functions, scanning for software CVEs and unintended network exposure with risk scores.",
       "Inspector is the building inspector checking for cracks (CVEs) in your walls. GuardDuty watches for burglars; Inspector checks whether the windows are unlocked."],
      ["AWS CloudTrail",
       "Records API activity (management events by default, data events optional) for auditing; organization trails, log file integrity validation, CloudTrail Lake for SQL queries and Insights for unusual API activity.",
       "CloudTrail is the CCTV and visitor book of your AWS account: who did what, when, from where. 'Who deleted the bucket?' is always a CloudTrail question."],
      ["Amazon Macie",
       "Uses machine learning and pattern matching to discover and classify sensitive data (PII, financial data, credentials) in S3 and report bucket security posture.",
       "Macie is the sniffer dog trained to find PII in S3 luggage. Mnemonic: 'Macie finds the Most Classified Information in S3'."],
      ["Amazon GuardDuty",
       "Agentless intelligent threat detection that analyzes CloudTrail, VPC Flow Logs and DNS logs (plus S3, EKS, RDS, Lambda, malware and runtime protection) to find compromised instances, crypto-mining and credential misuse.",
       "GuardDuty is the night watchman on duty 24/7 reading every log for suspicious behavior; it raises the alarm but does not fix the lock."],
      ["AWS Artifact",
       "Self-service portal for AWS compliance reports (SOC, PCI DSS, ISO certifications) and agreements such as the BAA and NDA.",
       "Artifact is AWS's diploma cabinet: when an auditor asks for AWS's own certificates, you download them from Artifact."],
      ["AWS Trusted Advisor",
       "Best-practice checks across cost optimization, performance, security, fault tolerance, service limits and operational excellence; the full set of checks requires Business, Enterprise On-Ramp or Enterprise Support.",
       "Trusted Advisor is the financial advisor and home inspector in one: 'You are paying for an idle load balancer, an unattached Elastic IP, and you are near your service quota.'"],
      ["AWS Audit Manager",
       "Continuously collects evidence from your AWS usage and maps it to prebuilt or custom frameworks (PCI DSS, GDPR, HIPAA, SOC 2) to simplify audit preparation.",
       "Audit Manager is your own evidence binder filling itself up for the exam; Artifact is AWS's report card. Your homework = Audit Manager, AWS's homework = Artifact."],
      ["AWS Secrets Manager",
       "Stores, encrypts and automatically rotates secrets such as database credentials and API keys, with native rotation for RDS, Aurora, Redshift and DocumentDB and cross-Region replication.",
       "Secrets Manager is a safe that changes its own combination on a schedule and tells every authorized app the new one. Rotation is the keyword that beats Parameter Store."],
      ["AWS KMS",
       "Managed creation and control of encryption keys (AWS managed, customer managed, imported, multi-Region) with key policies, grants, envelope encryption and CloudTrail audit of every use.",
       "KMS is a bank that never lets the master key leave the vault: it encrypts small data keys (envelopes) for you. Sharing encrypted snapshots across accounts needs a customer managed key whose key policy you can edit."],
      ["AWS CloudHSM",
       "Single-tenant hardware security modules in your VPC that you exclusively control, accessed through PKCS#11, JCE and CNG, for workloads that need dedicated HSMs or custom key stores.",
       "KMS is a shared bank vault run by AWS; CloudHSM is your own private safe installed in the bank, and only you know the code."],
      ["AWS Certificate Manager (ACM)",
       "Provisions free public TLS certificates with automatic renewal (DNS validation recommended) for ELB, CloudFront and API Gateway, and imports third-party certificates. CloudFront requires certificates in us-east-1.",
       "ACM is a passport office that renews your passport automatically before it expires. CloudFront only accepts passports issued in N. Virginia (us-east-1)."],
      ["AWS Shield",
       "Shield Standard gives free automatic layer 3/4 DDoS protection; Shield Advanced adds enhanced detection, the Shield Response Team (SRT) 24/7, cost protection for scaling during attacks, and health-based detection.",
       "Shield Standard is the free lock on every door; Shield Advanced is hiring a private security firm on call 24/7 that also pays your repair bill after a riot."],
      ["AWS WAF",
       "Layer 7 web application firewall for CloudFront, ALB, API Gateway, AppSync and Cognito, with managed rule groups (SQL injection, XSS, bad bots), rate-based rules, IP sets and geo matching.",
       "WAF is the bouncer who reads what visitors say at the door: SQL injection and XSS phrases get refused, and anyone knocking too often (rate-based rule) is turned away."],
      ["AWS Network Firewall",
       "Managed stateful and stateless network firewall and IPS for VPCs, with Suricata-compatible rules and domain-list filtering for egress and ingress traffic, deployed in firewall subnets.",
       "Network Firewall is the border checkpoint for the whole VPC: it inspects every vehicle leaving or entering and only lets approved destinations (domain allowlist) through."],
      ["AWS Firewall Manager",
       "Centrally configures and enforces WAF rules, Shield Advanced, security groups, Network Firewall and Route 53 Resolver DNS Firewall across all accounts in AWS Organizations, including new accounts.",
       "Firewall Manager is the head of security for the franchise: one policy, pushed to every branch automatically, including branches that open tomorrow."],
      ["Amazon Cognito",
       "User pools provide sign-up, sign-in, MFA and social/SAML/OIDC federation for customer-facing apps (issuing JWTs); identity pools exchange identities for temporary AWS credentials.",
       "User pools = the guest list at the door (who are you?); identity pools = the wristband that lets guests use AWS rides (temporary credentials). Cognito is for customers, Identity Center for employees."],
      ["AWS Security Hub",
       "Aggregates and prioritizes findings from GuardDuty, Inspector, Macie, IAM Access Analyzer, Firewall Manager and partners across accounts and Regions, and runs automated checks against standards such as CIS and AWS Foundational Security Best Practices.",
       "Security Hub is the security operations wall of screens: every alarm from every guard in one place, graded against the rule book."]
    ],
    notes: [
      "Detect: GuardDuty (threats), Inspector (vulnerabilities), Macie (sensitive data in S3), Access Analyzer (external access). Aggregate: Security Hub. Audit trail: CloudTrail.",
      "Protect at the edge: Shield Standard (free L3/L4), Shield Advanced (SRT, cost protection), WAF (L7 rules), Network Firewall (VPC traffic), Firewall Manager (org-wide enforcement).",
      "Keys: KMS (multi-tenant managed, customer managed keys for cross-account sharing), CloudHSM (single-tenant, exclusive control, PKCS#11/JCE/CNG).",
      "Secrets: Secrets Manager (automatic rotation) vs Parameter Store (configuration, no native rotation).",
      "Compliance: Artifact = AWS's reports; Audit Manager = evidence about your own environment; Trusted Advisor = best-practice checks.",
      "Certificates: ACM auto-renews; CloudFront certificates must be in us-east-1. Customer identity = Cognito user pools."
    ],
    refs: [
      ["AWS security services overview", "https://aws.amazon.com/products/security/"],
      ["Amazon GuardDuty", "https://docs.aws.amazon.com/guardduty/latest/ug/what-is-guardduty.html"],
      ["AWS KMS concepts", "https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html"],
      ["AWS Shield Advanced", "https://docs.aws.amazon.com/waf/latest/developerguide/shield-chapter.html"],
      ["AWS WAF rate-based rules", "https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statement-type-rate-based.html"],
      ["AWS Firewall Manager", "https://docs.aws.amazon.com/waf/latest/developerguide/fms-chapter.html"],
      ["AWS Security Hub", "https://docs.aws.amazon.com/securityhub/latest/userguide/what-is-securityhub.html"]
    ] },

  { id: 'M07', code: '07/08', name: 'Advanced Networking & Edge Routing',
    services: [
      ["Amazon Route 53",
       "Authoritative DNS and domain registration with routing policies (simple, weighted, latency, failover, geolocation, geoproximity, multivalue, IP-based), health checks (endpoint, calculated, CloudWatch alarm) and alias records that work at the zone apex for free.",
       "Route 53 is the phone book with opinions: weighted = split calls by percentage, latency = nearest fast operator, failover = backup number if the first is dead, geolocation = local number by country. Alias = a speed-dial entry that follows the AWS resource even when its number changes."],
      ["AWS Global Accelerator",
       "Two static anycast IPs that route TCP/UDP traffic over the AWS backbone to the optimal healthy regional endpoint (ALB, NLB, EC2, EIP), with failover in seconds that is not affected by DNS caching.",
       "Global Accelerator puts users on an AWS express highway at the nearest on-ramp and reroutes around closed exits instantly; CloudFront is the warehouse that keeps copies near you. Accelerate non-HTTP or dynamic traffic = GA; cache content = CloudFront."],
      ["Amazon CloudFront",
       "Global CDN with edge caching, cache policies and TTLs, origin access control for private S3, signed URLs and cookies, geo restriction, WAF and Shield integration, CloudFront Functions and Lambda@Edge, and origin failover groups.",
       "CloudFront is a chain of local convenience stores stocking copies of popular items from the central warehouse (origin). Signed URL = one ticket for one show; signed cookie = a season pass for many shows."],
      ["VPC Core Concepts",
       "A regional private network with CIDR ranges, subnets per AZ (public = route to an internet gateway), route tables, internet gateways, security groups (stateful allow-lists on ENIs) and network ACLs (stateless, ordered, allow and deny on subnets).",
       "The VPC is a gated estate: subnets are streets, route tables are road signs, the internet gateway is the main gate. Security groups are each house's doorman who remembers who went out (stateful); NACLs are the street barrier that checks both directions every time (stateless)."],
      ["VPC Peering",
       "Private one-to-one connection between two VPCs (same or different account/Region) with non-overlapping CIDRs; not transitive, no hourly charge (data transfer only).",
       "Peering is a private footbridge between two estates: cheap and direct, but a bridge from A to B and B to C never lets A walk to C (no transitive routing)."],
      ["NAT Gateway",
       "Managed, AZ-scoped network address translation that lets private-subnet IPv4 instances initiate outbound internet connections while blocking inbound ones; billed per hour and per GB processed. Deploy one per AZ for HA.",
       "A one-way mail slot: residents can post letters out and receive replies, but strangers cannot knock on the door. One mail slot per street (AZ) so a blocked slot does not trap the whole estate."],
      ["VPC Endpoints",
       "Gateway endpoints (S3 and DynamoDB only) are free route-table targets; interface endpoints (PrivateLink ENIs) reach most AWS services and partner services privately, are billed hourly per AZ plus per GB, and work from on premises.",
       "Gateway endpoint = a free private tunnel to S3/DynamoDB built into the road signs. Interface endpoint = a paid private phone extension installed in your office for any service."],
      ["VPC Flow Logs",
       "Capture IP traffic metadata (source, destination, ports, protocol, bytes, ACCEPT/REJECT) for VPCs, subnets or ENIs to CloudWatch Logs, S3 or Firehose; they never capture payloads or block traffic.",
       "Flow Logs are the toll-booth receipts: who drove through, when, and whether the barrier let them in, never what was inside the car."],
      ["AWS Transit Gateway",
       "Regional hub that connects thousands of VPCs, VPNs and Direct Connect gateways with transitive routing, multiple route tables for segmentation, inter-Region peering and RAM sharing across accounts; billed per attachment-hour and per GB.",
       "Transit Gateway is the central train station: every line (VPC, VPN, DX) connects once and passengers can change trains to reach anywhere. Peering is a private footbridge; TGW is the hub."],
      ["AWS PrivateLink",
       "Exposes a service behind a Network Load Balancer (or Gateway LB) to consumer VPCs via interface endpoints: one-way, private, works with overlapping CIDRs, and does not expose the rest of either network.",
       "PrivateLink is a service hatch in the wall: consumers can pass orders through the hatch to one specific kitchen, but nobody walks into anyone's house, even if both houses have the same street number (overlapping CIDRs)."],
      ["AWS Direct Connect",
       "Dedicated (1/10/100/400 Gbps) or hosted private connections from on premises to AWS with consistent bandwidth and latency; weeks to provision, not encrypted by default (use MACsec or VPN over DX). Resiliency via multiple locations or a VPN backup.",
       "Direct Connect is a private railway line laid to AWS: fast and predictable, but it takes weeks to build and a single track is a single point of failure, so keep a VPN bus route as backup."],
      ["AWS Site-to-Site VPN",
       "IPsec VPN over the internet between a customer gateway and a virtual private gateway or Transit Gateway, with two tunnels per connection; quick to set up and cheap, but subject to internet variability (up to about 1.25 Gbps per tunnel).",
       "Site-to-Site VPN is an armored bus on public roads: ready today, cheap and encrypted, but stuck in traffic sometimes. Direct Connect is the private railway."],
      ["AWS Client VPN",
       "Managed OpenVPN-based remote access for individual users' devices into VPCs and on-premises networks, with Active Directory, SAML or certificate authentication and authorization rules.",
       "Client VPN is a personal secure tunnel for each remote employee's laptop; Site-to-Site connects buildings, Client VPN connects people."]
    ],
    notes: [
      "Security groups: stateful allow-lists on ENIs. NACLs: stateless, ordered, support explicit DENY, need ephemeral return ports.",
      "One NAT gateway per AZ with AZ-local routing avoids a cross-AZ single point of failure and cross-AZ charges.",
      "Gateway endpoints (S3, DynamoDB) are free; interface endpoints cost per hour per AZ plus per GB but work from on premises.",
      "Two VPCs = peering (cheapest). Many VPCs/VPNs/DX = Transit Gateway. Expose one service across overlapping CIDRs = PrivateLink.",
      "Route 53: latency = fastest Region, geolocation = by country, failover = active-passive, weighted = percentages, alias at the apex is free for AWS targets.",
      "CloudFront = caching + OAC + signed URLs/cookies + geo restriction. Global Accelerator = static anycast IPs, TCP/UDP, fast failover without DNS caching.",
      "VPN = fast, cheap, encrypted over internet. Direct Connect = consistent, private, weeks to provision; add a second location or a VPN backup for resiliency. Client VPN = remote users."
    ],
    refs: [
      ["NAT gateways", "https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html"],
      ["Gateway endpoints", "https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html"],
      ["What is a transit gateway?", "https://docs.aws.amazon.com/vpc/latest/tgw/what-is-transit-gateway.html"],
      ["Choosing a routing policy", "https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-policy.html"],
      ["Restrict access to an Amazon S3 origin", "https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html"],
      ["AWS Global Accelerator", "https://docs.aws.amazon.com/global-accelerator/latest/dg/what-is-global-accelerator.html"],
      ["Direct Connect resiliency recommendations", "https://aws.amazon.com/directconnect/resiliency-recommendation/"]
    ] },

  { id: 'M09', code: '09', name: 'Messaging, Decoupling & Integration',
    services: [
      ["Amazon SQS",
       "Fully managed message queue: Standard (nearly unlimited throughput, at-least-once, best-effort order) and FIFO (ordered per message group, exactly-once processing); visibility timeout, long polling, dead-letter queues, retention up to 14 days.",
       "SQS is the ticket rail in a restaurant kitchen: waiters pin orders, cooks take them at their own pace, nothing is lost during the rush. FIFO = orders for the same table (message group) are cooked strictly in sequence."],
      ["Amazon SNS",
       "Pub/sub push messaging to many subscribers (SQS, Lambda, HTTP/S, email, SMS, mobile push, Firehose) with message filtering; FIFO topics for ordered fan-out to FIFO queues.",
       "SNS is the town crier: shout once and everyone subscribed hears it at the same time. SNS + SQS fan-out = the crier announces, and each department writes the message into its own inbox (queue) to handle later."],
      ["Amazon EventBridge",
       "Serverless event bus that routes events from AWS services, your apps and SaaS partners using content-based rules to 20+ target types; also includes Scheduler, Pipes, archive and replay, and schema registry.",
       "EventBridge is the airport departures board with smart routing: every event is a passenger, rules read the ticket (content) and send them to the right gate (target). Partner event sources are connecting flights from SaaS apps."],
      ["Amazon MQ",
       "Managed Apache ActiveMQ and RabbitMQ brokers supporting industry-standard protocols (JMS, AMQP, MQTT, STOMP, OpenWire) for migrating existing messaging apps without rewriting code.",
       "Amazon MQ is the adapter plug for your old appliances: lift your ActiveMQ/RabbitMQ app onto AWS without rewiring it for SQS/SNS."],
      ["Amazon AppFlow",
       "Fully managed no-code integration that transfers data between SaaS apps (Salesforce, SAP, Zendesk, Slack, ServiceNow) and AWS services such as S3 and Redshift, on schedule, on event or on demand, with transformations.",
       "AppFlow is a scheduled courier between SaaS apps and your S3 warehouse: pick up from Salesforce at 02:00, deliver to S3, no code."],
      ["AWS AppSync",
       "Managed GraphQL (and Events) APIs that combine data from DynamoDB, Lambda, HTTP and databases, with real-time subscriptions over WebSockets and offline sync for mobile/web clients.",
       "AppSync is a personal shopper: the client hands one shopping list (GraphQL query) and gets exactly the fields it asked for from many shops, plus live updates when prices change (subscriptions)."],
      ["AWS Step Functions",
       "Serverless workflow orchestration with visual state machines: retries, catch, parallel and map states, wait states, human approval via task tokens, 200+ direct service integrations; Standard (up to 1 year, exactly-once) and Express (high volume, up to 5 minutes).",
       "Step Functions is the conductor of an orchestra: it tells each musician (Lambda, ECS, Glue) when to play, restarts a missed note (retry) and can pause for applause (human approval) for up to a year."]
    ],
    notes: [
      "Decouple producers and consumers with SQS; scale consumers on queue backlog per instance (ApproximateNumberOfMessagesVisible / instances).",
      "Standard queues: at-least-once, best-effort ordering, make consumers idempotent. FIFO: ordering per message group ID and exactly-once processing.",
      "Visibility timeout should exceed processing time; use a dead-letter queue for poison messages; long polling cuts empty receives and cost.",
      "Fan-out one event to many independent consumers = SNS topic + one SQS queue per consumer (with filter policies).",
      "Content-based routing, SaaS events and schedules = EventBridge. Existing JMS/AMQP/MQTT apps = Amazon MQ. SaaS-to-S3 data flows = AppFlow. GraphQL + real-time = AppSync.",
      "Multi-step workflows with retries, branching and human approval = Step Functions, not Lambda functions calling each other."
    ],
    refs: [
      ["Amazon SQS Developer Guide", "https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/welcome.html"],
      ["SNS fan-out to SQS", "https://docs.aws.amazon.com/sns/latest/dg/sns-sqs-as-subscriber.html"],
      ["Amazon EventBridge", "https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-what-is.html"],
      ["Scaling based on Amazon SQS", "https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-using-sqs-queue.html"],
      ["AWS Step Functions", "https://docs.aws.amazon.com/step-functions/latest/dg/welcome.html"],
      ["Amazon MQ", "https://docs.aws.amazon.com/amazon-mq/latest/developer-guide/welcome.html"]
    ] },

  { id: 'M10', code: '10/11', name: 'Containers & Serverless Architectures',
    services: [
      ["Amazon ECS",

       "ECS is the shipping company; containers are boxes. EC2 launch type = you own and maintain the ships; Fargate = you just book cargo space and the ships are someone else's problem."],
      ["Amazon EKS",
       "Managed Kubernetes control plane across multiple AZs; worker capacity from managed node groups, self-managed nodes, Fargate or Auto Mode; runs standard Kubernetes tooling (kubectl, Helm) and is portable to other Kubernetes environments.",
       "EKS is Kubernetes with AWS running the control tower. Already speak Kubernetes (Helm, manifests)? EKS. Want the simplest AWS-native option? ECS."],
      ["Amazon ECR",
       "Managed private and public container image registry with IAM access control, image scanning (basic or enhanced via Inspector), lifecycle policies, immutable tags and cross-Region/cross-account replication.",
       "ECR is the container port warehouse: images are stored, X-rayed at the gate (scanning), copied to other ports (replication) and old stock is cleared by lifecycle rules."],
      ["AWS Batch",

      ["AWS Lambda",

      ["AWS Serverless Application Repository (SAR)",

       "Amplify is a meal kit for front-end developers: all the ingredients (auth, API, storage, hosting) pre-measured, just follow the recipe from your Git repo."]
    ],
    notes: [

      "Lambda to RDS connection storms = RDS Proxy. Cold starts = provisioned concurrency or SnapStart.",

      "Beanstalk = PaaS for code with managed EC2/ELB/ASG. Amplify = front-end/full-stack hosting and CI/CD. SAR = share and deploy SAM apps.",

    refs: [

      ["Lambda quotas", "https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html"],
      ["API Gateway usage plans", "https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-api-usage-plans.html"],

  { id: 'M12', code: '12/13', name: 'Machine Learning & Generative AI',
    services: [
